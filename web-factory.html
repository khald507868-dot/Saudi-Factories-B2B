<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | صفحة المصنع: غلاف وشعار ومنتجات
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     مقابلها في التطبيق: app-factory.html
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="factory_page_title">صفحة المصنع - المصانع السعودية</title>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>var SF_PUBLIC_PAGE = true;</script>
<script src="auth-guard.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== الرأس ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 18px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e2e6e3;
  }

  .page-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #04361b;
  }

  .back-btn {
    position: absolute;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  html[dir="ltr"] .back-btn {
    right: auto;
    left: 16px;
  }

  html[dir="ltr"] .back-btn svg {
    transform: scaleX(-1);
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  .content-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 0 20px;
  }

  /* ===== الغلاف والشعار ===== */
  .cover-block {
    position: relative;
    background: #ffffff;
    margin-bottom: 0;
  }

  .cover-image {
    width: 100%;
    /* ارتفاع ثابت لا نسبة — فالنسبة تكبر مع عرض
       الحاوية، فيبتلع الغلاف الشاشة كلّما اتّسعت. ولينكدإن
       يستخدم ارتفاعاً ثابتاً للسبب نفسه. */
    height: 134px;
    background: #e6e9e7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    overflow: hidden;
  }

  .cover-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cover-image svg {
    width: 38px;
    height: 38px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  .cover-image .hint {
    font-size: 12.5px;
    color: #04361b;
    font-weight: 600;
  }

  /* أزرار حذف الغلاف والشعار — تظهر عند وجود صورة فقط */
  .cover-del,
  .logo-del {
    position: absolute;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    color: #c0392b;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    display: none;
    z-index: 3;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
  }

  .cover-del {
    top: 10px;
    inset-inline-start: 10px;
  }

  /* الزرّ شقيق لـ.logo-circle لا ابن لها: fillSlot تمسح
     innerHTML عند وضع الصورة فتبتلع أي زرّ بالداخل، و
     overflow: hidden تقصّ ما يخرج عن حدودها. فيُوضع خارجها
     ويُحاذى بالحساب: المربّع 72px عند right: 18px و
     bottom: -28px من .cover-block. */
  .logo-del {
    bottom: -34px;
    right: 12px;
    width: 21px;
    height: 21px;
    font-size: 12px;
  }

  html[dir="ltr"] .logo-del { right: auto; left: 12px; }

  .cover-image.has-image ~ .cover-del,
  .logo-circle.has-image ~ .logo-del { display: block; }

  body.view-only .cover-del,
  body.view-only .logo-del { display: none !important; }

  .logo-circle {
    position: absolute;
    bottom: -28px;
    right: 18px;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: #ffffff;
    border: 3px dashed #c7d0ca;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.12);
  }

  html[dir="ltr"] .logo-circle {
    right: auto;
    left: 18px;
  }

  .logo-circle.has-image {
    border-style: solid;
    border-color: #ffffff;
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo-circle svg {
    width: 24px;
    height: 24px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
  }

  /* ===== ترويسة المصنع — الاسم والبيانات والتبويبات ===== */
  /* الحشو العلوي يترك مكاناً للشعار المتدلّي من الغلاف */
  .fx-head {
    background: #ffffff;
    /* 34px يكفي لتجاوز الشعار المتدلّي (bottom: -28px) */
    padding: 34px 18px 0;
    margin-bottom: 14px;
  }

  .fx-name {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    color: #04361b;
    line-height: 1.3;
  }

  .fx-verified {
    width: 18px;
    height: 18px;
    flex: none;
    fill: #45a06a;
    stroke: none;
    display: none;
  }

  .fx-verified.is-on { display: block; }

  .fx-verified .fx-check {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* أيقونة تعديل اسم المصنع — بديلة عن بطاقة مستقلّة */
  .fx-name-edit {
    width: 26px;
    height: 26px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #e3e8e5;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
    padding: 0;
  }

  .fx-name-edit:active { background: #f2f5f3; }

  .fx-name-edit svg {
    width: 13px;
    height: 13px;
    stroke: #6b7d72;
    fill: none;
    stroke-width: 2;
  }

  body.view-only .fx-name-edit { display: none; }

  /* حقل الاسم داخل الترويسة — يظهر بدل العنوان أثناء التحرير */
  .fx-name-input {
    width: 100%;
    border: 1px solid #c7d0ca;
    border-radius: 9px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 21px;
    font-weight: 800;
    color: #04361b;
    background: #ffffff;
    text-align: right;
  }

  html[dir="ltr"] .fx-name-input { text-align: left; }

  .fx-name-input:focus {
    outline: none;
    border-color: #45a06a;
  }

  .fx-tagline {
    margin: 5px 0 0;
    font-size: 14px;
    color: #33463b;
    line-height: 1.5;
  }

  .fx-tagline:empty { display: none; }

  /* سطر البيانات مفصول بنقاط — يُبنى من الجافاسكربت */
  .fx-meta {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: #6b7d72;
    line-height: 1.6;
  }

  .fx-meta:empty { display: none; }

  .fx-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    border-bottom: 1px solid #e6e9e7;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .fx-tabs::-webkit-scrollbar { display: none; }

  .fx-tab {
    flex: none;
    padding: 11px 14px;
    border: none;
    background: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: #6b7d72;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
  }

  .fx-tab.is-active {
    color: #04361b;
    border-bottom-color: #04361b;
  }

  /* ===== لوحة المراسلات المطويّة =====
     تلتصق بزاوية بداية القراءة — مرآة تتبع الاتجاه.
     والطيّ بتحديد ارتفاع الجسم لا بـdisplay لتبقى الحركة ناعمة. */
  .msg-dock {
    position: fixed;
    bottom: 0;
    right: 18px;
    z-index: 70;
    width: 288px;
    max-width: calc(100vw - 36px);
    background: #ffffff;
    border: 1px solid #e6e9e7;
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -2px 14px rgba(4, 54, 27, 0.13);
    overflow: hidden;
  }

  html[dir="ltr"] .msg-dock { right: auto; left: 18px; }

  .msg-dock-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: none;
    font: inherit;
    cursor: pointer;
    text-align: start;
  }

  .msg-dock-avatar {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 50%;
    background: #04361b;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
  }

  .msg-dock-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    color: #04361b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-dock-count {
    flex: none;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 999px;
    background: #c0392b;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    line-height: 19px;
    text-align: center;
    display: none;
  }

  .msg-dock-count.is-on { display: block; }

  .msg-dock-arrow {
    width: 18px;
    height: 18px;
    flex: none;
    fill: none;
    stroke: #04361b;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s ease;
  }

  .msg-dock.is-open .msg-dock-arrow { transform: rotate(180deg); }

  .msg-dock-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.24s ease;
    border-top: 1px solid transparent;
  }

  .msg-dock.is-open .msg-dock-body {
    max-height: 340px;
    overflow-y: auto;
    border-top-color: #e6e9e7;
  }

  .msg-dock-empty {
    margin: 0;
    padding: 22px 14px;
    text-align: center;
    font-size: 12.5px;
    color: #6b7d72;
  }

  .msg-dock-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    border-bottom: 1px solid #f0f2f0;
    text-decoration: none;
    cursor: pointer;
  }

  .msg-dock-item:last-child { border-bottom: none; }
  .msg-dock-item:active { background: #f6f8f6; }

  .msg-dock-item-avatar {
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 50%;
    background: #eef1ef;
    color: #04361b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    overflow: hidden;
  }

  .msg-dock-item-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .msg-dock-item-text {
    flex: 1;
    min-width: 0;
  }

  .msg-dock-item-name {
    font-size: 13px;
    font-weight: 700;
    color: #04361b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-dock-item-last {
    margin-top: 2px;
    font-size: 11.5px;
    color: #6b7d72;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-dock-item-date {
    flex: none;
    font-size: 10.5px;
    color: #93a399;
  }

  /* ===== بطاقة النبذة بنمط لينكدإن =====
     عنوان ثم نصّ حرّ ثم صفوف معنونة. */
  .about-h {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 800;
    color: #04361b;
  }

  /* التسمية باقية لقارئات الشاشة ومخفيّة بصريّاً */
  .sr-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .about-rows {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .about-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .about-label {
    font-size: 13px;
    font-weight: 800;
    color: #04361b;
  }

  .about-value {
    font-size: 13.5px;
    color: #33463b;
    line-height: 1.6;
    word-break: break-word;
  }

  .about-link { text-decoration: none; color: #1a6fd4; }
  .about-link:hover { text-decoration: underline; }

  .about-input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #d8ded9;
    border-radius: 9px;
    font: inherit;
    font-size: 13.5px;
    color: #04361b;
    background: #ffffff;
    outline: none;
  }

  .about-input:focus { border-color: #45a06a; }

  /* في وضع التحرير تظهر الحقول، وفي وضع العرض القيم */
  body:not(.view-only) .about-value { display: none; }
  body.view-only .about-input { display: none; }

  /* صفّ فارغ لا يُعرض على الزائر */
  .about-row.is-empty { display: none; }

  /* صفّان لا يُحرّران — التوثيق من حالة الاعتماد،
     والمقرّ من عنوان التسجيل */
  #row-verified .about-value,
  #row-hq .about-value { display: block; }

  /* ===== المنشورات ===== */
  .posts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .post-item {
    position: relative;
    border: 1px solid #e6e9e7;
    border-radius: 12px;
    padding: 13px 14px;
    background: #fbfcfb;
  }

  .post-item textarea {
    width: 100%;
    min-height: 62px;
    border: none;
    background: none;
    resize: vertical;
    font: inherit;
    font-size: 13.5px;
    color: #04361b;
    line-height: 1.7;
    outline: none;
    padding: 0;
  }

  .post-read {
    font-size: 13.5px;
    color: #04361b;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* وسائط المنشور — صورة أو مقطع */
  .post-media {
    margin-top: 10px;
    border-radius: 10px;
    overflow: hidden;
    background: #f2f5f3;
  }

  .post-media img,
  .post-media video {
    display: block;
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    background: #000000;
  }

  .post-media-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .post-media-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #d6ded9;
    border-radius: 999px;
    background: #ffffff;
    color: #04361b;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    cursor: pointer;
  }

  .post-media-btn:active { background: #f2f5f3; }

  .post-media-btn svg {
    width: 15px;
    height: 15px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2;
  }

  .post-media-clear { color: #c0392b; border-color: #f0d5d1; }
  .post-media-clear svg { stroke: #c0392b; }

  body.view-only .post-media-row { display: none; }

  .post-date {
    margin-top: 8px;
    font-size: 11.5px;
    color: #6b7d72;
  }

  .post-delete {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: #fdecec;
    color: #c0392b;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  html[dir="ltr"] .post-delete { left: auto; right: 8px; }

  body.view-only .post-delete,
  body.view-only #add-post-btn { display: none; }

  /* إخفاء الأقسام حسب التبويب المختار — الصنف على body */
  body.tab-posts    #card-about,
  body.tab-posts    #card-products,
  body.tab-about    #card-posts,
  body.tab-about    #card-products,
  body.tab-products #card-about,
  body.tab-products #card-posts { display: none !important; }

  /* ===== زر مراسلة المصنع ===== */
  /* ===== البطاقات ===== */
  .card {
    background: #ffffff;
    border-radius: 14px;
    margin: 0 14px 14px;
    padding: 16px 14px;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.06);
  }

  .card label {
    display: block;
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: #04361b;
    margin-bottom: 8px;
  }

  html[dir="ltr"] .card label {
    text-align: left;
  }

  .card input[type="text"],
  .card textarea {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    background: #ffffff;
    text-align: right;
    outline: none;
    resize: vertical;
  }

  html[dir="ltr"] .card input[type="text"],
  html[dir="ltr"] .card textarea {
    text-align: left;
  }

  .card input[type="text"]:focus,
  .card textarea:focus {
    border-color: #04361b;
  }

  .card input::placeholder,
  .card textarea::placeholder {
    color: #9aa8a0;
  }

  .card textarea {
    min-height: 96px;
    line-height: 1.6;
  }

  /* ===== المنتجات ===== */
  .products-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .products-head h2 {
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
  }

  .add-product-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    background: #04361b;
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 14px;
    cursor: pointer;
  }

  .add-product-btn svg {
    width: 15px;
    height: 15px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 2.4;
  }

  .products-empty {
    text-align: center;
    color: #9aa8a0;
    font-size: 13.5px;
    padding: 22px 0;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-card {
    position: relative;
    border: 1px solid #eef1ee;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
  }

  .product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eef1ee;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }

  .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .product-image svg {
    width: 26px;
    height: 26px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  /* سلايدر صور المنتج — سحب بالإصبع ودوران تلقائي */
  .product-slider {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #eef1ee;
    touch-action: pan-y;
  }

  .product-track {
    display: flex;
    height: 100%;
    will-change: transform;
  }

  /* المسار يتبع اتجاه القراءة: الشريحة الأولى في بداية الاتجاه */
  .product-slide {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .product-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }

  .product-dots {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 2;
  }

  .product-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }

  .product-dot.is-active {
    background: #ffffff;
    width: 16px;
    border-radius: 4px;
  }

  /* شريط مصغّرات المنتج — مخفي حتى يطلبه صاحب المصنع */
  .product-thumbs {
    display: none;
    gap: 6px;
    padding: 8px 8px 0;
    flex-wrap: wrap;
  }

  .product-thumbs.is-open { display: flex; }

  /* زر إظهار المصغّرات — لصاحب المصنع وحده */
  .product-edit-imgs {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 8px 8px 0;
    border: 1px solid #e3e8e5;
    border-radius: 8px;
    background: #ffffff;
    color: #6b7d72;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 9px;
    cursor: pointer;
  }

  .product-edit-imgs:active { background: #f2f5f3; }

  .product-edit-imgs svg {
    width: 13px;
    height: 13px;
    stroke: #6b7d72;
    fill: none;
    stroke-width: 2;
  }

  body.view-only .product-edit-imgs { display: none; }

  .product-thumb {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 7px;
    overflow: hidden;
    border: 2px solid transparent;
    background: #eef1ee;
    cursor: pointer;
    flex: none;
  }

  .product-thumb.is-active { border-color: #04361b; }

  .product-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .product-thumb-del {
    position: absolute;
    top: 0;
    inset-inline-end: 0;
    width: 15px;
    height: 15px;
    border: none;
    border-radius: 0 0 0 6px;
    background: rgba(192, 57, 43, 0.9);
    color: #ffffff;
    font-size: 10px;
    line-height: 15px;
    padding: 0;
    cursor: pointer;
  }

  .product-thumb-add {
    width: 40px;
    height: 40px;
    border: 1.5px dashed #c7d0ca;
    border-radius: 7px;
    background: #ffffff;
    color: #04361b;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }

  .product-thumb-add:active { background: #f2f5f3; }

  body.view-only .product-thumb-del,
  body.view-only .product-thumb-add { display: none; }

  .product-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .product-body input {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
    color: #04361b;
    text-align: right;
    outline: none;
  }

  html[dir="ltr"] .product-body input {
    text-align: left;
  }

  .product-body input:focus {
    border-color: #04361b;
  }

  .product-body input::placeholder {
    color: #9aa8a0;
  }

  .price-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .price-row input {
    flex: 1;
  }

  .price-row .currency {
    font-size: 12.5px;
    font-weight: 700;
    color: #04361b;
    flex-shrink: 0;
  }

  .product-delete {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.92);
    color: #b3261e;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
  }

  html[dir="ltr"] .product-delete {
    left: auto;
    right: 6px;
  }

  /* ===== تنبيه امتلاء التخزين ===== */
  .storage-warning {
    display: none;
    margin: 0 14px 14px;
    padding: 11px 13px;
    border-radius: 10px;
    background: #fdecea;
    border: 1px solid #f5c6c2;
    color: #b3261e;
    font-size: 13px;
    line-height: 1.5;
  }

  .storage-warning.show {
    display: block;
  }

  /* ===== وضع العرض فقط (حساب الأفراد) ===== */
  /* الأفراد يتصفحون المصنع فقط — الإضافة والتعديل للمصانع وحدها */
  body.view-only .cover-image,
  body.view-only .logo-circle,
  body.view-only .product-image {
    cursor: default;
  }

  /* إخفاء زر إضافة منتج وزر حذف المنتج */
  body.view-only .add-product-btn,
  body.view-only .product-delete {
    display: none;
  }

  /* الشعار الفارغ لا يظهر كمكان قابل للإضافة */
  body.view-only .logo-circle:not(.has-image) {
    display: none;
  }

  /* الغلاف الفارغ: أيقونة رمادية بدون نص "اضغط لإضافة" */
  body.view-only .cover-image:not(.has-image) svg {
    stroke: #b6c0ba;
  }

  body.view-only .cover-image .hint {
    display: none;
  }

  /* الزائر يرى متجراً لا نموذج إدخال: "اسم المصنع"
     و"نبذة عن المصنع" تسميات حقول، والاسم نفسه هو
     عنوان الصفحة فلا يحتاج تسمية فوقه. */

  body.view-only .read-name {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.4;
  }

  /* الغلاف الفارغ لا يأخذ مساحة ضخمة من الزائر */
  body.view-only .cover-image:not(.has-image) {
    aspect-ratio: auto;
    min-height: 130px;
  }

  /* بطاقة فارغة لا تُعرض أصلاً للزائر */
  body.view-only .card.is-empty { display: none; }

  /* الاسم والنبذة يعرضان كنص بدل حقول الإدخال */
  .read-text {
    font-size: 14px;
    line-height: 1.7;
    color: #04361b;
    text-align: right;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  html[dir="ltr"] .read-text {
    text-align: left;
  }

  .read-text.empty {
    color: #9aa8a0;
  }

  .read-name {
    font-size: 17px;
    font-weight: 700;
    color: #04361b;
  }

  /* اسم المنتج وسعره كنص في وضع العرض */
  .product-read-name {
    font-size: 13px;
    font-weight: 600;
    color: #04361b;
    text-align: right;
    word-wrap: break-word;
  }

  html[dir="ltr"] .product-read-name {
    text-align: left;
  }

  .product-read-price {
    font-size: 13px;
    font-weight: 700;
    color: #04361b;
  }
</style>

  <input type="file" id="image-file-input" accept="image/*" style="display:none;">
  <input type="file" id="video-file-input" accept="video/*" style="display:none;">

  <script>
    (function () {
      var STORE_KEY = "sf_factories";
      var LEGACY_KEY = "sf_factory_images";

      var params = new URLSearchParams(window.location.search);
      var factoryId = params.get("id") || "0";

      /* الأفراد يتصفحون فقط — إضافة الصور والنبذة والمنتجات ميزة للمصانع */
      var accountType = "";
      try {
        accountType = localStorage.getItem("sf_account_type") || "";
      } catch (err) {}
      var canEdit = accountType === "factory";
      if (!canEdit) document.body.classList.add("view-only");

      /* زر المراسلة يفتح محادثة هذا المصنع في صفحة الرسائل */
      var coverEl = document.getElementById("cover-image");
      var logoEl = document.getElementById("logo-circle");
      var nameInput = document.getElementById("factory-name");
      var aboutInput = document.getElementById("factory-about");
      var productsGrid = document.getElementById("products-grid");
      var productsEmpty = document.getElementById("products-empty");
      var addProductBtn = document.getElementById("add-product-btn");
      var fileInput = document.getElementById("image-file-input");
      var videoInput = document.getElementById("video-file-input");
      var storageWarning = document.getElementById("storage-warning");

      var allFactories = {};
      try {
        allFactories = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      } catch (err) {
        allFactories = {};
      }

      var data = allFactories[factoryId];
      if (!data) {
        data = { name: "", about: "", cover: "", logo: "", products: [] };
        /* نقل الصور المحفوظة سابقاً من صفحة المصانع */
        try {
          var legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "{}");
          if (legacy["img-" + factoryId]) data.cover = legacy["img-" + factoryId];
          if (legacy["logo-" + factoryId]) data.logo = legacy["logo-" + factoryId];
        } catch (err) {}
      }
      if (!data.products) data.products = [];

      function save() {
        allFactories[factoryId] = data;
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(allFactories));
          storageWarning.classList.remove("show");
        } catch (err) {
          storageWarning.classList.add("show");
        }
      }

      /* تصغير الصورة قبل الحفظ حتى لا تمتلئ مساحة التخزين بسرعة */
      function resizeImage(dataUrl, maxSize, done) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          done(canvas.toDataURL("image/jpeg", 0.8));
        };
        img.onerror = function () { done(dataUrl); };
        img.src = dataUrl;
      }

      var pendingTarget = null;

      function pickImage(maxSize, onPicked) {
        pendingTarget = { maxSize: maxSize, onPicked: onPicked };
        fileInput.value = "";
        fileInput.click();
      }

      fileInput.addEventListener("change", function () {
        var file = fileInput.files[0];
        if (!file || !pendingTarget) return;
        var target = pendingTarget;
        var reader = new FileReader();
        reader.onload = function (e) {
          resizeImage(e.target.result, target.maxSize, function (resized) {
            target.onPicked(resized);
            save();
          });
        };
        reader.readAsDataURL(file);
      });

      /* المقاطع لا تُصغَّر — لا مسار canvas لها — فيحدّها الحجم وحده.
         حدّ localStorage قرابة 5MB لكل الموقع، فمقطع كبير يبتلعها
         ويمنع حفظ كل شيء بعده. يُرفع الحدّ عند ربط تخزين Supabase. */
      var VIDEO_MAX_BYTES = 2 * 1024 * 1024;
      var pendingVideo = null;

      function pickVideo(onPicked) {
        pendingVideo = onPicked;
        videoInput.value = "";
        videoInput.click();
      }

      videoInput.addEventListener("change", function () {
        var file = videoInput.files[0];
        if (!file || !pendingVideo) return;
        var onPicked = pendingVideo;
        pendingVideo = null;

        if (file.size > VIDEO_MAX_BYTES) {
          alert(I18N.t("video_too_large"));
          return;
        }

        var reader = new FileReader();
        reader.onload = function (e) {
          onPicked(e.target.result);
          save();
        };
        reader.readAsDataURL(file);
      });

      function fillSlot(el, dataUrl) {
        var img = document.createElement("img");
        img.alt = "";
        img.src = dataUrl;
        el.innerHTML = "";
        el.appendChild(img);
        el.classList.add("has-image");
      }

      /* ===== الغلاف والشعار ===== */
      /* حالة الفراغ محفوظة قبل أي تعبئة، ليعيدها زرّ الحذف */
      var COVER_EMPTY_HTML = coverEl.innerHTML;
      var LOGO_EMPTY_HTML = logoEl.innerHTML;

      if (data.cover) fillSlot(coverEl, data.cover);
      if (data.logo) fillSlot(logoEl, data.logo);

      if (canEdit) {
        coverEl.addEventListener("click", function () {
          pickImage(640, function (dataUrl) {
            data.cover = dataUrl;
            fillSlot(coverEl, dataUrl);
          });
        });

        logoEl.addEventListener("click", function () {
          pickImage(180, function (dataUrl) {
            data.logo = dataUrl;
            fillSlot(logoEl, dataUrl);
          });
        });

        /* الحذف يعيد العنصر إلى حالته الفارغة: أيقونة الإضافة
           بدل الصورة، فيبقى قابلاً للنقر لرفع صورة جديدة. */
        var coverDelBtn = document.getElementById("cover-del");
        var logoDelBtn = document.getElementById("logo-del");

        if (coverDelBtn) {
          coverDelBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            data.cover = "";
            coverEl.classList.remove("has-image");
            coverEl.innerHTML = COVER_EMPTY_HTML;
            save();
          });
        }

        if (logoDelBtn) {
          logoDelBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            data.logo = "";
            logoEl.classList.remove("has-image");
            logoEl.innerHTML = LOGO_EMPTY_HTML;
            save();
          });
        }

      }

      /* ===== الاسم والنبذة ===== */
      if (canEdit) {
        nameInput.value = data.name || "";
        aboutInput.value = data.about || "";

        nameInput.addEventListener("input", function () {
          data.name = nameInput.value;
          save();
        });

        /* الاسم يُحرَّر من الترويسة مباشرة: أيقونة القلم تبدّل
           بين العنوان والحقل، فلا حاجة لبطاقة مستقلّة. */
        var nameEditBtn = document.getElementById("fx-name-edit");
        var nameTitleEl = document.getElementById("fx-name");

        function closeNameEdit() {
          nameInput.style.display = "none";
          nameTitleEl.style.display = "";
          renderHead();
        }

        if (nameEditBtn) {
          nameEditBtn.addEventListener("click", function () {
            nameTitleEl.style.display = "none";
            nameInput.style.display = "";
            nameInput.focus();
            nameInput.select();
          });
        }

        nameInput.addEventListener("blur", closeNameEdit);
        nameInput.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === "Escape") {
            ev.preventDefault();
            nameInput.blur();
          }
        });

        aboutInput.addEventListener("input", function () {
          data.about = aboutInput.value;
          save();
        });
      } else {
        /* استبدال حقول الإدخال بنص للقراءة.
           الاسم لا يُستبدل: صار داخل الترويسة ومخفياً للزائر. */
        showAsText(aboutInput, data.about, I18N.t("factory_no_about"), "");

        /* بطاقة النبذة الفارغة تُخفى عن الزائر بدل عرض
           عنوان فوق نص "لا توجد نبذة" */
        if (!data.about) {
          var aboutCard = document.getElementById("card-about");
          if (aboutCard) aboutCard.classList.add("is-empty");
        }
      }

      /* تحويل حقل إدخال إلى نص ثابت في وضع العرض */
      function showAsText(field, value, emptyText, extraClass) {
        var el = document.createElement("div");
        el.className = "read-text" + (extraClass ? " " + extraClass : "");
        if (value) {
          el.textContent = value;
        } else {
          el.textContent = emptyText;
          el.classList.add("empty");
        }
        field.parentNode.replaceChild(el, field);
      }

      /* ===== ترويسة المصنع ===== */
      var headNameEl  = document.getElementById("fx-name-text");
      var headVerifEl = document.getElementById("fx-verified");
      var headTagEl   = document.getElementById("fx-tagline");
      var headMetaEl  = document.getElementById("fx-meta");

      /* سطر البيانات يعرض الموجود وحده — فالحقول الخالية
         تُسقط بدل أن تترك نقاطاً فاصلة معلّقة */
      function renderHead() {
        var shownName = data.name || I18N.t("factory_no_name");
        headNameEl.textContent = shownName;

        /* علامة التوثيق تظهر للمصنع المُعتمد فقط.
           والاعتماد لمّا يُقرأ من القاعدة بعد، فتبقى مخفية. */
        if (data.verified) {
          headVerifEl.classList.add("is-on");
          headVerifEl.setAttribute("aria-label", I18N.t("factory_verified"));
        } else {
          headVerifEl.classList.remove("is-on");
        }

        /* السطر الفارغ يُخفى لا يُترك: العنصر الفارغ يظل يحجز
           ارتفاع سطره فينتج فراغ أبيض تحت الغلاف. */
        headTagEl.textContent = data.tagline ||
          ((typeof industryLabel === "function") ? industryLabel() : "");
        headTagEl.style.display = headTagEl.textContent ? "" : "none";

        var bits = [];
        var ind = (typeof industryLabel === "function") ? industryLabel() : "";
        if (ind) bits.push(ind);
        if (data.address_city) bits.push(data.address_city);
        var count = (data.products || []).length;
        if (count) bits.push(count + " " + I18N.t("factory_products_count"));
        headMetaEl.textContent = bits.join(" · ");
        headMetaEl.style.display = headMetaEl.textContent ? "" : "none";
      }

      /* التبويبات تُبدّل المحتوى لا تمرّر إليه — والإخفاء
         بصنف على body لا بـstyle مباشر، ليبقى القرار في CSS.
         و"الرئيسية" بلا صنف — فتظهر النبذة والمنشورات معاً. */
      var TAB_CLASSES = ["tab-posts", "tab-about", "tab-products"];
      var tabsWrap = document.getElementById("fx-tabs");

      function selectTab(name) {
        for (var i = 0; i < TAB_CLASSES.length; i++) {
          document.body.classList.remove(TAB_CLASSES[i]);
        }
        if (name !== "home") document.body.classList.add("tab-" + name);

        var all = tabsWrap.querySelectorAll(".fx-tab");
        for (var j = 0; j < all.length; j++) {
          all[j].classList.toggle("is-active",
            all[j].getAttribute("data-tab") === name);
        }
      }

      if (tabsWrap) {
        tabsWrap.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".fx-tab");
          if (!btn) return;
          selectTab(btn.getAttribute("data-tab"));
        });
      }

      /* ===== تفاصيل النبذة =====
         القطاع وحجم الشركة والموقع أعمدة جديدة في القاعدة
         (add-factory-profile.sql) — وتُحفظ هنا في sf_factories ريثما
         تُربط الصفحة بالقاعدة. */
      var SIZE_RANGES = ["1-10", "11-50", "51-200", "201-500",
                         "501-1000", "1001-5000", "5000+"];

      var websiteInput = document.getElementById("f-website");
      var industrySel  = document.getElementById("f-industry");
      var sizeSel      = document.getElementById("f-size");

      /* القطاعات من i18n لا من قائمة محليّة، فتتبع اللغة */
      function fillIndustryOptions() {
        var cats = I18N.categories || [];
        industrySel.innerHTML = "";
        var blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "—";
        industrySel.appendChild(blank);
        /* فئات i18n كائنات {ar, en} بلا معرّف، وcategoryName تأخذ
           الكائن نفسه لا مفتاحاً. فالاسم الإنجليزي هو المعرّف
           المخزّن — يبقى ثابتاً مهما تغيّرت لغة الواجهة. */
        cats.forEach(function (c) {
          var opt = document.createElement("option");
          opt.value = c.en || "";
          opt.textContent = I18N.categoryName(c);
          industrySel.appendChild(opt);
        });
      }

      function fillSizeOptions() {
        sizeSel.innerHTML = "";
        var blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "—";
        sizeSel.appendChild(blank);
        SIZE_RANGES.forEach(function (r) {
          var opt = document.createElement("option");
          opt.value = r;
          opt.textContent = r;
          sizeSel.appendChild(opt);
        });
      }

      /* المقرّ يُبنى من عنوان التسجيل — ولا يُحرّر هنا */
      function hqText() {
        var bits = [];
        if (data.address_district) bits.push(data.address_district);
        if (data.address_city) bits.push(data.address_city);
        return bits.join("، ");
      }

      /* المخزّن هو الاسم الإنجليزي، فيُبحث عن كائنه ليُترجم */
      function industryLabel() {
        if (!data.industry) return "";
        var cats = I18N.categories || [];
        for (var i = 0; i < cats.length; i++) {
          if (cats[i].en === data.industry) return I18N.categoryName(cats[i]);
        }
        return data.industry;
      }

      function renderAbout() {
        document.getElementById("v-website").textContent = data.website || "";
        document.getElementById("v-website").href = data.website || "#";
        document.getElementById("v-industry").textContent = industryLabel();
        document.getElementById("v-size").textContent = data.company_size || "";
        document.getElementById("v-hq").textContent = hqText();
        document.getElementById("v-verified").textContent =
          data.verified ? I18N.t("factory_verified") : "";

        /* الزائر لا يرى صفّاً فارغاً، والمالك يراه ليملأه */
        if (!canEdit) {
          var pairs = [["row-website", data.website],
                       ["row-industry", data.industry],
                       ["row-size", data.company_size],
                       ["row-hq", hqText()],
                       ["row-verified", data.verified]];
          pairs.forEach(function (pair) {
            var el = document.getElementById(pair[0]);
            if (el) el.classList.toggle("is-empty", !pair[1]);
          });
        } else {
          /* المقرّ والتوثيق لا يُدخلان، فيُخفيان إن خلوا */
          var hqRow = document.getElementById("row-hq");
          if (hqRow) hqRow.classList.toggle("is-empty", !hqText());
          var vRow = document.getElementById("row-verified");
          if (vRow) vRow.classList.toggle("is-empty", !data.verified);
        }
      }

      if (canEdit) {
        fillIndustryOptions();
        fillSizeOptions();

        websiteInput.value = data.website || "";
        industrySel.value  = data.industry || "";
        sizeSel.value      = data.company_size || "";

        websiteInput.addEventListener("input", function () {
          data.website = websiteInput.value.trim();
          save();
        });
        industrySel.addEventListener("change", function () {
          data.industry = industrySel.value;
          save();
          renderAbout();
          renderHead();
        });
        sizeSel.addEventListener("change", function () {
          data.company_size = sizeSel.value;
          save();
        });
      }

      /* ===== لوحة المراسلات =====
         تقرأ sf_messages وتعرض المحادثات مرتّبة من الأحدث.
         وكلّ صفّ يقود إلى المحادثة في web-messages.html. */
      var dockEl      = document.getElementById("msg-dock");
      var dockHeadEl  = document.getElementById("msg-dock-head");
      var dockListEl  = document.getElementById("msg-dock-list");
      var dockEmptyEl = document.getElementById("msg-dock-empty");
      var dockCountEl = document.getElementById("msg-dock-count");
      var dockAvatarEl = document.getElementById("msg-dock-avatar");

      function firstLetter(txt) {
        return (txt || "?").trim().charAt(0) || "?";
      }

      function dockDate(ts) {
        if (!ts) return "";
        var d = new Date(ts);
        if (isNaN(d.getTime())) return "";
        return (d.getMonth() + 1) + "/" + d.getDate();
      }

      function renderDock() {
        var threads = {};
        try {
          threads = JSON.parse(localStorage.getItem("sf_messages") || "{}") || {};
        } catch (e) {}

        var ids = Object.keys(threads).sort(function (a, b) {
          return (threads[b].updated || 0) - (threads[a].updated || 0);
        });

        dockListEl.innerHTML = "";
        dockEmptyEl.style.display = ids.length ? "none" : "";
        dockCountEl.classList.toggle("is-on", ids.length > 0);
        dockCountEl.textContent = ids.length ? String(ids.length) : "";

        ids.forEach(function (id) {
          var t = threads[id] || {};
          var row = document.createElement("a");
          row.className = "msg-dock-item";
          row.href = "web-messages.html?open=" + encodeURIComponent(id);

          var av = document.createElement("span");
          av.className = "msg-dock-item-avatar";
          if (t.avatar) {
            var img = document.createElement("img");
            img.src = t.avatar;
            img.alt = "";
            av.appendChild(img);
          } else {
            av.textContent = firstLetter(t.name);
          }

          var txt = document.createElement("span");
          txt.className = "msg-dock-item-text";

          var nm = document.createElement("span");
          nm.className = "msg-dock-item-name";
          nm.textContent = t.name || "";

          var last = document.createElement("span");
          last.className = "msg-dock-item-last";
          var msgs = t.messages || [];
          var lastMsg = msgs.length ? msgs[msgs.length - 1] : null;
          last.textContent = lastMsg ? (lastMsg.text || "") : "";

          txt.appendChild(nm);
          txt.appendChild(last);

          var dt = document.createElement("span");
          dt.className = "msg-dock-item-date";
          dt.textContent = dockDate(t.updated);

          row.appendChild(av);
          row.appendChild(txt);
          row.appendChild(dt);
          dockListEl.appendChild(row);
        });
      }

      if (dockHeadEl && dockEl) {
        dockAvatarEl.textContent = firstLetter(I18N.t("msg_panel_title"));
        dockHeadEl.addEventListener("click", function () {
          var open = dockEl.classList.toggle("is-open");
          dockHeadEl.setAttribute("aria-expanded", open ? "true" : "false");
        });
        renderDock();
      }

      /* ===== المنشورات =====
         تُحفظ مع بقية بيانات المصنع في sf_factories — وجدول posts
         في القاعدة جاهز لكن الصفحة لمّا تُربط به بعد. */
      var postsList  = document.getElementById("posts-list");
      var postsEmpty = document.getElementById("posts-empty");
      var addPostBtn = document.getElementById("add-post-btn");

      if (!data.posts) data.posts = [];

      function formatPostDate(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
      }

      function renderPosts() {
        postsList.innerHTML = "";
        postsEmpty.style.display = data.posts.length ? "none" : "";

        data.posts.forEach(function (post, index) {
          var item = document.createElement("div");
          item.className = "post-item";

          if (canEdit) {
            var ta = document.createElement("textarea");
            ta.value = post.body || "";
            ta.placeholder = I18N.t("factory_post_placeholder");
            ta.addEventListener("input", function () {
              post.body = ta.value;
              save();
            });
            item.appendChild(ta);

            var del = document.createElement("button");
            del.type = "button";
            del.className = "post-delete";
            del.innerHTML = "&times;";
            del.setAttribute("aria-label", I18N.t("product_delete"));
            del.addEventListener("click", function () {
              data.posts.splice(index, 1);
              save();
              renderPosts();
            });
            item.appendChild(del);
          } else {
            var read = document.createElement("div");
            read.className = "post-read";
            read.textContent = post.body || "";
            item.appendChild(read);
          }

          /* الوسائط: صورة أو مقطع — واحدة لكل منشور */
          if (post.image || post.video) {
            var media = document.createElement("div");
            media.className = "post-media";
            if (post.image) {
              var pimg = document.createElement("img");
              pimg.alt = "";
              pimg.src = post.image;
              media.appendChild(pimg);
            } else {
              var pvid = document.createElement("video");
              pvid.src = post.video;
              pvid.controls = true;
              pvid.playsInline = true;
              media.appendChild(pvid);
            }
            item.appendChild(media);
          }

          if (canEdit) {
            var row = document.createElement("div");
            row.className = "post-media-row";

            var imgBtn = document.createElement("button");
            imgBtn.type = "button";
            imgBtn.className = "post-media-btn";
            imgBtn.innerHTML =
              '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="3" y="3" width="18" height="18" rx="2"></rect>' +
              '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
              '<path d="M21 15l-5-5L5 21"></path></svg>' +
              '<span>' + I18N.t("post_add_image") + '</span>';
            imgBtn.addEventListener("click", function () {
              pickImage(640, function (dataUrl) {
                post.image = dataUrl;
                post.video = "";
                renderPosts();
              });
            });
            row.appendChild(imgBtn);

            var vidBtn = document.createElement("button");
            vidBtn.type = "button";
            vidBtn.className = "post-media-btn";
            vidBtn.innerHTML =
              '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="2" y="5" width="14" height="14" rx="2"></rect>' +
              '<path d="M16 10l6-3v10l-6-3z"></path></svg>' +
              '<span>' + I18N.t("post_add_video") + '</span>';
            vidBtn.addEventListener("click", function () {
              pickVideo(function (dataUrl) {
                post.video = dataUrl;
                post.image = "";
                renderPosts();
              });
            });
            row.appendChild(vidBtn);

            if (post.image || post.video) {
              var clearBtn = document.createElement("button");
              clearBtn.type = "button";
              clearBtn.className = "post-media-btn post-media-clear";
              clearBtn.innerHTML =
                '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M18 6L6 18M6 6l12 12"></path></svg>' +
                '<span>' + I18N.t("post_remove_media") + '</span>';
              clearBtn.addEventListener("click", function () {
                post.image = "";
                post.video = "";
                save();
                renderPosts();
              });
              row.appendChild(clearBtn);
            }

            item.appendChild(row);
          }

          var date = document.createElement("div");
          date.className = "post-date";
          date.textContent = formatPostDate(post.created_at);
          item.appendChild(date);

          postsList.appendChild(item);
        });
      }

      if (canEdit && addPostBtn) {
        addPostBtn.addEventListener("click", function () {
          data.posts.unshift({ body: "", image: "", video: "", created_at: new Date().toISOString() });
          save();
          renderPosts();
        });
      }

      /* الزائر لا يرى بطاقة منشورات فارغة */
      if (!canEdit && !data.posts.length) {
        var postsCard = document.getElementById("card-posts");
        if (postsCard) postsCard.classList.add("is-empty");
      }

      /* ===== المنتجات ===== */
      var productIconSVG = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>';

      /* حتى خمس صور للمنتج الواحد */
      var PRODUCT_MAX_IMAGES = 5;

      /* ترقية صامتة: المنتجات المحفوظة قبل هذه الميزة تحمل
         product.image مفردة. تُنقل إلى المصفوفة مرّة واحدة عند
         أول قراءة، فلا تختفي صور موجودة. */
      function productImages(product) {
        if (!Array.isArray(product.images)) {
          product.images = product.image ? [product.image] : [];
        }
        return product.images;
      }

      /* سلايدر صور المنتج.
         الدوران كل ثانيتين بلا نهاية، ويتوقّف أثناء السحب وحين
         تكون الصفحة في الخلفية. والاتجاه يتبع dir: في RTL يبدأ
         المسار من اليمين فتُعكس إشارة الإزاحة والسحب معاً. */
      var SLIDE_MS = 2000;

      /* مؤقّتات السلايدرات الحيّة — تُلغى قبل كل إعادة رسم وإلا
         بقيت تعمل على عناصر محذوفة وتراكمت مع كل تعديل. */
      var sliderTimers = [];

      function stopAllSliders() {
        sliderTimers.forEach(function (t) { clearInterval(t); });
        sliderTimers = [];
      }

      function buildProductSlider(imgs) {
        var wrap = document.createElement("div");
        wrap.className = "product-slider";

        var track = document.createElement("div");
        track.className = "product-track";

        imgs.forEach(function (src) {
          var slide = document.createElement("div");
          slide.className = "product-slide";
          var im = document.createElement("img");
          im.alt = "";
          im.src = src;
          slide.appendChild(im);
          track.appendChild(slide);
        });
        wrap.appendChild(track);

        var dots = document.createElement("div");
        dots.className = "product-dots";
        var dotEls = imgs.map(function (src, i) {
          var d = document.createElement("button");
          d.type = "button";
          d.className = "product-dot" + (i === 0 ? " is-active" : "");
          d.setAttribute("aria-label", String(i + 1));
          d.addEventListener("click", function (ev) {
            ev.stopPropagation();
            goTo(i);
            restart();
          });
          dots.appendChild(d);
          return d;
        });
        wrap.appendChild(dots);

        /* في RTL الشريحة التالية تقع يساراً، فالإزاحة موجبة */
        var rtl = document.documentElement.getAttribute("dir") === "rtl";
        var sign = rtl ? 1 : -1;
        var current = 0;
        var timer = null;

        function offsetFor(index, extraPx) {
          var w = wrap.clientWidth || 1;
          var px = sign * index * w + (extraPx || 0);
          return "translateX(" + px + "px)";
        }

        function paint(animate) {
          track.style.transition = animate ? "transform 0.35s ease" : "none";
          track.style.transform = offsetFor(current, 0);
          dotEls.forEach(function (d, i) {
            d.classList.toggle("is-active", i === current);
          });
        }

        function goTo(index) {
          current = (index + imgs.length) % imgs.length;
          paint(true);
        }

        function stop() {
          if (timer) { clearInterval(timer); timer = null; }
        }

        function restart() {
          stop();
          timer = setInterval(function () {
            /* الصفحة في الخلفية: لا تحرّك شيئاً */
            if (document.hidden) return;
            goTo(current + 1);
          }, SLIDE_MS);
          sliderTimers.push(timer);
        }

        /* السحب بالإصبع أو المؤشّر */
        var startX = 0, dragging = false, moved = 0;

        wrap.addEventListener("pointerdown", function (e) {
          dragging = true;
          moved = 0;
          startX = e.clientX;
          stop();
          track.style.transition = "none";
        });

        wrap.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          moved = e.clientX - startX;
          track.style.transform = offsetFor(current, moved);
        });

        function endDrag() {
          if (!dragging) return;
          dragging = false;
          var w = wrap.clientWidth || 1;
          /* عتبة الانتقال: خُمس العرض أو 40px أيهما أصغر */
          var threshold = Math.min(w / 5, 40);
          if (Math.abs(moved) > threshold) {
            /* السحب عكس اتجاه الإزاحة يقدّم الشريحة */
            goTo(current + (moved * sign < 0 ? 1 : -1));
          } else {
            paint(true);
          }
          restart();
        }

        wrap.addEventListener("pointerup", endDrag);
        wrap.addEventListener("pointercancel", endDrag);
        wrap.addEventListener("pointerleave", endDrag);

        /* منع سحب الصورة كملف */
        wrap.addEventListener("dragstart", function (e) { e.preventDefault(); });

        /* العرض يتغيّر مع تغيّر النافذة، فتُعاد الإزاحة بالبكسل */
        window.addEventListener("resize", function () { paint(false); });

        paint(false);
        restart();
        return wrap;
      }

      function renderProducts() {
        stopAllSliders();
        productsGrid.innerHTML = "";
        productsEmpty.style.display = data.products.length ? "none" : "block";

        data.products.forEach(function (product, index) {
          var card = document.createElement("div");
          card.className = "product-card";

          /* صور المنتج: مصفوفة حتى PRODUCT_MAX_IMAGES.
             المنتجات القديمة تحمل product.image مفردة — تُرقّى هنا
             فتبقى ظاهرة بلا فقدان. */
          var imgs = productImages(product);

          var imageSlot;

          if (imgs.length > 1) {
            /* أكثر من صورة: سلايدر بنقاط وسحب ودوران تلقائي */
            imageSlot = buildProductSlider(imgs);
          } else {
            /* صورة واحدة أو لا شيء: الشكل الثابت السابق */
            imageSlot = document.createElement("div");
            imageSlot.className = "product-image";
            if (imgs.length) {
              fillSlot(imageSlot, imgs[0]);
            } else {
              imageSlot.innerHTML = productIconSVG;
            }
            if (canEdit) {
              imageSlot.addEventListener("click", function () {
                pickImage(400, function (dataUrl) {
                  imgs.push(dataUrl);
                  renderProducts();
                });
              });
            }
          }

          card.appendChild(imageSlot);

          /* المصغّرات لصاحب المصنع وحده: حذف صورة أو إضافة أخرى.
             الزائر ينتقل بين الصور عبر السلايدر لا المصغّرات. */
          if (canEdit && imgs.length) {
            var thumbs = document.createElement("div");
            thumbs.className = "product-thumbs";

            imgs.forEach(function (src, imgIndex) {
              var th = document.createElement("div");
              th.className = "product-thumb";

              var thImg = document.createElement("img");
              thImg.alt = "";
              thImg.src = src;
              th.appendChild(thImg);

              if (canEdit) {
                var thDel = document.createElement("button");
                thDel.type = "button";
                thDel.className = "product-thumb-del";
                thDel.innerHTML = "&times;";
                thDel.setAttribute("aria-label", I18N.t("product_delete"));
                thDel.addEventListener("click", function (ev) {
                  ev.stopPropagation();
                  imgs.splice(imgIndex, 1);
                  save();
                  renderProducts();
                });
                th.appendChild(thDel);
              }

              thumbs.appendChild(th);
            });

            if (canEdit && imgs.length < PRODUCT_MAX_IMAGES) {
              var addTh = document.createElement("button");
              addTh.type = "button";
              addTh.className = "product-thumb-add";
              addTh.innerHTML = "+";
              addTh.setAttribute("aria-label", I18N.t("product_add_image"));
              addTh.addEventListener("click", function () {
                pickImage(400, function (dataUrl) {
                  imgs.push(dataUrl);
                  renderProducts();
                });
              });
              thumbs.appendChild(addTh);
            }

            /* الشريط مخفي افتراضياً: زر صغير يفتحه عند الحاجة،
               فيبقى شكل البطاقة نظيفاً كما طلب المالك. */
            var editImgs = document.createElement("button");
            editImgs.type = "button";
            editImgs.className = "product-edit-imgs";
            editImgs.innerHTML =
              '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="3" y="3" width="18" height="18" rx="2"></rect>' +
              '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
              '<path d="M21 15l-5-5L5 21"></path></svg>' +
              '<span>' + I18N.t("product_manage_images") + " (" + imgs.length + ")" + '</span>';
            editImgs.addEventListener("click", function () {
              thumbs.classList.toggle("is-open");
            });

            card.appendChild(editImgs);
            card.appendChild(thumbs);
          }

          var body = document.createElement("div");
          body.className = "product-body";

          /* وضع العرض: اسم المنتج وسعره كنص، بدون حذف أو تعديل */
          if (!canEdit) {
            var readName = document.createElement("div");
            readName.className = "product-read-name";
            readName.textContent = product.name || "";

            var readPrice = document.createElement("div");
            readPrice.className = "product-read-price";
            if (product.price) {
              readPrice.textContent = product.price + " " + I18N.t("currency_sar");
            }

            body.appendChild(readName);
            body.appendChild(readPrice);

            /* الزائر: البطاقة كلّها رابط إلى صفحة المنتج */
            var link = document.createElement("a");
            link.href = "web-product.html?factory=" +
              encodeURIComponent(factoryId) + "&p=" + index;
            link.style.textDecoration = "none";
            link.style.color = "inherit";
            link.appendChild(imageSlot);
            link.appendChild(body);
            card.appendChild(link);
            productsGrid.appendChild(card);
            return;
          }

          var nameField = document.createElement("input");
          nameField.type = "text";
          nameField.value = product.name || "";
          nameField.placeholder = I18N.t("product_name_placeholder");
          nameField.addEventListener("input", function () {
            product.name = nameField.value;
            save();
          });

          var priceRow = document.createElement("div");
          priceRow.className = "price-row";

          var priceField = document.createElement("input");
          priceField.type = "text";
          priceField.inputMode = "decimal";
          priceField.value = product.price || "";
          priceField.placeholder = I18N.t("product_price_placeholder");
          priceField.addEventListener("input", function () {
            product.price = priceField.value;
            save();
          });

          var currency = document.createElement("span");
          currency.className = "currency";
          currency.textContent = I18N.t("currency_sar");

          priceRow.appendChild(priceField);
          priceRow.appendChild(currency);

          body.appendChild(nameField);
          body.appendChild(priceRow);

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "product-delete";
          deleteBtn.innerHTML = "&times;";
          deleteBtn.setAttribute("aria-label", I18N.t("product_delete"));
          deleteBtn.addEventListener("click", function () {
            data.products.splice(index, 1);
            save();
            renderProducts();
            renderHead();
          });

          card.appendChild(body);
          card.appendChild(deleteBtn);
          productsGrid.appendChild(card);
        });
      }

      if (canEdit) {
        addProductBtn.addEventListener("click", function () {
          data.products.push({ images: [], name: "", price: "" });
          save();
          renderProducts();
          renderHead();
        });
      }

      renderProducts();
      renderPosts();
      renderAbout();
      renderHead();
    })();
  </script>

</body>
</html>
