<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | صفحة المصنع: غلاف وشعار ومنتجات
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     مقابلها في التطبيق: app-factory.html
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="factory_page_title">صفحة المصنع - المصانع السعودية</title>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>var SF_PUBLIC_PAGE = true;</script>
<script src="auth-guard.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== الرأس ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 18px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e2e6e3;
  }

  .page-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #04361b;
  }

  .back-btn {
    position: absolute;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  html[dir="ltr"] .back-btn {
    right: auto;
    left: 16px;
  }

  html[dir="ltr"] .back-btn svg {
    transform: scaleX(-1);
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  .content-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 0 20px;
  }

  /* ===== الغلاف والشعار ===== */
  .cover-block {
    position: relative;
    background: #ffffff;
    margin-bottom: 0;
  }

  .cover-image {
    width: 100%;
    /* ارتفاع ثابت لا نسبة — فالنسبة تكبر مع عرض
       الحاوية، فيبتلع الغلاف الشاشة كلّما اتّسعت. ولينكدإن
       يستخدم ارتفاعاً ثابتاً للسبب نفسه. */
    height: 134px;
    background: #e6e9e7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    overflow: hidden;
  }

  .cover-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cover-image svg {
    width: 38px;
    height: 38px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  .cover-image .hint {
    font-size: 12.5px;
    color: #04361b;
    font-weight: 600;
  }

  .logo-circle {
    position: absolute;
    bottom: -28px;
    right: 18px;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: #ffffff;
    border: 3px dashed #c7d0ca;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.12);
  }

  html[dir="ltr"] .logo-circle {
    right: auto;
    left: 18px;
  }

  .logo-circle.has-image {
    border-style: solid;
    border-color: #ffffff;
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo-circle svg {
    width: 24px;
    height: 24px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
  }

  /* ===== ترويسة المصنع — الاسم والبيانات والتبويبات ===== */
  /* الحشو العلوي يترك مكاناً للشعار المتدلّي من الغلاف */
  .fx-head {
    background: #ffffff;
    padding: 38px 18px 0;
    margin-bottom: 14px;
  }

  .fx-name {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    color: #04361b;
    line-height: 1.3;
  }

  .fx-verified {
    width: 18px;
    height: 18px;
    flex: none;
    fill: #45a06a;
    stroke: none;
    display: none;
  }

  .fx-verified.is-on { display: block; }

  .fx-verified .fx-check {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fx-tagline {
    margin: 5px 0 0;
    font-size: 14px;
    color: #33463b;
    line-height: 1.5;
  }

  .fx-tagline:empty { display: none; }

  /* سطر البيانات مفصول بنقاط — يُبنى من الجافاسكربت */
  .fx-meta {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: #6b7d72;
    line-height: 1.6;
  }

  .fx-meta:empty { display: none; }

  .fx-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    border-bottom: 1px solid #e6e9e7;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .fx-tabs::-webkit-scrollbar { display: none; }

  .fx-tab {
    flex: none;
    padding: 11px 14px;
    border: none;
    background: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: #6b7d72;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
  }

  .fx-tab.is-active {
    color: #04361b;
    border-bottom-color: #04361b;
  }

  /* ===== المنشورات ===== */
  .posts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .post-item {
    position: relative;
    border: 1px solid #e6e9e7;
    border-radius: 12px;
    padding: 13px 14px;
    background: #fbfcfb;
  }

  .post-item textarea {
    width: 100%;
    min-height: 62px;
    border: none;
    background: none;
    resize: vertical;
    font: inherit;
    font-size: 13.5px;
    color: #04361b;
    line-height: 1.7;
    outline: none;
    padding: 0;
  }

  .post-read {
    font-size: 13.5px;
    color: #04361b;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-date {
    margin-top: 8px;
    font-size: 11.5px;
    color: #6b7d72;
  }

  .post-delete {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: #fdecec;
    color: #c0392b;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  html[dir="ltr"] .post-delete { left: auto; right: 8px; }

  body.view-only .post-delete,
  body.view-only #add-post-btn { display: none; }

  /* إخفاء الأقسام حسب التبويب المختار — الصنف على body */
  body.tab-posts    #card-about,
  body.tab-posts    #card-products,
  body.tab-about    #card-posts,
  body.tab-about    #card-products,
  body.tab-products #card-about,
  body.tab-products #card-posts { display: none !important; }

  /* ===== زر مراسلة المصنع ===== */
  /* كبسولة بحجم محتواها بنمط لينكدإن — وكان زرّاً
     يمتدّ بعرض العمود كلّه. inline-flex لا block هو
     ما يجعله ينكمش على نصّه. */
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 0 14px 14px;
    padding: 10px 20px;
    border-radius: 999px;
    background: #04361b;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .contact-btn svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* الطائرة تشير إلى جهة الإرسال، فهي مرآة لا ترتيب ثابت:
     تنقلب مع اتجاه القراءة وإلا أشارت للخلف في العربية. */
  .contact-btn svg { transform: scaleX(-1); }
  html[dir="ltr"] .contact-btn svg { transform: none; }

  .contact-btn:active { opacity: 0.85; }

  /* ===== البطاقات ===== */
  .card {
    background: #ffffff;
    border-radius: 14px;
    margin: 0 14px 14px;
    padding: 16px 14px;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.06);
  }

  .card label {
    display: block;
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: #04361b;
    margin-bottom: 8px;
  }

  html[dir="ltr"] .card label {
    text-align: left;
  }

  .card input[type="text"],
  .card textarea {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    background: #ffffff;
    text-align: right;
    outline: none;
    resize: vertical;
  }

  html[dir="ltr"] .card input[type="text"],
  html[dir="ltr"] .card textarea {
    text-align: left;
  }

  .card input[type="text"]:focus,
  .card textarea:focus {
    border-color: #04361b;
  }

  .card input::placeholder,
  .card textarea::placeholder {
    color: #9aa8a0;
  }

  .card textarea {
    min-height: 96px;
    line-height: 1.6;
  }

  /* ===== المنتجات ===== */
  .products-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .products-head h2 {
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
  }

  .add-product-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    background: #04361b;
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 14px;
    cursor: pointer;
  }

  .add-product-btn svg {
    width: 15px;
    height: 15px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 2.4;
  }

  .products-empty {
    text-align: center;
    color: #9aa8a0;
    font-size: 13.5px;
    padding: 22px 0;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-card {
    position: relative;
    border: 1px solid #eef1ee;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
  }

  .product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eef1ee;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }

  .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .product-image svg {
    width: 26px;
    height: 26px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  .product-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .product-body input {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
    color: #04361b;
    text-align: right;
    outline: none;
  }

  html[dir="ltr"] .product-body input {
    text-align: left;
  }

  .product-body input:focus {
    border-color: #04361b;
  }

  .product-body input::placeholder {
    color: #9aa8a0;
  }

  .price-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .price-row input {
    flex: 1;
  }

  .price-row .currency {
    font-size: 12.5px;
    font-weight: 700;
    color: #04361b;
    flex-shrink: 0;
  }

  .product-delete {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.92);
    color: #b3261e;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
  }

  html[dir="ltr"] .product-delete {
    left: auto;
    right: 6px;
  }

  /* ===== تنبيه امتلاء التخزين ===== */
  .storage-warning {
    display: none;
    margin: 0 14px 14px;
    padding: 11px 13px;
    border-radius: 10px;
    background: #fdecea;
    border: 1px solid #f5c6c2;
    color: #b3261e;
    font-size: 13px;
    line-height: 1.5;
  }

  .storage-warning.show {
    display: block;
  }

  /* ===== وضع العرض فقط (حساب الأفراد) ===== */
  /* الأفراد يتصفحون المصنع فقط — الإضافة والتعديل للمصانع وحدها */
  body.view-only .cover-image,
  body.view-only .logo-circle,
  body.view-only .product-image {
    cursor: default;
  }

  /* إخفاء زر إضافة منتج وزر حذف المنتج */
  body.view-only .add-product-btn,
  body.view-only .product-delete {
    display: none;
  }

  /* الشعار الفارغ لا يظهر كمكان قابل للإضافة */
  body.view-only .logo-circle:not(.has-image) {
    display: none;
  }

  /* الغلاف الفارغ: أيقونة رمادية بدون نص "اضغط لإضافة" */
  body.view-only .cover-image:not(.has-image) svg {
    stroke: #b6c0ba;
  }

  body.view-only .cover-image .hint {
    display: none;
  }

  /* الزائر يرى متجراً لا نموذج إدخال: "اسم المصنع"
     و"نبذة عن المصنع" تسميات حقول، والاسم نفسه هو
     عنوان الصفحة فلا يحتاج تسمية فوقه. */
  body.view-only #card-name > label { display: none; }

  body.view-only .read-name {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.4;
  }

  /* الغلاف الفارغ لا يأخذ مساحة ضخمة من الزائر */
  body.view-only .cover-image:not(.has-image) {
    aspect-ratio: auto;
    min-height: 130px;
  }

  /* بطاقة فارغة لا تُعرض أصلاً للزائر */
  body.view-only .card.is-empty { display: none; }

  /* الاسم والنبذة يعرضان كنص بدل حقول الإدخال */
  .read-text {
    font-size: 14px;
    line-height: 1.7;
    color: #04361b;
    text-align: right;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  html[dir="ltr"] .read-text {
    text-align: left;
  }

  .read-text.empty {
    color: #9aa8a0;
  }

  .read-name {
    font-size: 17px;
    font-weight: 700;
    color: #04361b;
  }

  /* اسم المنتج وسعره كنص في وضع العرض */
  .product-read-name {
    font-size: 13px;
    font-weight: 600;
    color: #04361b;
    text-align: right;
    word-wrap: break-word;
  }

  html[dir="ltr"] .product-read-name {
    text-align: left;
  }

  .product-read-price {
    font-size: 13px;
    font-weight: 700;
    color: #04361b;
  }
</style>
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body class="store-page">

  <header class="page-header">
    <h1 data-i18n="factory_page_heading">صفحة المصنع</h1>
    <a href="web-factories.html" class="back-btn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </header>

  <div class="content-wrap">

    <div class="cover-block">
      <div class="cover-image" id="cover-image">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        <span class="hint" data-i18n="factory_cover_hint">اضغط لإضافة صورة الغلاف</span>
      </div>
      <div class="logo-circle" id="logo-circle" title="شعار المصنع">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>

    <!-- ترويسة المصنع — الاسم وسطر البيانات والتبويبات -->
    <div class="fx-head" id="fx-head">
      <h1 class="fx-name" id="fx-name">
        <span id="fx-name-text"></span>
        <svg class="fx-verified" id="fx-verified" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 1.8 3-.3 1 2.8 2.6 1.5-1 2.9 1 2.9-2.6 1.5-1 2.8-3-.3L12 22l-2.4-1.8-3 .3-1-2.8L3 16.2l1-2.9-1-2.9 2.6-1.5 1-2.8 3 .3z"></path><path class="fx-check" d="M8.6 12.2l2.3 2.3 4.5-4.6"></path></svg>
      </h1>
      <p class="fx-tagline" id="fx-tagline"></p>
      <p class="fx-meta" id="fx-meta"></p>
      <div class="fx-tabs" id="fx-tabs">
        <button type="button" class="fx-tab is-active" data-tab="home" data-i18n="factory_tab_home">الرئيسية</button>
        <button type="button" class="fx-tab" data-tab="posts" data-i18n="factory_tab_posts">المنشورات</button>
        <button type="button" class="fx-tab" data-tab="about" data-i18n="factory_tab_about">نبذة</button>
        <button type="button" class="fx-tab" data-tab="products" data-i18n="factory_products_title">المنتجات</button>
      </div>
    </div>

    <div class="storage-warning" id="storage-warning" data-i18n="storage_full_msg">مساحة التخزين ممتلئة، لن تُحفظ الصور الجديدة.</div>

    <div class="card" id="card-name">
      <label for="factory-name" data-i18n="factory_name_label">اسم المصنع</label>
      <input type="text" id="factory-name" data-i18n-placeholder="factory_name_placeholder" placeholder="أدخل اسم المصنع">
    </div>

    <div class="card" id="card-about">
      <label for="factory-about" data-i18n="factory_about_label">نبذة عن المصنع</label>
      <textarea id="factory-about" data-i18n-placeholder="factory_about_placeholder" placeholder="اكتب نبذة عن مصنعك ومنتجاته..."></textarea>
    </div>

    <!-- زر المراسلة: يفتح محادثة هذا المصنع في صفحة الرسائل -->
    <a class="contact-btn" id="contact-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 2.5L11 13"></path><path d="M21.5 2.5l-6.6 19-3.9-8.5L2.5 9.1z"></path></svg>
      <span data-i18n="msg_contact_btn">مراسلة المصنع</span>
    </a>

    <!-- المنشورات — تظهر في تبويب الرئيسية وتبويب المنشورات -->
    <div class="card" id="card-posts">
      <div class="products-head">
        <h2 data-i18n="factory_tab_posts">المنشورات</h2>
        <button type="button" class="add-product-btn" id="add-post-btn">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-i18n="factory_add_post">إضافة منشور</span>
        </button>
      </div>
      <p class="products-empty" id="posts-empty" data-i18n="factory_no_posts">لا توجد منشورات بعد</p>
      <div class="posts-list" id="posts-list"></div>
    </div>

    <div class="card" id="card-products">
      <div class="products-head">
        <h2 data-i18n="factory_products_title">المنتجات</h2>
        <button type="button" class="add-product-btn" id="add-product-btn">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-i18n="factory_add_product">إضافة منتج</span>
        </button>
      </div>
      <p class="products-empty" id="products-empty" data-i18n="factory_no_products">لم تتم إضافة منتجات بعد</p>
      <div class="products-grid" id="products-grid"></div>
    </div>

  </div>

  <input type="file" id="image-file-input" accept="image/*" style="display:none;">

  <script>
    (function () {
      var STORE_KEY = "sf_factories";
      var LEGACY_KEY = "sf_factory_images";

      var params = new URLSearchParams(window.location.search);
      var factoryId = params.get("id") || "0";

      /* الأفراد يتصفحون فقط — إضافة الصور والنبذة والمنتجات ميزة للمصانع */
      var accountType = "";
      try {
        accountType = localStorage.getItem("sf_account_type") || "";
      } catch (err) {}
      var canEdit = accountType === "factory";
      if (!canEdit) document.body.classList.add("view-only");

      /* زر المراسلة يفتح محادثة هذا المصنع في صفحة الرسائل */
      var contactBtn = document.getElementById("contact-btn");
      if (contactBtn) contactBtn.href = "web-messages.html?factory=" + encodeURIComponent(factoryId);

      var coverEl = document.getElementById("cover-image");
      var logoEl = document.getElementById("logo-circle");
      var nameInput = document.getElementById("factory-name");
      var aboutInput = document.getElementById("factory-about");
      var productsGrid = document.getElementById("products-grid");
      var productsEmpty = document.getElementById("products-empty");
      var addProductBtn = document.getElementById("add-product-btn");
      var fileInput = document.getElementById("image-file-input");
      var storageWarning = document.getElementById("storage-warning");

      var allFactories = {};
      try {
        allFactories = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      } catch (err) {
        allFactories = {};
      }

      var data = allFactories[factoryId];
      if (!data) {
        data = { name: "", about: "", cover: "", logo: "", products: [] };
        /* نقل الصور المحفوظة سابقاً من صفحة المصانع */
        try {
          var legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "{}");
          if (legacy["img-" + factoryId]) data.cover = legacy["img-" + factoryId];
          if (legacy["logo-" + factoryId]) data.logo = legacy["logo-" + factoryId];
        } catch (err) {}
      }
      if (!data.products) data.products = [];

      function save() {
        allFactories[factoryId] = data;
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(allFactories));
          storageWarning.classList.remove("show");
        } catch (err) {
          storageWarning.classList.add("show");
        }
      }

      /* تصغير الصورة قبل الحفظ حتى لا تمتلئ مساحة التخزين بسرعة */
      function resizeImage(dataUrl, maxSize, done) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          done(canvas.toDataURL("image/jpeg", 0.8));
        };
        img.onerror = function () { done(dataUrl); };
        img.src = dataUrl;
      }

      var pendingTarget = null;

      function pickImage(maxSize, onPicked) {
        pendingTarget = { maxSize: maxSize, onPicked: onPicked };
        fileInput.value = "";
        fileInput.click();
      }

      fileInput.addEventListener("change", function () {
        var file = fileInput.files[0];
        if (!file || !pendingTarget) return;
        var target = pendingTarget;
        var reader = new FileReader();
        reader.onload = function (e) {
          resizeImage(e.target.result, target.maxSize, function (resized) {
            target.onPicked(resized);
            save();
          });
        };
        reader.readAsDataURL(file);
      });

      function fillSlot(el, dataUrl) {
        var img = document.createElement("img");
        img.alt = "";
        img.src = dataUrl;
        el.innerHTML = "";
        el.appendChild(img);
        el.classList.add("has-image");
      }

      /* ===== الغلاف والشعار ===== */
      if (data.cover) fillSlot(coverEl, data.cover);
      if (data.logo) fillSlot(logoEl, data.logo);

      if (canEdit) {
        coverEl.addEventListener("click", function () {
          pickImage(640, function (dataUrl) {
            data.cover = dataUrl;
            fillSlot(coverEl, dataUrl);
          });
        });

        logoEl.addEventListener("click", function () {
          pickImage(180, function (dataUrl) {
            data.logo = dataUrl;
            fillSlot(logoEl, dataUrl);
          });
        });
      }

      /* ===== الاسم والنبذة ===== */
      if (canEdit) {
        nameInput.value = data.name || "";
        aboutInput.value = data.about || "";

        nameInput.addEventListener("input", function () {
          data.name = nameInput.value;
          renderHead();
          save();
        });

        aboutInput.addEventListener("input", function () {
          data.about = aboutInput.value;
          save();
        });
      } else {
        /* استبدال حقول الإدخال بنص للقراءة */
        showAsText(nameInput, data.name, I18N.t("factory_no_name"), "read-name");
        showAsText(aboutInput, data.about, I18N.t("factory_no_about"), "");

        /* بطاقة النبذة الفارغة تُخفى عن الزائر بدل عرض
           عنوان فوق نص "لا توجد نبذة" */
        if (!data.about) {
          var aboutCard = document.getElementById("card-about");
          if (aboutCard) aboutCard.classList.add("is-empty");
        }
      }

      /* تحويل حقل إدخال إلى نص ثابت في وضع العرض */
      function showAsText(field, value, emptyText, extraClass) {
        var el = document.createElement("div");
        el.className = "read-text" + (extraClass ? " " + extraClass : "");
        if (value) {
          el.textContent = value;
        } else {
          el.textContent = emptyText;
          el.classList.add("empty");
        }
        field.parentNode.replaceChild(el, field);
      }

      /* ===== ترويسة المصنع ===== */
      var headNameEl  = document.getElementById("fx-name-text");
      var headVerifEl = document.getElementById("fx-verified");
      var headTagEl   = document.getElementById("fx-tagline");
      var headMetaEl  = document.getElementById("fx-meta");

      /* سطر البيانات يعرض الموجود وحده — فالحقول الخالية
         تُسقط بدل أن تترك نقاطاً فاصلة معلّقة */
      function renderHead() {
        var shownName = data.name || I18N.t("factory_no_name");
        headNameEl.textContent = shownName;

        /* علامة التوثيق تظهر للمصنع المُعتمد فقط.
           والاعتماد لمّا يُقرأ من القاعدة بعد، فتبقى مخفية. */
        if (data.verified) {
          headVerifEl.classList.add("is-on");
          headVerifEl.setAttribute("aria-label", I18N.t("factory_verified"));
        } else {
          headVerifEl.classList.remove("is-on");
        }

        headTagEl.textContent = data.tagline || "";

        var bits = [];
        if (data.city) bits.push(data.city);
        var count = (data.products || []).length;
        if (count) bits.push(count + " " + I18N.t("factory_products_count"));
        headMetaEl.textContent = bits.join(" · ");
      }

      /* التبويبات تُبدّل المحتوى لا تمرّر إليه — والإخفاء
         بصنف على body لا بـstyle مباشر، ليبقى القرار في CSS.
         و"الرئيسية" بلا صنف — فتظهر النبذة والمنشورات معاً. */
      var TAB_CLASSES = ["tab-posts", "tab-about", "tab-products"];
      var tabsWrap = document.getElementById("fx-tabs");

      function selectTab(name) {
        for (var i = 0; i < TAB_CLASSES.length; i++) {
          document.body.classList.remove(TAB_CLASSES[i]);
        }
        if (name !== "home") document.body.classList.add("tab-" + name);

        var all = tabsWrap.querySelectorAll(".fx-tab");
        for (var j = 0; j < all.length; j++) {
          all[j].classList.toggle("is-active",
            all[j].getAttribute("data-tab") === name);
        }
      }

      if (tabsWrap) {
        tabsWrap.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".fx-tab");
          if (!btn) return;
          selectTab(btn.getAttribute("data-tab"));
        });
      }

      /* ===== المنشورات =====
         تُحفظ مع بقية بيانات المصنع في sf_factories — وجدول posts
         في القاعدة جاهز لكن الصفحة لمّا تُربط به بعد. */
      var postsList  = document.getElementById("posts-list");
      var postsEmpty = document.getElementById("posts-empty");
      var addPostBtn = document.getElementById("add-post-btn");

      if (!data.posts) data.posts = [];

      function formatPostDate(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
      }

      function renderPosts() {
        postsList.innerHTML = "";
        postsEmpty.style.display = data.posts.length ? "none" : "";

        data.posts.forEach(function (post, index) {
          var item = document.createElement("div");
          item.className = "post-item";

          if (canEdit) {
            var ta = document.createElement("textarea");
            ta.value = post.body || "";
            ta.placeholder = I18N.t("factory_post_placeholder");
            ta.addEventListener("input", function () {
              post.body = ta.value;
              save();
            });
            item.appendChild(ta);

            var del = document.createElement("button");
            del.type = "button";
            del.className = "post-delete";
            del.innerHTML = "&times;";
            del.setAttribute("aria-label", I18N.t("product_delete"));
            del.addEventListener("click", function () {
              data.posts.splice(index, 1);
              save();
              renderPosts();
            });
            item.appendChild(del);
          } else {
            var read = document.createElement("div");
            read.className = "post-read";
            read.textContent = post.body || "";
            item.appendChild(read);
          }

          var date = document.createElement("div");
          date.className = "post-date";
          date.textContent = formatPostDate(post.created_at);
          item.appendChild(date);

          postsList.appendChild(item);
        });
      }

      if (canEdit && addPostBtn) {
        addPostBtn.addEventListener("click", function () {
          data.posts.unshift({ body: "", image: "", created_at: new Date().toISOString() });
          save();
          renderPosts();
        });
      }

      /* الزائر لا يرى بطاقة منشورات فارغة */
      if (!canEdit && !data.posts.length) {
        var postsCard = document.getElementById("card-posts");
        if (postsCard) postsCard.classList.add("is-empty");
      }

      /* ===== المنتجات ===== */
      var productIconSVG = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>';

      function renderProducts() {
        productsGrid.innerHTML = "";
        productsEmpty.style.display = data.products.length ? "none" : "block";

        data.products.forEach(function (product, index) {
          var card = document.createElement("div");
          card.className = "product-card";

          var imageSlot = document.createElement("div");
          imageSlot.className = "product-image";
          if (product.image) {
            fillSlot(imageSlot, product.image);
          } else {
            imageSlot.innerHTML = productIconSVG;
          }
          if (canEdit) {
            imageSlot.addEventListener("click", function () {
              pickImage(400, function (dataUrl) {
                product.image = dataUrl;
                fillSlot(imageSlot, dataUrl);
              });
            });
          }

          var body = document.createElement("div");
          body.className = "product-body";

          /* وضع العرض: اسم المنتج وسعره كنص، بدون حذف أو تعديل */
          if (!canEdit) {
            var readName = document.createElement("div");
            readName.className = "product-read-name";
            readName.textContent = product.name || "";

            var readPrice = document.createElement("div");
            readPrice.className = "product-read-price";
            if (product.price) {
              readPrice.textContent = product.price + " " + I18N.t("currency_sar");
            }

            body.appendChild(readName);
            body.appendChild(readPrice);

            /* الزائر: البطاقة كلّها رابط إلى صفحة المنتج */
            var link = document.createElement("a");
            link.href = "web-product.html?factory=" +
              encodeURIComponent(factoryId) + "&p=" + index;
            link.style.textDecoration = "none";
            link.style.color = "inherit";
            link.appendChild(imageSlot);
            link.appendChild(body);
            card.appendChild(link);
            productsGrid.appendChild(card);
            return;
          }

          var nameField = document.createElement("input");
          nameField.type = "text";
          nameField.value = product.name || "";
          nameField.placeholder = I18N.t("product_name_placeholder");
          nameField.addEventListener("input", function () {
            product.name = nameField.value;
            save();
          });

          var priceRow = document.createElement("div");
          priceRow.className = "price-row";

          var priceField = document.createElement("input");
          priceField.type = "text";
          priceField.inputMode = "decimal";
          priceField.value = product.price || "";
          priceField.placeholder = I18N.t("product_price_placeholder");
          priceField.addEventListener("input", function () {
            product.price = priceField.value;
            save();
          });

          var currency = document.createElement("span");
          currency.className = "currency";
          currency.textContent = I18N.t("currency_sar");

          priceRow.appendChild(priceField);
          priceRow.appendChild(currency);

          body.appendChild(nameField);
          body.appendChild(priceRow);

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "product-delete";
          deleteBtn.innerHTML = "&times;";
          deleteBtn.setAttribute("aria-label", I18N.t("product_delete"));
          deleteBtn.addEventListener("click", function () {
            data.products.splice(index, 1);
            save();
            renderProducts();
            renderHead();
          });

          card.appendChild(imageSlot);
          card.appendChild(body);
          card.appendChild(deleteBtn);
          productsGrid.appendChild(card);
        });
      }

      if (canEdit) {
        addProductBtn.addEventListener("click", function () {
          data.products.push({ image: "", name: "", price: "" });
          save();
          renderProducts();
          renderHead();
        });
      }

      renderProducts();
      renderPosts();
      renderHead();
    })();
  </script>

</body>
</html>
