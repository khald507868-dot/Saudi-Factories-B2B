<!-- نوع الصفحة: متصفّح | دليل المصانع
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     مقابلها في التطبيق: app-factories.html
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 52px;
  }

  /* ===== رأس الصفحة ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px;
    background: #ffffff;
    border-bottom: none;
  }

  .page-header h1 {
    font-size: 19px;
    font-weight: 700;
    color: #04361b;
  }

  /* ===== شبكة قوالب المصانع ===== */
  /* قالبان في كل صف */
  /* رسالة الحالة (تحميل / لا مصانع / خطأ): تمتدّ على عرض
     الشبكة كلها بدل أن تحتلّ خانة بطاقة واحدة */
  .grid-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 16px;
    color: #7d8c83;
    font-size: 14px;
  }

  .factories-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    /* فجوة الصفوف أكبر لأن دائرة الشعار تنزل 14px تحت البطاقة */
    row-gap: 24px;
    column-gap: 10px;
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 12px 4px;
  }

  .factory-card {
    position: relative;
    display: block;
    border-radius: 12px;
    overflow: visible;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.06);
    text-decoration: none;
    color: inherit;
  }

  .card-image-placeholder {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #e6e9e7;
    border-radius: 12px 12px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-image-placeholder svg {
    width: 26px;
    height: 26px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  .card-image-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-footer {
    height: 38px;
    border-radius: 0 0 12px 12px;
    display: flex;
    align-items: center;
    padding: 0 9px 0 52px;
  }

  html[dir="ltr"] .card-footer {
    padding: 0 52px 0 9px;
  }

  .card-name {
    font-size: 11.5px;
    font-weight: 700;
    color: #04361b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .logo-placeholder {
    position: absolute;
    bottom: -14px;
    left: 8px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    border: 1.5px dashed #c7d0ca;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(4, 54, 27, 0.10);
    overflow: hidden;
  }

  .logo-placeholder.has-image {
    border-style: solid;
    border-color: #ffffff;
  }

  .logo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo-placeholder svg {
    width: 15px;
    height: 15px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
  }

  /* ===== القائمة السفلية ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    height: 52px;
    background: #ffffff;
    display: flex;
    border-top: 2px solid #04361b;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 10;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
    color: #5c8a70;
    font-size: 11px;
    padding: 0 2px;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    flex-shrink: 0;
  }

  .nav-item.active {
    color: #04361b;
    font-weight: 700;
  }
</style>
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="green-frames.css">
</head>
<body>
  <!-- شعار الصفحة — متحرّك، موحّد في كل صفحات الموقع -->
  <a class="page-logo" href="index.html">
    <span class="wm-title"><span class="w-green">Saudi</span> <span class="w-dark">Factories</span> <span class="w-b2b">B2B</span></span>
    <span class="wm-rule"></span>
  </a>


  <header class="page-header">
    <h1 data-i18n="nav_factories">المصانع</h1>
  </header>

  <div class="factories-grid" id="factories-grid"></div>

  <!-- القائمة السفلية -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      <span data-i18n="nav_home">الرئيسية</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
      </svg>
      <span data-i18n="nav_categories">الفئات</span>
    </a>
    <a href="web-factories.html" class="nav-item active">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21V10l6 4v-4l6 4V4l6 6v11H3z"></path>
      </svg>
      <span data-i18n="nav_factories">المصانع</span>
    </a>
    <a href="web-messages.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span data-i18n="nav_messages">الرسائل</span>
    </a>
    <a href="web-account.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
      </svg>
      <span data-i18n="nav_account">الحساب</span>
    </a>
    <a href="web-cart.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span data-i18n="nav_cart">عربة التسوق</span>
    </a>
  </nav>

  <script>
    (function () {
      /* المصانع الحقيقية من قاعدة البيانات.

         كان هنا مولّد يرسم 1000 بطاقة وهمية بالترقيم، لا علاقة
         لها بأي حساب — فكان الزائر يفتح بطاقة فيؤدّي به إلى
         صفحة فارغة. حذفها المالك وطلب المصانع الحقيقية وحدها.

         RLS هي التي ترشح: الزائر لا يرى إلا approved،
         والمالك يرى مصنعه ولو لم يُعتمد، والمدير يرى الجميع —
         فلا حاجة لـ eq("status","approved") هنا، ووضعه يخفي
         عن المالك مصنعه قيد المراجعة. */
      var grid = document.getElementById("factories-grid");

      var imageIcon = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>';
      var logoIcon = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>';

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function t(key, fallback) {
        return (window.I18N && I18N.t) ? I18N.t(key) : fallback;
      }

      function showState(msg) {
        grid.innerHTML = '<p class="grid-state">' + escapeHTML(msg) + "</p>";
      }

      showState(t("fx_loading", "جارٍ التحميل…"));

      function render(rows) {
        if (!rows.length) {
          /* الرسالة العامة تُقرأ كأن الموقع فارغ، والأدقّ أن هذا
             القطاع وحده فارغ — مع رابط يعود لكل المصانع. */
          if (wantedCat) {
            grid.innerHTML =
              '<p class="grid-state">' + escapeHTML(t("fx_empty", "لا توجد مصانع بعد")) + '<br>' +
              '<a href="web-factories.html" style="color:#1f6b42;font-weight:700">' +
              escapeHTML(t("nav_factories", "المصانع")) + '</a></p>';
            return;
          }
          showState(t("fx_empty", "لا توجد مصانع بعد"));
          return;
        }

        var html = "";
        rows.forEach(function (f) {
          var cover = f.cover || "";
          var logo = f.logo || "";
          var name = f.name || "";

          html +=
            '<a class="factory-card" href="web-factory.html?id=' + encodeURIComponent(f.id) + '">' +
              '<div class="card-image-placeholder">' +
                (sfSafeHttpUrl(cover) ? '<img alt="" src="' + escapeHTML(sfSafeHttpUrl(cover)) + '">' : imageIcon) +
              '</div>' +
              '<div class="logo-placeholder' + (logo ? ' has-image' : '') + '">' +
                (sfSafeHttpUrl(logo) ? '<img alt="" src="' + escapeHTML(sfSafeHttpUrl(logo)) + '">' : logoIcon) +
              '</div>' +
              '<div class="card-footer">' +
                (name ? '<span class="card-name">' + escapeHTML(name) + '</span>' : '') +
              '</div>' +
            '</a>';
        });
        grid.innerHTML = html;
      }

      if (!window.sb) {
        showState(t("fx_failed", "تعذّر تحميل المصانع"));
        return;
      }

      /* ننتظر الجلسة أولاً: لو سألنا قبلها لردّ الخادم
         كأننا زائر، فيختفي مصنع المالك قيد المراجعة. */
      var ready = window.SF_AUTH_READY || Promise.resolve(null);

      /* فلترة القطاع: ?cat=<الاسم الإنجليزي للفئة>
         وهو نفس ما يخزّنه حقل القطاع في صفحة المصنع (عمود industry)،
         فيبقى ثابتاً مهما تغيّرت لغة الواجهة. */
      var wantedCat = "";
      try {
        wantedCat = new URLSearchParams(location.search).get("cat") || "";
      } catch (e) { wantedCat = ""; }

      /* عنوان الصفحة يذكر القطاع المختار باسمه المترجم */
      if (wantedCat) {
        var h1 = document.querySelector(".page-header h1");
        var cats = (window.I18N && I18N.categories) || [];
        for (var ci = 0; ci < cats.length; ci++) {
          if (cats[ci].en === wantedCat) {
            if (h1) {
              h1.textContent = I18N.categoryName(cats[ci]);
              /* يُزال data-i18n وإلا أعاد applyTranslations العنوان العام */
              h1.removeAttribute("data-i18n");
            }
            break;
          }
        }
      }

      ready.then(function () {
        var q = sb.from("factories")
          .select("id, name, cover, logo")
          .order("created_at", { ascending: false });
        if (wantedCat) q = q.eq("industry", wantedCat);
        return q;
      }).then(function (res) {
        if (!res || res.error) {
          showState(t("fx_failed", "تعذّر تحميل المصانع"));
          return;
        }
        render(res.data || []);
      }).catch(function () {
        showState(t("fx_failed", "تعذّر تحميل المصانع"));
      });
    })();
  </script>

</body>
</html>
