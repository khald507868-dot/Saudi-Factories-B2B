name: Validate project

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML scripts and SQL migrations
        run: python3 scripts/validate-static.py
      - name: Validate web links after Flutter cutover
        run: python3 scripts/check_web_integrity.py
      - name: Validate Flutter translation references
        run: node scripts/check_flutter_integrity.mjs

  flutter-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-tree-shake-icons
