name: Validate project

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML scripts and SQL migrations
        run: python3 scripts/validate-static.py
      - name: Validate web links after Flutter cutover
        run: python3 scripts/check_web_integrity.py
      - name: Validate Flutter translation references
        run: node scripts/check_flutter_integrity.mjs
      - name: Install isolated security test database
        run: npm install --prefix "$RUNNER_TEMP/security-tests" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.8
      - name: Verify authorization and security regressions
        shell: bash
        run: |
          node scripts/test_avatar_security.mjs
          node scripts/test_manual_shipping_client.mjs
          node scripts/test_shipping_images_client.mjs
          node scripts/test_delivery_addresses_client.mjs
          node scripts/test_delivery_geocoding.mjs
          for check in account_access account_approval account_deletion delivery_addresses factory_resubmission factory_certificates private_offers message_product_security internal_function_permissions tier_price_permissions storage_listing checkout_security profile_factory_privacy manual_shipping; do
            node "scripts/test_${check}.mjs" "$RUNNER_TEMP/security-tests"
          done

  flutter-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-tree-shake-icons
