<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | المساعدة والدعم
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     لا توجد لها نسخة تطبيق بعد.
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="help_page_title">المساعدة والدعم - المصانع السعودية</title>
<script src="i18n.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== الرأس ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 12px 16px;
    background: #ffffff;
  }

  .page-header h1 {
    font-size: 19px;
    font-weight: 700;
    color: #04361b;
  }

  .back-btn {
    position: absolute;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #04361b;
  }

  html[dir="ltr"] .back-btn {
    right: auto;
    left: 16px;
  }

  html[dir="ltr"] .back-btn svg {
    transform: scaleX(-1);
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  /* ===== المحتوى ===== */
  .content-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  .contact-title {
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
    margin: 4px 4px 10px;
  }

  .contact-list {
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(4,54,27,0.06);
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 14px;
    text-decoration: none;
    color: #04361b;
    border-bottom: 1px solid #eef1ee;
  }

  .contact-list .contact-row:last-child {
    border-bottom: none;
  }

  .contact-row .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #eaf3ee;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .contact-row .icon-wrap svg {
    width: 20px;
    height: 20px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
  }

  .contact-row .contact-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: right;
  }

  html[dir="ltr"] .contact-row .contact-text {
    text-align: left;
  }

  .contact-row .contact-label {
    font-size: 12.5px;
    color: #04361b;
    font-weight: 600;
  }

  .contact-row .contact-value {
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
    direction: ltr;
    unicode-bidi: isolate;
  }

  .contact-row .contact-value.email-value {
    direction: ltr;
    unicode-bidi: plaintext;
  }
</style>
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body class="doc-page">

  <!-- الشعار — سطح المكتب فقط (مخفي على الجوال عبر desktop.css) -->
  <a class="page-logo" href="index.html">
    <span class="wm-title"><span class="w-green">Saudi</span> <span class="w-dark">Factories</span> <span class="w-b2b">B2B</span></span>
    <span class="wm-rule"></span>
  </a>

  <header class="page-header">
    <h1 data-i18n="help_page_heading">المساعدة والدعم</h1>
    <a href="web-account.html" class="back-btn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </header>

  <div class="content-wrap">
    <p class="contact-title" data-i18n="help_contact_title">تواصل معنا</p>

    <div class="contact-list">
      <a href="tel:+966112345678" class="contact-row">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </span>
        <span class="contact-text">
          <span class="contact-label" data-i18n="help_phone_main_label">الهاتف الرئيسي</span>
          <span class="contact-value">+966 11 234 5678</span>
        </span>
      </a>
      <a href="tel:+966501234567" class="contact-row">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        </span>
        <span class="contact-text">
          <span class="contact-label" data-i18n="help_phone_support_label">الدعم الفني</span>
          <span class="contact-value">+966 50 123 4567</span>
        </span>
      </a>
      <a href="mailto:support@saudifactories.com" class="contact-row">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"></path><path d="m22 6-10 7L2 6"></path></svg>
        </span>
        <span class="contact-text">
          <span class="contact-label" data-i18n="help_email_label">البريد الإلكتروني</span>
          <span class="contact-value email-value">support@saudifactories.com</span>
        </span>
      </a>
    </div>
  </div>

</body>
</html>
