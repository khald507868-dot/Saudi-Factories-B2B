<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | بوّابة المصانع (الموردين)
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     صفحة واحدة بتبويبين: "تسجيل دخول" و"تسجيل مصنع جديد".
     والرابط ‎web-supplier.html#register‎ يفتحها على تبويب التسجيل.

     الفرق عن web-login.html نظيرتها للأفراد: هنا accountType
     مثبّت على "factory"، فيُظهر النموذج السجل التجاري وعنوان
     المصنع وصورة الشركة، ويحذف حقل الجنس. أمّا web-login.html
     فمثبّتة على "individual" بالعكس تماماً.
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="supplier_page_title">بوّابة المصانع - المصانع السعودية</title>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #ffffff;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== الرأس ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 18px 16px;
  }

  .page-header h1 {
    font-size: 19px;
    font-weight: 700;
    color: #04361b;
  }

  .back-btn {
    position: absolute;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #04361b;
  }

  html[dir="ltr"] .back-btn {
    right: auto;
    left: 16px;
  }

  html[dir="ltr"] .back-btn svg {
    transform: scaleX(-1);
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  /* ===== خريطة المملكة كعلامة مائية خلف النموذج =====
     القصّ على الطبقة الخارجية وحدها، حتى لا يدور مستطيل القصّ مع أي تحويل داخلي،
     والحصر داخل عمود الجوال بإزاحات صريحة لأن margin: auto لا يوسّط عنصراً ثابتاً */
  .map-watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .map-watermark svg {
    width: 118%;
    max-width: none;
    height: auto;
    opacity: 0.07;
  }

  .map-watermark .deco-region {
    fill: #04361b;
    stroke: #04361b;
    stroke-width: 1.5;
  }

  @media (min-width: 520px) {
    .map-watermark {
      right: calc(50% - 215px);
      left: calc(50% - 215px);
    }
  }

  /* ===== النموذج ===== */
  .form-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 8px 20px 0;
    /* فوق العلامة المائية */
    position: relative;
    z-index: 1;
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: block;
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: #04361b;
    margin-bottom: 8px;
  }

  html[dir="ltr"] .field label {
    text-align: left;
  }

  .field input {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 14px 14px;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    background: #ffffff;
    text-align: right;
    outline: none;
  }

  html[dir="ltr"] .field input {
    text-align: left;
  }

  .field input:focus {
    border-color: #04361b;
  }

  .field input::placeholder {
    color: #9aa8a0;
  }

  /* صورة الشركة */
  .company-image-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  .image-upload {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 1.5px dashed #c7d0ca;
    background: #fafbfa;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
  }

  .image-upload img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-upload svg {
    width: 30px;
    height: 30px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.6;
  }

  .company-image-field .upload-label {
    font-size: 13px;
    color: #04361b;
    font-weight: 600;
  }

  /* الجنس */
  .gender-row {
    display: flex;
    gap: 12px;
  }

  .gender-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    color: #04361b;
    cursor: pointer;
    background: #ffffff;
  }

  .gender-option input {
    display: none;
  }

  .gender-option .icon {
    font-size: 16px;
    line-height: 1;
  }

  .gender-option:has(input:checked) {
    border-color: #04361b;
    border-width: 1.5px;
  }

  /* رقم الجوال */
  .phone-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 12px 14px;
    /* خلفية بيضاء حتى لا تظهر خريطة الخلفية داخل الحقل */
    background: #ffffff;
  }

  .phone-row .country {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding-left: 10px;
    border-left: 1px solid #e2e6e3;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
  }

  .phone-row .flag {
    font-size: 20px;
    line-height: 1;
    flex-shrink: 0;
  }

  .phone-row .code {
    font-size: 14px;
    font-weight: 600;
    color: #04361b;
    direction: ltr;
  }

  .phone-row .country-chevron {
    width: 12px;
    height: 12px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
    flex-shrink: 0;
  }

  .phone-row input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    text-align: right;
    direction: ltr;
  }

  .phone-row input::placeholder {
    color: #9aa8a0;
  }

  /* كلمة المرور */
  .password-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 4px 14px;
    /* خلفية بيضاء حتى لا تظهر خريطة الخلفية داخل الحقل */
    background: #ffffff;
  }

  .password-row:focus-within {
    border-color: #04361b;
  }

  .password-row input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px 0;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    text-align: right;
  }

  html[dir="ltr"] .password-row input {
    text-align: left;
  }

  .password-row input::placeholder {
    color: #9aa8a0;
  }

  .password-toggle {
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .password-toggle svg {
    width: 20px;
    height: 20px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
  }

  /* ===== الأزرار ===== */
  .btn-update {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: #e5e8e6;
    color: #a3aca6;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    margin-top: 6px;
    cursor: not-allowed;
  }

  .btn-update.enabled {
    background: #04361b;
    color: #ffffff;
    cursor: pointer;
  }

  .form-footer {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: #04361b;
  }

  .form-footer a {
    color: #04361b;
    font-weight: 700;
    text-decoration: none;
    margin-inline-start: 4px;
  }

  /* ===== نافذة اختيار الدولة ===== */
  .country-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 30;
  }

  .country-modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .country-modal {
    width: 100%;
    max-width: 480px;
    max-height: 78vh;
    background: #ffffff;
    border-radius: 18px 18px 0 0;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .country-modal-overlay.open .country-modal {
    transform: translateY(0);
  }

  .country-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 10px;
  }

  .country-modal-header h2 {
    font-size: 16px;
    font-weight: 700;
  }

  .country-modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f1f3f1;
    color: #04361b;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .country-search {
    margin: 0 18px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f3f5f3;
    border-radius: 10px;
    padding: 10px 12px;
  }

  .country-search svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  .country-search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    text-align: right;
  }

  .country-list {
    overflow-y: auto;
    padding: 0 8px 18px;
  }

  .country-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border: none;
    background: none;
    font-family: inherit;
    text-align: right;
    cursor: pointer;
    border-radius: 10px;
  }

  .country-item:hover,
  .country-item:focus {
    background: #f3f5f3;
  }

  .country-item .flag {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
  }

  .country-item .name {
    flex: 1;
    font-size: 14px;
    color: #04361b;
  }

  .country-item .dial {
    font-size: 13px;
    color: #04361b;
    direction: ltr;
  }

  .country-empty {
    text-align: center;
    color: #9aa8a0;
    font-size: 14px;
    padding: 24px 0;
  }

  /* ===== خانة عنوان المصنع ===== */
  .address-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    background: #ffffff;
    padding: 13px 12px;
    font-family: inherit;
    font-size: 14px;
    color: #04361b;
    text-align: right;
    cursor: pointer;
  }

  html[dir="ltr"] .address-trigger {
    text-align: left;
  }

  .address-trigger .value {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .address-trigger .value.empty {
    color: #9aa8a0;
  }

  .address-trigger svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  /* السهم يشير لليسار في RTL ولليمين في LTR */
  html[dir="ltr"] .address-trigger svg {
    transform: scaleX(-1);
  }

  /* ===== نافذة العنوان السفلية ===== */
  .address-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 30;
  }

  .address-modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .address-modal {
    width: 100%;
    max-width: 480px;
    max-height: 78vh;
    background: #ffffff;
    border-radius: 18px 18px 0 0;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .address-modal-overlay.open .address-modal {
    transform: translateY(0);
  }

  .address-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 10px;
    flex-shrink: 0;
  }

  .address-modal-header h2 {
    font-size: 16px;
    font-weight: 700;
  }

  .address-modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f1f3f1;
    color: #04361b;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .address-body {
    overflow-y: auto;
    padding: 4px 18px 18px;
  }

  .address-body .field {
    margin-bottom: 14px;
  }

  /* الحقول ذات الصيغة الإنجليزية تُكتب من اليسار إلى اليمين دائماً */
  .address-body input.ltr-field {
    direction: ltr;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .address-body input.invalid {
    border-color: #d93025;
  }

  .field-hint {
    display: block;
    font-size: 11.5px;
    color: #9aa8a0;
    margin-top: 5px;
  }

  .field-hint.error {
    color: #d93025;
  }

  .address-save-btn {
    width: 100%;
    border: none;
    border-radius: 999px;
    background: #04361b;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    margin-top: 4px;
    cursor: pointer;
  }

  .address-save-btn:disabled {
    background: #c2ccc6;
    cursor: default;
  }

  /* ===== شريط التبويبين: تسجيل الدخول / حساب جديد ===== */
  /* تبويبان متساويان يعلوان البطاقة، والنشط منهما أبيض بخط سفلي أخضر.
     مبنيان بـ role="tab" ليقرأهما قارئ الشاشة كتبويبين لا كزرّين. */
  .auth-tabs {
    display: flex;
    border-bottom: 1px solid #e6ebe8;
    margin: 0 0 26px;
  }

  .auth-tab {
    flex: 1;
    padding: 16px 8px;
    border: none;
    background: #f3f5f3;
    color: #6b7a70;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .auth-tab:hover { color: #2c5f3f; }

  .auth-tab[aria-selected="true"] {
    background: #ffffff;
    color: #2c5f3f;
    border-bottom-color: #2c5f3f;
  }

  /* اللوحة المخفية: hidden وحدها لا تكفي مع display الموروث */
  .auth-panel[hidden] { display: none; }

  /* ===== زوايا حادّة =====
     بطلب المالك: الحقول والأزرار والبطاقة بزوايا قائمة.
     الصنف sharp-corners على body يقصر هذا على بوّابتَي
     الدخول — فـ .field و .btn-update وغيرها أصناف مشتركة
     مع صفحات أخرى، وقاعدة بلا الصنف كانت ستربّعها كلّها.

     ويُستثنى المستديران عمداً: .back-btn و .image-upload
     دائرتان بـ50% لا زوايا لهما، والنوافذ السفلية تبقى
     بحوافّها العليا المستديرة كنمط النوافذ في المشروع. */
  .sharp-corners .field input,
  .sharp-corners .gender-option,
  .sharp-corners .phone-row,
  .sharp-corners .password-row,
  .sharp-corners .btn-update,
  .sharp-corners .address-trigger,
  .sharp-corners .country-search,
  .sharp-corners .country-item,
  .sharp-corners .address-save-btn { border-radius: 0; }

  /* ممرّ بين بوّابتَي الأفراد والمصانع */
  .auth-switch {
    margin: -8px 0 22px;
    text-align: center;
    font-size: 13px;
  }

  .auth-switch a {
    color: #1f6b42;
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .auth-switch a:hover { border-bottom-color: #1f6b42; }

  /* ===== شريط الشعار أعلى الصفحة =====
     مخفيّ افتراضياً: تصميم الهاتف يبقى كما هو، وترويسته
     .page-header وحدها. و desktop.css يُظهره فوق ١٠٢٤ بكسل. */
  .auth-brandbar { display: none; }

  .auth-brandbar .brand-seal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 260px;
    text-decoration: none;
  }

  .auth-brandbar .wm-title {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.15;
    white-space: nowrap;
    /* الاسم لاتيني دائماً، فيثبّت اتجاهه حتى لا ينعكس ترتيب الكلمتين في RTL */
    direction: ltr;
  }

  .auth-brandbar .wm-title .w-green { color: #45a06a; }
  .auth-brandbar .wm-title .w-dark  { color: #04361b; }

  .auth-brandbar .wm-title .w-b2b {
    color: #c9a227;
    font-size: 0.52em;
    vertical-align: 0.68em;
  }

  /* الخط المتدرّج القصير تحت الاسم نفسه */
  .auth-brandbar .wm-rule {
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to left, #1f6b42, #45a06a, #c9a227);
  }

  html[dir="ltr"] .auth-brandbar .wm-rule {
    background: linear-gradient(to right, #1f6b42, #45a06a, #c9a227);
  }
</style>
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body class="auth-page sharp-corners">
  <!-- خريطة المملكة كعلامة مائية خلف النموذج: شكل فقط، بلا أسماء مناطق وبلا تفاعل -->

  <!-- ===== مبدّل التبويبين =====
       يجب أن يسبق سكربتَي الدخول والتسجيل، لأن سكربت التسجيل
       يقرأ عنوان الصفحة ويكتب فوقه عند حساب المصنع. -->
  <script>
    (function () {
      var tabs = {
        login: document.getElementById("tab-login"),
        register: document.getElementById("tab-register")
      };
      var panels = {
        login: document.getElementById("panel-login"),
        register: document.getElementById("panel-register")
      };
      var heading = document.querySelector(".page-header h1");

      /* عنوان الترويسة يتبع التبويب النشط. ونصّ تبويب "حساب جديد"
         وعنوانه يصيران "تسجيل مصنع" حين يكون نوع الحساب مصنعاً —
         وهو ما كانت صفحة التسجيل تفعله بعنوانها وحده. */
      /* صفحة المصانع: نصّ التبويب "تسجيل مصنع جديد" دائماً */
      var signupKey = "splash_signup_factory_btn";
      tabs.register.setAttribute("data-i18n", signupKey);
      tabs.register.textContent = I18N.t(signupKey);

      var titleKey = { login: "splash_login_btn", register: signupKey };

      function show(name) {
        if (!tabs[name]) name = "login";
        ["login", "register"].forEach(function (n) {
          var active = n === name;
          tabs[n].setAttribute("aria-selected", active ? "true" : "false");
          panels[n].hidden = !active;
        });
        /* الصفة والنص معاً: applyTranslations() تكون قد عملت قبل هذا */
        heading.setAttribute("data-i18n", titleKey[name]);
        heading.textContent = I18N.t(titleKey[name]);
        /* عنوان المستند واحد في التبويبين: هذه بوّابة المصانع */
        document.title = I18N.t("supplier_page_title");
      }

      tabs.login.addEventListener("click", function () { show("login"); });
      tabs.register.addEventListener("click", function () { show("register"); });

      /* روابط "ليس لديك حساب؟" و"لديك حساب بالفعل؟" أسفل كل لوحة */
      Array.prototype.forEach.call(
        document.querySelectorAll(".tab-jump"),
        function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            show(a.getAttribute("data-go"));
          });
        }
      );

      /* ‎#register في الرابط يفتح تبويب التسجيل مباشرة —
         وهو ما تستخدمه الروابط القادمة من الصفحات الأخرى. */
      var start = (location.hash || "").replace("#", "");
      show(start === "register" ? "register" : "login");
    })();
  </script>

  <script>
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-btn");
      var emailInput = document.getElementById("l-email");
      var passwordInput = document.getElementById("l-password");

      function checkFilled() {
        var filled = emailInput.value.trim().length > 0 && passwordInput.value.trim().length > 0;
        btn.disabled = !filled;
        btn.classList.toggle("enabled", filled);
      }

      emailInput.addEventListener("input", checkFilled);
      passwordInput.addEventListener("input", checkFilled);

      var toggle = document.getElementById("l-password-toggle");
      var eyeIcon = document.getElementById("l-eye-icon");

      toggle.addEventListener("click", function () {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";

         ويُظهر السجل التجاري والعنوان، ويجعل الاسم اسم الشركة. */

      var isFactory = true;

      var crInput = document.getElementById("f-cr");

      if (isFactory) {
        /* حذف حقل الجنس نهائياً من النموذج */
        var genderField = document.getElementById("gender-field");
        if (genderField) genderField.parentNode.removeChild(genderField);

        /* تغيير خانة الاسم إلى اسم الشركة */
        var nameLabel = document.getElementById("name-label");
        nameLabel.setAttribute("data-i18n", "field_company_name");
        nameLabel.textContent = I18N.t("field_company_name");
        nameInput.setAttribute("data-i18n-placeholder", "field_company_name_placeholder");
        nameInput.placeholder = I18N.t("field_company_name_placeholder");

        /* عنوان الصفحة وتبويب التسجيل يضبطهما مبدّل التبويبين أعلاه */
        btn.setAttribute("data-i18n", "splash_signup_factory_btn");
        btn.textContent = I18N.t("splash_signup_factory_btn");
      } else {
        /* الأفراد ليس لديهم سجل تجاري ولا عنوان مصنع */
        var crField = document.getElementById("cr-field");
        if (crField) crField.parentNode.removeChild(crField);
        crInput = null;

        var addressFieldEl = document.getElementById("address-field");
        if (addressFieldEl) addressFieldEl.parentNode.removeChild(addressFieldEl);

        var addressOverlayEl = document.getElementById("address-modal-overlay");
        if (addressOverlayEl) addressOverlayEl.parentNode.removeChild(addressOverlayEl);
      }

      function checkFilled() {
        var filled = nameInput.value.trim().length > 0 &&
          phoneInput.value.trim().length > 0 &&
          emailInput.value.trim().length > 0 &&
          passwordInput.value.trim().length > 0 &&
          (!crInput || crInput.value.trim().length > 0) &&
          (!isFactory || addressData.city.length > 0);
        btn.disabled = !filled;
        btn.classList.toggle("enabled", filled);
      }

      function saveAccountData() {
        var checkedGender = form.querySelector('input[name="gender"]:checked');
        var accountData = {
          accountType: accountType,
          name: nameInput.value.trim(),
          commercialRegister: crInput ? crInput.value.trim() : "",
          address: isFactory ? addressData : null,
          gender: checkedGender ? checkedGender.value : "",
          countryFlag: document.getElementById("country-flag").textContent,
          countryCode: document.getElementById("country-code").textContent,
          phone: phoneInput.value.trim(),
          email: emailInput.value.trim(),
          companyImage: companyImageData
        };
        try {
          localStorage.setItem("sf_account", JSON.stringify(accountData));
        } catch (err) {}
      }

      var fields = [nameInput, phoneInput, emailInput, passwordInput];
      if (crInput) fields.push(crInput);

      fields.forEach(function (el) {
        el.addEventListener("input", checkFilled);
        el.addEventListener("input", saveAccountData);
        el.addEventListener("blur", saveAccountData);
      });

      form.querySelectorAll('input[name="gender"]').forEach(function (el) {
        el.addEventListener("change", saveAccountData);
      });

      var imageInput = document.getElementById("f-company-image");
      var imagePreview = document.getElementById("image-preview");
      var imageIcon = document.getElementById("image-upload-icon");

      /* تصغير الصورة قبل الحفظ حتى لا تمتلئ مساحة التخزين وتضيع بيانات الحساب */
      function resizeImage(dataUrl, maxSize, done) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          done(canvas.toDataURL("image/jpeg", 0.8));
        };
        img.onerror = function () { done(dataUrl); };
        img.src = dataUrl;
      }

      imageInput.addEventListener("change", function () {
        var file = imageInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          resizeImage(e.target.result, 400, function (resized) {
            companyImageData = resized;
            imagePreview.src = companyImageData;
            imagePreview.style.display = "block";
            imageIcon.style.display = "none";
            saveAccountData();
          });
        };
        reader.readAsDataURL(file);
      });

        ["PW", "بالاو", "680"],
        ["NR", "ناورو", "674"],
        ["TV", "توفالو", "688"]
      ];

      function flagEmoji(iso) {
        return iso.replace(/./g, function (c) {
          return String.fromCodePoint(127397 + c.charCodeAt(0));
        });
      }

      var countryModalOverlay = document.getElementById("country-modal-overlay");
      var countryModalClose = document.getElementById("country-modal-close");
      var countryTrigger = document.getElementById("country-trigger");
      var countryList = document.getElementById("country-list");
      var countrySearchInput = document.getElementById("country-search-input");
      var countryFlagEl = document.getElementById("country-flag");
      var countryCodeEl = document.getElementById("country-code");

      function renderCountries(filter) {
        var q = (filter || "").trim().toLowerCase();
        countryList.innerHTML = "";
        var found = false;

        countries.forEach(function (c) {
          var iso = c[0], name = c[1], dial = c[2];
          if (q && name.toLowerCase().indexOf(q) === -1 && dial.indexOf(q.replace("+", "")) === -1) {
            return;
          }
          found = true;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "country-item";
          btn.innerHTML =
            '<span class="flag">' + flagEmoji(iso) + '</span>' +
            '<span class="name">' + name + '</span>' +
            '<span class="dial">+' + dial + '</span>';
          btn.addEventListener("click", function () {
            countryFlagEl.textContent = flagEmoji(iso);
            countryCodeEl.textContent = "+" + dial;
            saveAccountData();
            closeCountryModal();
          });
          countryList.appendChild(btn);
        });

        if (!found) {
          var empty = document.createElement("p");
          empty.className = "country-empty";
          empty.textContent = "لا توجد نتائج مطابقة";
          countryList.appendChild(empty);
        }
      }

      function openCountryModal() {
        renderCountries("");
        countrySearchInput.value = "";
        countryModalOverlay.classList.add("open");
        document.body.style.overflow = "hidden";
        setTimeout(function () { countrySearchInput.focus(); }, 150);
      }

      function closeCountryModal() {
        countryModalOverlay.classList.remove("open");
        document.body.style.overflow = "";
      }

      countryTrigger.addEventListener("click", openCountryModal);
      countryModalClose.addEventListener("click", closeCountryModal);
      countryModalOverlay.addEventListener("click", function (e) {
        if (e.target === countryModalOverlay) closeCountryModal();
      });
      countrySearchInput.addEventListener("input", function () {
        renderCountries(countrySearchInput.value);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeCountryModal();
      });

      /* ===== نافذة عنوان المصنع (للمصانع فقط) ===== */
      if (isFactory) {
        var addressOverlay = document.getElementById("address-modal-overlay");
        var addressClose = document.getElementById("address-modal-close");
        var addressTrigger = document.getElementById("address-trigger");
        var addressValue = document.getElementById("address-value");
        var addressSaveBtn = document.getElementById("address-save-btn");

        var cityInput = document.getElementById("a-city");
        var districtInput = document.getElementById("a-district");
        var shortInput = document.getElementById("a-short");
        var buildingInput = document.getElementById("a-building");
        var secondaryInput = document.getElementById("a-secondary");
        var postalInput = document.getElementById("a-postal");
        var streetInput = document.getElementById("a-street");

        /* تنقية المدخلات: أرقام إنجليزية فقط، أو 4 أحرف ثم 4 أرقام للعنوان المختصر */
        function digitsOnly(value, max) {
          return value.replace(/[^0-9]/g, "").slice(0, max);
        }

        function formatShortAddress(value) {
          var clean = value.toUpperCase().replace(/[^A-Z0-9]/g, "");
          var letters = "";
          var digits = "";
          for (var i = 0; i < clean.length; i++) {
            var ch = clean.charAt(i);
            if (letters.length < 4) {
              if (ch >= "A" && ch <= "Z") letters += ch;
            } else if (digits.length < 4) {
              if (ch >= "0" && ch <= "9") digits += ch;
            }
          }
          return letters + digits;
        }

        shortInput.addEventListener("input", function () {
          shortInput.value = formatShortAddress(shortInput.value);
          validateAddress();
        });

        [[buildingInput, 4], [secondaryInput, 4], [postalInput, 5]].forEach(function (pair) {
          pair[0].addEventListener("input", function () {
            pair[0].value = digitsOnly(pair[0].value, pair[1]);
            validateAddress();
          });
        });

        [cityInput, districtInput, streetInput].forEach(function (el) {
          el.addEventListener("input", validateAddress);
        });

        /* التحقق من اكتمال كل الخانات بالصيغة المطلوبة */
        function validateAddress() {
          var shortOk = /^[A-Z]{4}[0-9]{4}$/.test(shortInput.value);
          var buildingOk = /^[0-9]{4}$/.test(buildingInput.value);
          var secondaryOk = /^[0-9]{4}$/.test(secondaryInput.value);
          var postalOk = /^[0-9]{5}$/.test(postalInput.value);

          markField(shortInput, shortOk);
          markField(buildingInput, buildingOk);
          markField(secondaryInput, secondaryOk);
          markField(postalInput, postalOk);

          var valid = cityInput.value.trim().length > 0 &&
            districtInput.value.trim().length > 0 &&
            streetInput.value.trim().length > 0 &&
            shortOk && buildingOk && secondaryOk && postalOk;

          addressSaveBtn.disabled = !valid;
          return valid;
        }

        /* تلوين الحقل بالأحمر فقط بعد أن يبدأ المستخدم بالكتابة فيه */
        function markField(el, ok) {
          if (el.value.length > 0 && !ok) {
            el.classList.add("invalid");
          } else {
            el.classList.remove("invalid");
          }
        }

        /* ملخص العنوان الظاهر في الخانة الرئيسية */
        function addressSummary() {
          var parts = [
            addressData.street, addressData.district,
            addressData.city, addressData.postal
          ].filter(function (p) { return p; });
          return parts.join("، ");
        }

        function updateAddressValue() {
          var summary = addressSummary();
          if (summary) {
            addressValue.textContent = summary;
            addressValue.classList.remove("empty");
            addressValue.removeAttribute("data-i18n");
          } else {
            addressValue.textContent = I18N.t("field_address_placeholder");
            addressValue.classList.add("empty");
            addressValue.setAttribute("data-i18n", "field_address_placeholder");
          }
        }

        function openAddressModal() {
          cityInput.value = addressData.city;
          districtInput.value = addressData.district;
          shortInput.value = addressData.shortAddress;
          buildingInput.value = addressData.building;
          secondaryInput.value = addressData.secondary;
          postalInput.value = addressData.postal;
          streetInput.value = addressData.street;
          validateAddress();
          addressOverlay.classList.add("open");
          document.body.style.overflow = "hidden";
        }

        function closeAddressModal() {
          addressOverlay.classList.remove("open");
          document.body.style.overflow = "";
        }

        addressTrigger.addEventListener("click", openAddressModal);
        addressClose.addEventListener("click", closeAddressModal);
        addressOverlay.addEventListener("click", function (e) {
          if (e.target === addressOverlay) closeAddressModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeAddressModal();
        });

        addressSaveBtn.addEventListener("click", function () {
          if (!validateAddress()) return;
          addressData = {
            city: cityInput.value.trim(),
            district: districtInput.value.trim(),
            shortAddress: shortInput.value,
            building: buildingInput.value,
            secondary: secondaryInput.value,
            postal: postalInput.value,
            street: streetInput.value.trim()
          };
          updateAddressValue();
          saveAccountData();
          checkFilled();
          closeAddressModal();
        });
      }
    })();
  </script>

</body>
</html>
