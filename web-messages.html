<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | المحادثات
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     مقابلها في التطبيق: app-messages.html
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="msg_page_title">الرسائل - المصانع السعودية</title>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="messages-service.js"></script>
<script src="auth-guard.js"></script>
<script src="messages-badge.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 52px;
  }

  /* ===== شريط علوي مشترك بين القائمة والمحادثة ===== */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
    background: #ffffff;
    border-bottom: 1px solid #e2e6e3;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .top-bar h1 {
    font-size: 17px;
    font-weight: 800;
    color: #04361b;
    flex: 1;
  }

  .back-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .back-btn svg {
    width: 17px;
    height: 17px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  html[dir="ltr"] .back-btn svg { transform: scaleX(-1); }

  /* ===== قائمة المحادثات ===== */
  .thread-list {
    padding: 6px 0;
    /* فوق العلامة المائية */
    position: relative;
    z-index: 1;
  }

  .thread {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px 12px;
    margin: 8px 10px;
    background: #ffffff;
    border: 1px solid #dbe7df;
    border-radius: 14px;
    cursor: pointer;
    text-align: right;
    width: calc(100% - 20px);
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(4,54,27,0.045);
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }

  html[dir="ltr"] .thread { text-align: left; }

  .thread:active { background: #f4f8f6; transform: scale(0.99); }

  .thread:hover {
    background: #f7faf8;
    border-color: #bcd6c5;
    box-shadow: 0 6px 15px rgba(4,54,27,0.08);
  }

  .thread.active {
    background: #edf6f0;
    border-color: #cfe2d5;
    box-shadow: inset -3px 0 0 #1f6b42, 0 5px 14px rgba(4,54,27,0.08);
  }

  html[dir="ltr"] .thread.active { box-shadow: inset 3px 0 0 #1f6b42, 0 5px 14px rgba(4,54,27,0.08); }

  .thread.unread .thread-name,
  .thread.unread .thread-last { font-weight: 800; }

  .thread-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #e6ece8;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    font-weight: 800;
    font-size: 15px;
    color: #04361b;
  }

  .thread-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thread-info {
    flex: 1;
    min-width: 0;
  }

  .thread-name {
    font-size: 14px;
    font-weight: 700;
    color: #04361b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .thread-last {
    font-size: 12px;
    color: #5c8a70;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .thread-time {
    font-size: 10.5px;
    color: #9aa8a0;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .thread-meta {
    min-width: 34px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    flex-shrink: 0;
  }

  html[dir="ltr"] .thread-meta { align-items: flex-start; }

  .unread-badge {
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #1f6b42;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(31,107,66,0.2);
  }

  .thread-skeleton {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 6px 10px;
    padding: 12px;
    border-radius: 14px;
    background: #ffffff;
  }

  .skeleton-dot,
  .skeleton-line {
    background: linear-gradient(90deg, #e8eeea 25%, #f7faf8 50%, #e8eeea 75%);
    background-size: 200% 100%;
    animation: messageShimmer 1.2s infinite;
  }

  .skeleton-dot { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
  .skeleton-copy { flex: 1; display: grid; gap: 8px; }
  .skeleton-line { height: 10px; border-radius: 999px; }
  .skeleton-line.short { width: 58%; }

  @keyframes messageShimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  /* ===== حالة الفراغ ===== */
  .empty-state {
    text-align: center;
    padding: 70px 30px;
    /* فوق العلامة المائية */
    position: relative;
    z-index: 1;
  }

  .empty-state svg {
    width: 62px;
    height: 62px;
    stroke: #b3bdb7;
    fill: none;
    stroke-width: 1.4;
    margin-bottom: 14px;
  }

  .empty-title {
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
    margin-bottom: 6px;
  }

  .empty-hint {
    font-size: 12.5px;
    color: #5c8a70;
  }

  /* ===== شاشة المحادثة ===== */
  .chat-view { display: none; }
  body.in-chat .thread-list-view { display: none; }
  body.in-chat .chat-view { display: block; }
  body.in-chat .back-btn { display: flex; }
  body.in-chat { padding-bottom: 0; }

  .chat-peer {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
  }

  .chat-peer-name {
    font-size: 14.5px;
    font-weight: 800;
    color: #04361b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-peer-role {
    font-size: 10.5px;
    color: #5c8a70;
    margin-top: 1px;
  }

  /* مساحة الرسائل: تُترك لها مسافة سفلية بقدر شريط الكتابة */
  .messages-area {
    padding: 12px 12px calc(74px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: calc(100vh - 120px);
    /* فوق العلامة المائية */
    position: relative;
    z-index: 1;
  }

  .chat-empty,
  .messages-empty,
  .messages-loading {
    margin: auto;
    text-align: center;
    color: #6f8778;
    padding: 28px;
  }

  .chat-empty svg {
    width: 56px;
    height: 56px;
    stroke: #9fb5a7;
    fill: none;
    stroke-width: 1.5;
    margin-bottom: 12px;
  }

  .chat-empty strong,
  .messages-empty strong {
    display: block;
    color: #04361b;
    font-size: 15px;
    margin-bottom: 5px;
  }

  .messages-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }

  .loading-spinner {
    width: 22px;
    height: 22px;
    border: 3px solid #dce7df;
    border-top-color: #1f6b42;
    border-radius: 50%;
    animation: messageSpin .7s linear infinite;
  }

  @keyframes messageSpin { to { transform: rotate(360deg); } }

  .chat-view.chat-ready .chat-empty { display: none; }
  .chat-view:not(.chat-ready) .messages-area { display: none; }
  .chat-view:not(.chat-ready) .composer { opacity: .5; pointer-events: none; }

  .day-sep {
    align-self: center;
    font-size: 10.5px;
    color: #5c8a70;
    background: #e6ece8;
    padding: 3px 12px;
    border-radius: 999px;
    margin: 6px 0;
  }

  .bubble {
    max-width: 76%;
    padding: 8px 11px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
    position: relative;
  }

  /* رسائلي: خضراء على الجهة المقابلة للاتجاه */
  .bubble.mine {
    align-self: flex-start;
    background: #04361b;
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  html[dir="ltr"] .bubble.mine {
    align-self: flex-end;
    border-bottom-right-radius: 14px;
    border-bottom-left-radius: 4px;
  }

  .bubble.theirs {
    align-self: flex-end;
    background: #ffffff;
    color: #04361b;
    border: 1px solid #e2e6e3;
    border-bottom-left-radius: 4px;
  }

  html[dir="ltr"] .bubble.theirs {
    align-self: flex-start;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 4px;
  }

  .bubble-time {
    font-size: 9.5px;
    opacity: 0.7;
    margin-top: 3px;
    text-align: left;
  }

  html[dir="ltr"] .bubble-time { text-align: right; }

  /* الوسائط داخل الفقاعة */
  .bubble-media {
    padding: 4px;
  }

  .bubble-media img,
  .bubble-media video {
    display: block;
    width: 100%;
    max-width: 220px;
    border-radius: 11px;
    background: #e6e9e7;
  }

  .bubble-caption {
    padding: 4px 7px 2px;
    font-size: 12.5px;
  }

  /* ===== شريط الكتابة ===== */
  .composer {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    display: flex;
    align-items: flex-end;
    gap: 7px;
    padding: 9px 11px calc(9px + env(safe-area-inset-bottom));
    background: #ffffff;
    border-top: 1px solid #e2e6e3;
    z-index: 10;
  }

  .composer-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #eef2ef;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .composer-btn:active { opacity: 0.8; }

  .composer-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.9;
  }

  .composer textarea {
    flex: 1;
    border: 1px solid #e2e6e3;
    border-radius: 18px;
    padding: 9px 13px;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    background: #ffffff;
    resize: none;
    outline: none;
    max-height: 96px;
    line-height: 1.4;
  }

  .composer textarea:focus { border-color: #04361b; }
  .composer textarea::placeholder { color: #9aa8a0; }

  .send-btn {
    background: #04361b;
  }

  .send-btn svg { stroke: #ffffff; }

  .send-btn:disabled {
    background: #e5e8e6;
    cursor: not-allowed;
  }

  .send-btn:disabled svg { stroke: #a3aca6; }

  /* شريط حالة الرفع */
  .upload-note {
    display: none;
    padding: 6px 14px;
    font-size: 11.5px;
    color: #5c8a70;
    background: #eef2ef;
    text-align: center;
  }

  .upload-note.show { display: block; }
  .upload-note.error { color: #d93025; }

  /* ===== زر المحادثة الجديدة ===== */
  .new-chat-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #04361b;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .new-chat-btn:active { opacity: 0.85; }

  .new-chat-btn svg {
    width: 17px;
    height: 17px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 2.4;
  }

  body.in-chat .new-chat-btn { display: none; }

  .empty-state .new-chat-inline {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: #04361b;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  /* ===== نافذة اختيار المصنع (النمط السفلي المعتاد) ===== */
  .pick-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 30;
  }

  .pick-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .pick-modal {
    position: fixed;
    right: 0;
    left: 0;
    bottom: 0;
    max-height: 74vh;
    background: #ffffff;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 31;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
  }

  .pick-overlay.open + .pick-modal { transform: translateY(0); }

  .pick-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    background: #04361b;
    color: #ffffff;
    border-radius: 16px 16px 0 0;
    flex-shrink: 0;
  }

  .pick-header h2 { font-size: 15px; font-weight: 800; }

  .pick-close {
    border: none;
    background: none;
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }

  .pick-search {
    padding: 10px 14px;
    border-bottom: 1px solid #eef1ef;
    flex-shrink: 0;
  }

  .pick-search input {
    width: 100%;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14px;
    font-family: inherit;
    color: #04361b;
    background: #ffffff;
    outline: none;
  }

  .pick-search input:focus { border-color: #04361b; }

  .pick-list {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .pick-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 15px;
    border: none;
    border-bottom: 1px solid #f0f3f1;
    background: #ffffff;
    font-family: inherit;
    font-size: 13.5px;
    color: #04361b;
    text-align: right;
    cursor: pointer;
  }

  html[dir="ltr"] .pick-item { text-align: left; }

  .pick-item:active { background: #f4f8f6; }

  /* ===== ورقة اختيار المصدر (كاميرا / معرض) ===== */
  .source-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 30;
  }

  .source-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .source-sheet {
    position: fixed;
    right: 0;
    left: 0;
    bottom: 0;
    background: #ffffff;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 31;
    padding-bottom: env(safe-area-inset-bottom);
    margin: 0 auto;
  }

  .source-overlay.open + .source-sheet { transform: translateY(0); }

  .source-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-bottom: 1px solid #f0f3f1;
    background: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #04361b;
    text-align: right;
    cursor: pointer;
  }

  html[dir="ltr"] .source-item { text-align: left; }

  .source-item:active { background: #f4f8f6; }

  .source-item svg {
    width: 21px;
    height: 21px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.8;
    flex-shrink: 0;
  }

  .source-item.cancel {
    justify-content: center;
    color: #5c8a70;
    border-bottom: none;
    font-weight: 700;
  }

  /* ===== الشريط السفلي ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    height: 52px;
    background: #ffffff;
    display: flex;
    border-top: 2px solid #04361b;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 10;
  }

  body.in-chat .bottom-nav { display: none; }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: #5c8a70;
    font-size: 9.5px;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    flex-shrink: 0;
  }

  .nav-item.active {
    color: #04361b;
    font-weight: 700;
  }

  /* ===== خريطة المملكة كعلامة مائية في الخلف =====
     القصّ على الطبقة الخارجية وحدها، حتى لا يدور مستطيل القصّ مع أي تحويل داخلي،
     والحصر داخل عمود الجوال بإزاحات صريحة لأن margin: auto لا يوسّط عنصراً ثابتاً */
  .map-watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .map-watermark svg {
    width: 118%;
    max-width: none;
    height: auto;
    opacity: 0.07;
  }

  .map-watermark .deco-region {
    fill: #04361b;
    stroke: #04361b;
    stroke-width: 1.5;
  }

  @media (min-width: 520px) {
    .map-watermark {
      right: calc(50% - 215px);
      left: calc(50% - 215px);
    }
  }
</style>

<link rel="stylesheet" href="desktop.css">
</head>
<body class="chat-page">
  <!-- شعار الصفحة — متحرّك، موحّد في كل صفحات الموقع -->
  <a class="page-logo" href="index.html">
    <span class="wm-title"><span class="w-green">Saudi</span> <span class="w-dark">Factories</span> <span class="w-b2b">B2B</span></span>
    <span class="wm-rule"></span>
  </a>

  <!-- خريطة المملكة كعلامة مائية في الخلف: شكل فقط، بلا أسماء مناطق وبلا تفاعل -->

  <script>
    (function () {
      "use strict";

      /* تُضبط بعد اكتمال قراءة الجلسة والملف الشخصي من الخادم. */
      var myRole = "individual";

      var threadListEl = document.getElementById("thread-list");
      var emptyStateEl = document.getElementById("empty-state");
      var messagesArea = document.getElementById("messages-area");
      var msgInput = document.getElementById("msg-input");
      var sendBtn = document.getElementById("send-btn");
      var backBtn = document.getElementById("back-btn");
      var listTitle = document.getElementById("list-title");
      var chatView = document.getElementById("chat-view");
      var chatPeer = document.getElementById("chat-peer");
      var peerName = document.getElementById("peer-name");
      var peerRole = document.getElementById("peer-role");
      var peerAvatar = document.getElementById("peer-avatar");
      var uploadNote = document.getElementById("upload-note");
      var imageInput = document.getElementById("image-input");
      var videoInput = document.getElementById("video-input");
      var imageCapture = document.getElementById("image-capture");
      var videoCapture = document.getElementById("video-capture");

      var threads = {};
      var activeId = null;
      var messageChannel = null;
      var loadToken = 0;
      var refreshTimer = null;

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showNote(text, isError) {
        uploadNote.textContent = text;
        uploadNote.className = "upload-note show" + (isError ? " error" : "");
        if (isError) {
          setTimeout(function () { uploadNote.className = "upload-note"; }, 2600);
        }
      }

      function hideNote() {
        uploadNote.className = "upload-note";
      }

      function formatTime(ts) {
        var d = new Date(ts);
        var h = d.getHours();
        var m = d.getMinutes();
        return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
      }

      function dayKey(ts) {
        var d = new Date(ts);
        return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      }

      function dayLabel(ts) {
        var today = dayKey(Date.now());
        var yest = dayKey(Date.now() - 86400000);
        var k = dayKey(ts);
        if (k === today) return I18N.t("msg_today");
        if (k === yest) return I18N.t("msg_yesterday");
        var d = new Date(ts);
        return d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
      }

      /* ===== قائمة المحادثات ===== */
      function renderThreadSkeletons() {
        emptyStateEl.style.display = "none";
        var html = "";
        for (var i = 0; i < 4; i++) {
          html += '<div class="thread-skeleton" aria-hidden="true">' +
            '<span class="skeleton-dot"></span>' +
            '<span class="skeleton-copy"><span class="skeleton-line short"></span>' +
            '<span class="skeleton-line"></span></span></div>';
        }
        threadListEl.innerHTML = html;
      }

      function renderThreadList() {
        var ids = Object.keys(threads);

        if (!ids.length) {
          threadListEl.innerHTML = "";
          emptyStateEl.style.display = "block";
          return;
        }

        emptyStateEl.style.display = "none";

        /* الأحدث أولاً */
        ids.sort(function (a, b) {
          return (threads[b].updated || 0) - (threads[a].updated || 0);
        });

        var html = "";
        for (var i = 0; i < ids.length; i++) {
          var t = threads[ids[i]];
          var msgs = t.messages || [];
          var last = t.lastMessage || msgs[msgs.length - 1];

          var preview = "";
          if (last) {
            if (last.type === "image") preview = I18N.t("msg_photo");
            else if (last.type === "video") preview = I18N.t("msg_video");
            else preview = last.text || "";
            if (last.from === "mine" && preview) preview = "أنت: " + preview;
          }

          var initial = (t.name || "?").trim().charAt(0);
          var unread = Math.max(0, Number(t.unread || 0));
          var rowClass = "thread" + (ids[i] === activeId ? " active" : "") + (unread ? " unread" : "");
          var unreadText = unread > 99 ? "99+" : String(unread);

          html +=
            '<button type="button" class="' + rowClass + '" data-id="' + escapeHTML(ids[i]) + '">' +
              '<div class="thread-avatar">' +
                (t.avatar
                  ? '<img alt="" src="' + escapeHTML(t.avatar) + '">'
                  : escapeHTML(initial)) +
              '</div>' +
              '<div class="thread-info">' +
                '<div class="thread-name">' + escapeHTML(t.name || "") + '</div>' +
                '<div class="thread-last">' + escapeHTML(preview || "ابدأ المحادثة") + '</div>' +
              '</div>' +
              '<div class="thread-meta">' +
                '<span class="thread-time">' + (t.updated ? formatTime(t.updated) : "") + '</span>' +
                (unread ? '<span class="unread-badge" aria-label="' + unreadText + ' رسائل غير مقروءة">' + unreadText + '</span>' : '') +
              '</div>' +
            '</button>';
        }

        threadListEl.innerHTML = html;
      }

      /* ===== شاشة المحادثة ===== */
      function scrollToLatest() {
        window.requestAnimationFrame(function () {
          messagesArea.scrollTop = messagesArea.scrollHeight;
          if (window.innerWidth < 1024) window.scrollTo(0, document.body.scrollHeight);
        });
      }

      function renderMessageLoading() {
        messagesArea.innerHTML = '<div class="messages-loading"><span class="loading-spinner"></span><span>جارٍ تحميل المحادثة…</span></div>';
      }

      function renderMessages() {
        var t = threads[activeId];
        if (!t) return;

        var msgs = t.messages || [];
        if (!t.messagesLoaded) {
          renderMessageLoading();
          return;
        }

        if (!msgs.length) {
          messagesArea.innerHTML = '<div class="messages-empty"><strong>ابدأ المحادثة</strong><span>اكتب أول رسالة في الأسفل</span></div>';
          return;
        }

        var html = "";
        var lastDay = "";

        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];

          var k = dayKey(m.at);
          if (k !== lastDay) {
            html += '<div class="day-sep">' + escapeHTML(dayLabel(m.at)) + '</div>';
            lastDay = k;
          }

          /* رسائل الخادم تستخدم mine/theirs، والنسخ القديمة استخدمت اسم الدور. */
          var side = (m.from === "mine" || m.from === myRole) ? "mine" : "theirs";
          var isMedia = m.type === "image" || m.type === "video";

          html += '<div class="bubble ' + side + (isMedia ? ' bubble-media' : '') + '">';

          if (m.type === "image") {
            html += '<img alt="" src="' + escapeHTML(m.src || "") + '">';
          } else if (m.type === "video") {
            html += '<video src="' + escapeHTML(m.src || "") + '" controls playsinline></video>';
          }

          if (m.text) {
            html += isMedia
              ? '<div class="bubble-caption">' + escapeHTML(m.text) + '</div>'
              : escapeHTML(m.text);
          }

          html += '<div class="bubble-time">' + formatTime(m.at) + '</div>';
          html += '</div>';
        }

        messagesArea.innerHTML = html;
        scrollToLatest();
      }

      function loadConversationMessages(id, force) {
        var t = threads[id];
        if (!t) return Promise.resolve();

        var token = ++loadToken;
        var previousUnread = Number(t.unread || 0);
        t.unread = 0;
        renderThreadList();

        var messagesJob = (!force && t.messagesLoaded)
          ? Promise.resolve(t.messages || [])
          : SFMessages.loadMessages(Number(id));
        var readJob = previousUnread > 0
          ? SFMessages.markRead(Number(id))
          : Promise.resolve(0);

        if (!t.messagesLoaded || force) renderMessageLoading();

        return Promise.all([messagesJob, readJob]).then(function (results) {
          if (token !== loadToken || activeId !== id || !threads[id]) return;
          var current = threads[id];
          current.messages = results[0] || [];
          current.messagesLoaded = true;
          current.unread = 0;
          if (current.messages.length) {
            current.lastMessage = current.messages[current.messages.length - 1];
            current.updated = current.lastMessage.at || current.updated;
          }
          renderThreadList();
          renderMessages();
        }).catch(function (err) {
          if (token !== loadToken || activeId !== id || !threads[id]) return;
          threads[id].unread = previousUnread;
          renderThreadList();
          messagesArea.innerHTML = '<div class="messages-empty"><strong>تعذّر تحميل المحادثة</strong><span>' +
            escapeHTML((err && err.message) || "أعد المحاولة") + '</span></div>';
        });
      }

      function openChat(id) {
        id = String(id);
        activeId = id;
        var t = threads[id];
        if (!t) return;

        document.body.classList.add("in-chat");
        chatView.classList.add("chat-ready");
        listTitle.style.display = "none";
        chatPeer.style.display = "flex";

        peerName.textContent = t.name || "";
        peerRole.textContent = t.role === "factory"
          ? I18N.t("msg_role_factory")
          : I18N.t("msg_role_individual");

        peerAvatar.innerHTML = t.avatar
          ? '<img alt="" src="' + escapeHTML(t.avatar) + '">'
          : escapeHTML((t.name || "?").trim().charAt(0));

        renderThreadList();
        if (t.messagesLoaded) renderMessages();
        else renderMessageLoading();
        loadConversationMessages(id, false);
        msgInput.focus();
      }

      function closeChat() {
        loadToken++;
        activeId = null;
        document.body.classList.remove("in-chat");
        chatView.classList.remove("chat-ready");
        listTitle.style.display = "";
        chatPeer.style.display = "none";
        messagesArea.innerHTML = "";
        hideNote();
        renderThreadList();
      }

      /* ===== الإرسال ===== */
      function pushMessage(msg) {
        var t = threads[activeId];
        if (!t) return;

        t.messages = t.messages || [];
        var replaced = false;
        if (msg.id != null) {
          for (var i = 0; i < t.messages.length; i++) {
            if (String(t.messages[i].id) === String(msg.id)) {
              t.messages[i] = msg;
              replaced = true;
              break;
            }
          }
        }
        if (!replaced) t.messages.push(msg);
        t.messages.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
        t.messagesLoaded = true;
        t.lastMessage = msg;
        t.unread = 0;
        t.updated = msg.at;
        renderThreadList();
        renderMessages();
      }

      function sendText() {
        var text = msgInput.value.trim();
        if (!text || !activeId) return;

        var inputText = text;
        var finish = function () {
          msgInput.value = "";
          msgInput.style.height = "auto";
          updateSendState();
        };

        if (!window.SFMessages || !window.SF_USER || !/^\d+$/.test(String(activeId))) {
          showNote("تعذّر الاتصال بخدمة الرسائل. أعد تحميل الصفحة.", true);
          return;
        }

        sendBtn.disabled = true;
        SFMessages.sendText(Number(activeId), inputText).then(function (saved) {
          pushMessage({
            id: saved.id,
            from: "mine",
            type: "text",
            text: saved.body || inputText,
            at: new Date(saved.created_at).getTime()
          });
          finish();
        }).catch(function (err) {
          showNote((err && err.message) || "تعذّر إرسال الرسالة.", true);
          updateSendState();
        });
      }

      function updateSendState() {
        sendBtn.disabled = !msgInput.value.trim();
      }

      /* الصور والمقاطع تُرفع إلى الحاوية الخاصة ثم تُسجّل كرسالة. */
      function handleImageFile(input) {
        var file = input.files && input.files[0];
        if (!file || !activeId) { input.value = ""; return; }

        if (!/^image\//.test(file.type || "") || file.size > 10 * 1024 * 1024) {
          showNote(I18N.t("msg_too_large"), true);
          input.value = "";
          return;
        }

        showNote(I18N.t("msg_uploading"), false);

        if (!window.SFMessages || !window.SF_USER || !/^\d+$/.test(String(activeId))) {
          showNote("تعذّر الاتصال بخدمة الرسائل. أعد تحميل الصفحة.", true);
          input.value = "";
          return;
        }

        SFMessages.sendAttachment(Number(activeId), file, "image").then(function (saved) {
          pushMessage({ id: saved.id, from: "mine", type: "image", src: saved.signed_url, at: new Date(saved.created_at).getTime() });
          hideNote();
        }).catch(function (err) { showNote((err && err.message) || "تعذّر رفع الصورة.", true); });
        input.value = "";
      }

      function handleVideoFile(input) {
        var file = input.files && input.files[0];
        if (!file || !activeId) { input.value = ""; return; }

        if (!/^video\//.test(file.type || "") || file.size > 25 * 1024 * 1024) {
          showNote(I18N.t("msg_too_large"), true);
          input.value = "";
          return;
        }

        showNote(I18N.t("msg_uploading"), false);

        if (!window.SFMessages || !window.SF_USER || !/^\d+$/.test(String(activeId))) {
          showNote("تعذّر الاتصال بخدمة الرسائل. أعد تحميل الصفحة.", true);
          input.value = "";
          return;
        }

        SFMessages.sendAttachment(Number(activeId), file, "video").then(function (saved) {
          pushMessage({ id: saved.id, from: "mine", type: "video", src: saved.signed_url, at: new Date(saved.created_at).getTime() });
          hideNote();
        }).catch(function (err) { showNote((err && err.message) || "تعذّر رفع المقطع.", true); });
        input.value = "";
      }

      imageInput.addEventListener("change", function () { handleImageFile(imageInput); });
      imageCapture.addEventListener("change", function () { handleImageFile(imageCapture); });
      videoInput.addEventListener("change", function () { handleVideoFile(videoInput); });
      videoCapture.addEventListener("change", function () { handleVideoFile(videoCapture); });

      /* ===== ورقة اختيار المصدر ===== */
      var sourceOverlay = document.getElementById("source-overlay");
      var sourceCaptureBtn = document.getElementById("source-capture");
      var sourceGalleryBtn = document.getElementById("source-gallery");
      var sourceCancelBtn = document.getElementById("source-cancel");
      var sourceCaptureLabel = document.getElementById("source-capture-label");
      var sourceGalleryLabel = document.getElementById("source-gallery-label");

      var pendingKind = "image";

      function openSourceSheet(kind) {
        pendingKind = kind;

        sourceCaptureLabel.textContent = kind === "video"
          ? I18N.t("msg_record_video")
          : I18N.t("msg_take_photo");

        sourceGalleryLabel.textContent = kind === "video"
          ? I18N.t("msg_choose_video")
          : I18N.t("msg_from_gallery");

        sourceOverlay.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeSourceSheet() {
        sourceOverlay.classList.remove("open");
        document.body.style.overflow = "";
      }

      sourceCaptureBtn.addEventListener("click", function () {
        closeSourceSheet();
        (pendingKind === "video" ? videoCapture : imageCapture).click();
      });

      sourceGalleryBtn.addEventListener("click", function () {
        closeSourceSheet();
        (pendingKind === "video" ? videoInput : imageInput).click();
      });

      sourceCancelBtn.addEventListener("click", closeSourceSheet);
      sourceOverlay.addEventListener("click", closeSourceSheet);

      document.getElementById("image-btn").addEventListener("click", function () {
        openSourceSheet("image");
      });

      document.getElementById("video-btn").addEventListener("click", function () {
        openSourceSheet("video");
      });

      /* ===== الأحداث ===== */
      threadListEl.addEventListener("click", function (e) {
        var row = e.target.closest(".thread");
        if (row) openChat(row.getAttribute("data-id"));
      });

      backBtn.addEventListener("click", closeChat);

      sendBtn.addEventListener("click", sendText);

      msgInput.addEventListener("input", function () {
        updateSendState();
        /* نموّ تلقائي للحقل مع الأسطر */
        msgInput.style.height = "auto";
        msgInput.style.height = Math.min(msgInput.scrollHeight, 96) + "px";
      });

      msgInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendText();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        if (sourceOverlay.classList.contains("open")) closeSourceSheet();
        else if (pickOverlay.classList.contains("open")) closePicker();
        else if (activeId) closeChat();
      });

      /* ===== اختيار مصنع لبدء محادثة ===== */
      var pickOverlay = document.getElementById("pick-overlay");
      var pickModal = document.getElementById("pick-modal");
      var pickList = document.getElementById("pick-list");
      var pickSearch = document.getElementById("pick-search-input");
      var newChatBtn = document.getElementById("new-chat-btn");
      var newChatInline = document.getElementById("new-chat-inline");
      var pickClose = document.getElementById("pick-close");

      var factoryChoices = [];

      function renderPickList(filter) {
        filter = (filter || "").trim().toLowerCase();

        var html = "";
        for (var i = 0; i < factoryChoices.length; i++) {
          var f = factoryChoices[i];
          var label = f.name || (I18N.t("msg_role_factory") + " " + f.id);
          if (filter && label.toLowerCase().indexOf(filter) === -1) continue;

          html +=
            '<button type="button" class="pick-item" data-fid="' + escapeHTML(f.id) + '">' +
              '<span class="thread-avatar" style="width:32px;height:32px;font-size:13px;">' +
                (f.logo ? '<img alt="" src="' + escapeHTML(f.logo) + '">' : escapeHTML(label.charAt(0))) +
              '</span>' +
              '<span>' + escapeHTML(label) + '</span>' +
            '</button>';
        }

        pickList.innerHTML = html || '<div style="padding:16px;text-align:center;color:#6b756e;">لا توجد مصانع مطابقة</div>';
      }

      function openPicker() {
        if (myRole === "factory") {
          showNote("حساب المصنع يستقبل محادثات العملاء من هذه الصفحة.", true);
          return;
        }

        pickList.innerHTML = '<div style="padding:16px;text-align:center;color:#6b756e;">جارٍ تحميل المصانع…</div>';
        pickSearch.value = "";
        pickOverlay.classList.add("open");
        document.body.style.overflow = "hidden";

        SFMessages.listFactories().then(function (rows) {
          factoryChoices = rows;
          renderPickList("");
        }).catch(function (err) {
          pickList.innerHTML = '<div style="padding:16px;text-align:center;color:#a12727;">' +
            escapeHTML((err && err.message) || "تعذّر تحميل المصانع") + '</div>';
        });
      }

      function closePicker() {
        pickOverlay.classList.remove("open");
        document.body.style.overflow = "";
      }

      function startChatWith(fid) {
        closePicker();
        showNote(I18N.t("msg_loading"), false);
        SFMessages.ensureFactoryConversation(fid).then(function (thread) {
          threads[String(thread.id)] = thread;
          renderThreadList();
          openChat(String(thread.id));
          hideNote();
        }).catch(function (err) {
          showNote((err && err.message) || "تعذّر فتح المحادثة.", true);
        });
      }

      newChatBtn.addEventListener("click", openPicker);
      newChatInline.addEventListener("click", openPicker);
      pickClose.addEventListener("click", closePicker);
      pickOverlay.addEventListener("click", closePicker);

      pickSearch.addEventListener("input", function () {
        renderPickList(pickSearch.value);
      });

      pickList.addEventListener("click", function (e) {
        var item = e.target.closest(".pick-item");
        if (item) startChatWith(item.getAttribute("data-fid"));
      });

      /* فتح محادثة مباشرة عبر ?factory=<id> القادم من صفحة المصنع */
      function openFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var shouldAutoSend = params.get("send") === "1";

        function applyDraft() {
          var draft = params.get("draft");
          if (!draft) return;
          msgInput.value = draft;
          msgInput.style.height = "auto";
          msgInput.style.height = msgInput.scrollHeight + "px";
          updateSendState();
          msgInput.focus();

          if (shouldAutoSend) {
            shouldAutoSend = false;
            /* إزالة الأمر من العنوان تمنع تكرار الطلب إن أُعيد تحميل الصفحة. */
            params.delete("send");
            params.delete("draft");
            var query = params.toString();
            window.history.replaceState(null, "", window.location.pathname + (query ? "?" + query : ""));
            window.setTimeout(sendText, 0);
          }
        }

        function openFactory(factoryId) {
          var found = null;
          Object.keys(threads).forEach(function (key) {
            if (!found && Number(threads[key].factory_id) === Number(factoryId)) found = key;
          });

          if (found) {
            openChat(found);
            applyDraft();
            return;
          }

          showNote(I18N.t("msg_loading"), false);
          SFMessages.ensureFactoryConversation(factoryId).then(function (thread) {
            var key = String(thread.id);
            threads[key] = thread;
            renderThreadList();
            openChat(key);
            applyDraft();
            hideNote();
          }).catch(function (err) {
            showNote((err && err.message) || "تعذّر فتح المحادثة.", true);
          });
        }

        /* ?open=<threadId> يأتي من لوحة المصنع. ندعم أيضًا روابط
           factory-<id> القديمة بتحويلها إلى محادثة خادمية. */
        var openId = params.get("open");
        if (openId) {
          if (threads[openId]) {
            openChat(openId);
            applyDraft();
            return;
          }

          var m = String(openId).match(/^factory-(\d+)$/);
          if (m) {
            openFactory(Number(m[1]));
            return;
          }
        }

        var fid = params.get("factory");
        if (fid !== null) openFactory(fid);
      }

      function mergeRemoteThreads(fresh) {
        Object.keys(fresh || {}).forEach(function (id) {
          var previous = threads[id];
          if (previous && previous.messagesLoaded) {
            fresh[id].messages = previous.messages || [];
            fresh[id].messagesLoaded = true;
          }
        });
        threads = fresh || {};
      }

      function scheduleRealtimeRefresh(change) {
        window.clearTimeout(refreshTimer);
        refreshTimer = window.setTimeout(function () {
          var changed = (change && (change.new || change.old)) || {};
          var changedId = changed.conversation_id == null ? "" : String(changed.conversation_id);

          SFMessages.load().then(function (fresh) {
            mergeRemoteThreads(fresh);
            renderThreadList();
            if (activeId && threads[activeId] && (!changedId || changedId === activeId)) {
              loadConversationMessages(activeId, true);
            }
          }).catch(function (err) {
            console.warn("messages refresh:", err && err.message);
          });
        }, 90);
      }

      function bootstrapMessages() {
        if (!window.SFMessages || !window.SF_USER) {
          renderThreadList();
          showNote("يجب تسجيل الدخول لاستخدام الرسائل.", true);
          return;
        }

        myRole = window.SF_PROFILE && SF_PROFILE.account_type === "factory"
          ? "factory"
          : "individual";

        if (myRole === "factory") {
          newChatBtn.style.display = "none";
          newChatInline.style.display = "none";
        }

        renderThreadSkeletons();
        SFMessages.load().then(function (remoteThreads) {
          mergeRemoteThreads(remoteThreads);
          renderThreadList();
          hideNote();
          openFromQuery();

          messageChannel = SFMessages.subscribe(scheduleRealtimeRefresh);
        }).catch(function (err) {
          console.warn("messages load:", err && err.message);
          renderThreadList();
          showNote((err && err.message) || "تعذّر تحميل الرسائل.", true);
        });
      }

      window.addEventListener("beforeunload", function () {
        window.clearTimeout(refreshTimer);
        if (messageChannel && window.sb) sb.removeChannel(messageChannel);
      });

      if (window.SF_AUTH_READY) SF_AUTH_READY.then(bootstrapMessages);
      else bootstrapMessages();
    })();
  </script>

</body>
</html>
