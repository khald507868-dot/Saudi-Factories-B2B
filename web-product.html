<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | تفاصيل المنتج
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.

     تفتحها بطاقات "الأكثر مبيعاً" في الرئيسية عبر
     ‎web-product.html?factory=<رقم>&p=<فهرس المنتج>‎
     وكانت قبلها تقود إلى web-factory.html أي متجر المصنع
     كلّه، فيضيع المنتج الذي اختاره الزائر.

     البيانات من sf_factories في localStorage مثل بقية
     الموقع — لا استدعاء لقاعدة البيانات بعد.
     مقابلها في التطبيق: لا يوجد بعد.
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title data-i18n="product_page_title">تفاصيل المنتج - المصانع السعودية</title>
<script src="currency.js"></script>
<script src="translate.js"></script>
<script src="reviews-service.js"></script>
<script src="i18n.js"></script>
<script src="currency-ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>var SF_PUBLIC_PAGE = true;</script>
<script src="auth-guard.js"></script>
<script src="messages-badge.js"></script>
<script src="regions-geo.js"></script>
<script src="geo-location.js"></script>
<script src="top-bar.js"></script>
<script src="lang-switch.js"></script>
<script src="commerce-service.js"></script>
<script src="favorites-service.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== الرأس ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 18px 16px;
    background: #ffffff;
    border-bottom: none;
  }

  .page-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #04361b;
  }

  .back-btn {
    position: absolute;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #dfe3e0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  html[dir="ltr"] .back-btn { right: auto; left: 16px; }
  html[dir="ltr"] .back-btn svg { transform: scaleX(-1); }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #04361b;
    fill: none;
    stroke-width: 2.2;
  }

  .content-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 0 20px;
  }

  /* ===== صورة المنتج ===== */
  .product-hero {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* زوايا وظلّ مطابقان لـ.card تحتها وبجانبها.
       ولا هامش أفقيّ هنا: حاوية الصفحة توفّره أصلاً،
       فإضافته جعلت الصورة أوسع من البطاقة تحتها فلم
       تتحاذيا حوافّهما. */
    border-radius: 14px 14px 0 0;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.06);
  }

  /* الصورة وبطاقة المورّد قطعة واحدة: تُربّع الحوافّ
     المتلاقية وتُلغى الفجوة بينهما، فيبقى التدوير على
     الأطراف الخارجية وحدها. */
  .supplier-card {
    margin-top: 0 !important;
    border-radius: 0 0 14px 14px;
    border-top: 1px solid #eef2ef;
  }

  .product-hero img {
    width: 100%;
    height: 100%;
    /* contain لا cover: صور الملابس أطول من عرضها،
       وcover كان يقصّ الرأس والقدمين في إطار مربّع. */
    object-fit: contain;
    background: #ffffff;
  }

  .product-hero svg {
    width: 54px;
    height: 54px;
    stroke: #b6c0ba;
    fill: none;
    stroke-width: 1.4;
  }

  /* ===== البطاقات ===== */
  .card {
    background: #ffffff;
    border-radius: 14px;
    margin: 14px 14px 0;
    padding: 16px 14px;
    box-shadow: 0 2px 10px rgba(4, 54, 27, 0.06);
  }

  /* ===== هيكل التحميل =====
     يُعرض ريثما يردّ الخادم حين لا تحمل
     النسخة المحلّية المنتج، بدل عرض اسم المصنع
     و«السعر عند الطلب» ثمّ انقلابهما. */
  .sk-line {
    background: #eef2ef;
    border-radius: 6px;
    /* العنصر فارغ فلا ارتفاع له من نصّه. */
    height: 1em;
    animation: sk-pulse 1.4s ease-in-out infinite;
  }

  .sk-name { width: 62%; }
  .sk-price { width: 34%; }

  @keyframes sk-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  /* من طلب تقليل الحركة يرى رماديّاً ثابتاً. */
  @media (prefers-reduced-motion: reduce) {
    .sk-line { animation: none; }
  }

  .prod-name {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 10px;
  }

  /* [hidden] افتراض ضعيف يغلبه أيّ display صريح. */
  .prod-price[hidden] { display: none !important; }

  .prod-price {
    font-size: 26px;
    font-weight: 800;
    color: #1f6b42;
    line-height: 1.2;
  }

  /* الرمز صورة تتبع حجم السعر — وكان 15px يحبسها
     تحت سعر حجمه أكبر من الضعف. */
  .prod-price .currency {
    margin-inline-start: 3px;
  }

  .prod-price.on-request {
    font-size: 17px;
    color: #5c6b62;
  }

  .prod-moq {
    font-size: 12.5px;
    color: #5c6b62;
    margin-top: 6px;
  }

  /* شارات التحقّق */
  /* ===== وصف المنتج ومواصفاته للمشتري ===== */
  /* ===== التقييمات والمراجعات =====
     النجوم مرسومة وسماً كبقيّة أيقونات المشروع،
     والجزئية تُقصّ بـclip-path بنسبة المتوسّط لا
     تُقرّب — فـ 4.3 تُرى 4.3 لا 4.5. */
  .rv-stars {
    display: inline-flex;
    gap: 2px;
    vertical-align: middle;
    /* النجوم لاتينية الترتيب دائماً: أوّلها الممتلئة
       فلا ينعكس ترتيبها في RTL. */
    direction: ltr;
  }

  .rv-star {
    position: relative;
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .rv-star svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .rv-star .rv-bg { fill: #e2e8e4; }
  .rv-star .rv-fg { fill: #f0a020; }

  /* ملخّص التقييم بجوار الاسم: المشتري يرى الدرجة
     قبل أن ينزل إلى قسم المراجعات. ويُخفى بلا
     تقييم: خمس نجوم فارغة تُقرأ أنّ المنتج سيء،
     والحقيقة أنّه جديد. */
  .prod-rate {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .prod-rate[hidden] { display: none !important; }

  .prod-rate-avg {
    font-size: 13px;
    font-weight: 800;
    color: #04361b;
  }

  .prod-rate-link {
    font-size: 12.5px;
    color: #5c6b62;
    background: none;
    border: 0;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
  }

  .prod-rate-link:hover { text-decoration: underline; color: #1f6b42; }

  /* توزيع النجوم: ٤٫٣ من اثني عشر أصدق من رقم
     وحده — ويكشف إن كان المتوسّط مبنيّاً على
     إجماع أم على طرفين متناقضين. */
  .rv-dist {
    display: flex;
    gap: 20px;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid #eef2ef;
    margin-bottom: 4px;
  }

  .rv-dist-avg {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .rv-dist-num {
    font-size: 30px;
    font-weight: 800;
    color: #04361b;
    line-height: 1;
  }

  .rv-dist-count {
    font-size: 11.5px;
    color: #6b7d70;
  }

  .rv-dist-bars {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .rv-dist-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: #6b7d70;
  }

  .rv-dist-star { width: 12px; flex-shrink: 0; }
  .rv-dist-n { width: 20px; flex-shrink: 0; text-align: end; }

  /* block لا الافتراضيّ: العنصر span والسطريّ لا يقبل
     height ولا يحتوي ابنه، فكان الشريط الأصفر بلا
     ارتفاع فلا يُرى — ويبدو المسار رماديّاً دائماً. */
  .rv-dist-track {
    display: block;
    flex: 1;
    height: 7px;
    background: #eef2ef;
    border-radius: 999px;
    overflow: hidden;
    min-width: 0;
  }

  .rv-dist-fill {
    display: block;
    height: 100%;
    background: #f0a020;
    border-radius: 999px;
  }

  .rv-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 13px;
    color: #5c6b62;
  }

  .rv-avg {
    font-weight: 800;
    color: #04361b;
    font-size: 15px;
  }

  .rv-list { margin-top: 4px; }

  .rv-item {
    padding: 13px 0;
    border-top: 1px solid #eef2ef;
  }

  .rv-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 6px;
  }

  .rv-ava {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #e8f3ec;
    color: #1f6b42;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .rv-ava img { width: 100%; height: 100%; object-fit: cover; }

  .rv-who { flex: 1; min-width: 0; }

  .rv-name {
    font-weight: 700;
    font-size: 13.5px;
    color: #12331d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rv-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: #6b7d70;
  }

  /* وسم المشتري المورّق: كلّ مراجعة هنا من مشترٍ
     فعلاً — القاعدة تمنع غيره، فالوسم صادق لا دعاية. */
  .rv-verified {
    color: #1f6b42;
    font-weight: 700;
  }

  .rv-body {
    font-size: 13.5px;
    line-height: 1.75;
    color: #22402e;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .rv-del {
    border: 0;
    background: none;
    color: #b3261e;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  .rv-del:hover { text-decoration: underline; }

  /* نموذج الكتابة */
  .rv-form {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eef2ef;
  }

  .rv-pick {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 9px;
  }

  .rv-pick-label {
    font-size: 13px;
    font-weight: 700;
    color: #12331d;
  }

  /* أزرار لا مجرّد أيقونات: تنال التركيز بـTab
     وتستجيب لـEnter بلا عمل إضافيّ. */
  .rv-pick-btns {
    display: inline-flex;
    gap: 3px;
    direction: ltr;
  }

  .rv-pick-btn {
    border: 0;
    background: none;
    padding: 2px;
    cursor: pointer;
    line-height: 0;
    border-radius: 4px;
  }

  .rv-pick-btn svg { width: 22px; height: 22px; fill: #e2e8e4; }
  .rv-pick-btn.on svg { fill: #f0a020; }
  .rv-pick-btn:focus-visible { outline: 2px solid #1f6b42; outline-offset: 1px; }

  .rv-input {
    width: 100%;
    box-sizing: border-box;
    min-height: 74px;
    padding: 10px 12px;
    border: 1px solid #dbe4de;
    border-radius: 10px;
    font-family: inherit;
    font-size: 16px;
    resize: vertical;
  }

  .rv-send {
    margin-top: 9px;
    padding: 10px 20px;
    border: 0;
    border-radius: 999px;
    background: #04361b;
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .rv-send:disabled { opacity: .5; cursor: default; }

  .rv-note {
    margin-top: 9px;
    font-size: 12.5px;
    color: #5c6b62;
    line-height: 1.6;
  }

  .rv-more {
    margin-top: 10px;
    border: 0;
    background: none;
    color: #1f6b42;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }

  .rv-more:hover { text-decoration: underline; }

  .prod-desc {
    font-size: 14px;
    line-height: 1.9;
    color: #46584c;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .spec-table { width: 100%; border-collapse: collapse; }
  .spec-table tr { border-bottom: 1px solid #f0f3f1; }
  .spec-table tr:last-child { border-bottom: none; }
  .spec-table th,
  .spec-table td {
    text-align: start;
    padding: 9px 2px;
    font-size: 13.5px;
    vertical-align: top;
  }
  .spec-table th {
    color: #6b7d70;
    font-weight: 600;
    width: 40%;
    white-space: nowrap;
  }
  .spec-table td { color: #04361b; font-weight: 600; word-break: break-word; }

  .prod-badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #eef1ee;
    font-size: 12.5px;
    color: #5c6b62;
  }

  .prod-verified {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 700;
    color: #1f6b42;
  }

  .prod-verified svg {
    width: 14px;
    height: 14px;
    stroke: #1f6b42;
    fill: none;
    stroke-width: 2.6;
  }

  /* ===== المورّد ===== */
  .card h2 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .supplier-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .supplier-logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #eef1ee;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .supplier-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .supplier-logo svg {
    width: 22px;
    height: 22px;
    stroke: #9aa8a0;
    fill: none;
    stroke-width: 1.8;
  }

  .supplier-name {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.5;
  }

  .supplier-link {
    display: inline-block;
    margin-top: 3px;
    font-size: 12.5px;
    font-weight: 700;
    color: #1f6b42;
    text-decoration: none;
  }

  .supplier-link:hover { text-decoration: underline; }

  /* ===== شرائح التسعير =====
     صفّ أفقيّ من الشرائح كما في علي بابا:
     السعر فوق والمدى تحته، والشريحة المطابقة
     للكمّية المختارة تُبرز بإطار. */
  /* [hidden] مجرّد افتراض ضعيف من المتصفّح
     يغلبه أيّ display صريح — فبلا هذا السطر
     يظهر الجدول الفارغ شريطاً مؤطّراً في كلّ
     منتج بلا شرائح. */
  .tier-table[hidden] { display: none !important; }

  .tier-table {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eef2ef;
  }

  /* خلية قابلة للنقر (بطلب المالك): تُلغى
     مظاهر الزرّ الافتراضية ويُضبط المحاذاة،
     ويبقى الشكل كما كان قبل أن يصير زرّاً. */
  /* شارة «وفّر ٪» على الشريحة الأرخص: رقمان
     مجرّدان لا يقولان للمشتري كم يربح من الكمّية
     الأكبر — وهو جوهر البيع بالجملة. */
  .tier-save {
    position: absolute;
    top: -9px;
    inset-inline-start: 10px;
    background: #1f6b42;
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* الإجمالي الحيّ فوق زرّ الشراء: يتغيّر مع
     الكمّية فلا يحسب المشتري بنفسه. */
  /* سطرا الطمأنة أسفل الأزرار. */
  .buy-assure {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 14px;
    padding-top: 13px;
    border-top: 1px solid #eef2ef;
  }

  .buy-assure-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #5c6b62;
  }

  .buy-assure-row svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    fill: none;
    stroke: #6b7d70;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* أيقونة الدرع خضراء: الحماية وعد لا تفصيل. */
  .buy-assure-row:first-child svg { stroke: #1f6b42; }

  /* ثقة المورّد: البطاقة كانت تحمل الاسم والرابط
     وحدهما، والبيانات موجودة في القاعدة. */
  .sup-facts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 13px;
    padding-top: 13px;
    border-top: 1px solid #eef2ef;
  }

  .sup-facts[hidden] { display: none !important; }

  .sup-fact {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: #46584c;
  }

  .sup-fact svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    fill: none;
    stroke: #6b7d70;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sup-fact.is-approved svg { stroke: #1f6b42; stroke-width: 2.2; }

  /* مصغّرات الصور: images[] قد يحمل أكثر من صورة
     والصفحة كانت تعرض الأولى وحدها. وتُخفى
     لصورة واحدة: صفّ من مصغّر واحد لا يفيد. */
  .prod-thumbs {
    display: flex;
    gap: 8px;
    padding: 0 18px 14px;
    background: #ffffff;
    overflow-x: auto;
  }

  .prod-thumbs[hidden] { display: none !important; }

  .prod-thumb {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    border: 1px solid #e4eae6;
    background: #ffffff;
    padding: 0;
    flex-shrink: 0;
    cursor: pointer;
    overflow: hidden;

    width: 100%;
    height: 100%;

  .prod-thumb.is-active { border: 2px solid #1f6b42; }

  .buy-total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    background: #f4faf6;
    border-radius: 10px;
    margin-bottom: 12px;

  .buy-total-label {
    font-size: 12.5px;
    color: #5c6b62;
  }

  .buy-total-value {
    font-size: 20px;
    font-weight: 800;
    color: #04361b;
    direction: ltr;
  }

  .buy-total[hidden] { display: none !important; }

  .tier-cell {
    position: relative;
    flex: 1 1 92px;
    min-width: 92px;
    padding: 9px 10px;
    border: 1px solid #e4eae6;
    border-radius: 10px;
    background: #ffffff;
    font-family: inherit;
    text-align: inherit;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }

  /* تغذية راجعة عند المرور والضغط فيُعلم المشتري
     أنّها تُنقر. */
  .tier-cell:hover { border-color: #9dc6ae; background: #fbfdfb; }
  .tier-cell:active { transform: scale(.985); }

  /* دليل التركيز لمن يتنقّل بـTab. */
  .tier-cell:focus-visible {
    outline: 2px solid #1f6b42;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tier-cell { transition: none; }
    .tier-cell:active { transform: none; }
  }

  /* الإبراز بالإطار والخلفية لا باللون وحده:
     من لا يميّز الألوان يرى الفرق كذلك. */
  .tier-cell.is-active {
    border-color: #1f6b42;
    background: #f2f8f4;
    box-shadow: 0 0 0 1px #1f6b42 inset;
  }

  .tier-cell-price {
    font-size: 15.5px;
    font-weight: 700;
    color: #04361b;
    white-space: nowrap;

  /* خلايا الشرائح صغيرة أصلاً، فيكفي الفاصل. */
  .tier-cell-price .currency {
    margin-inline-start: 3px;

    margin-top: 3px;
    font-size: 11.5px;
    color: #6d7d73;
    white-space: nowrap;

  /* ===== منتقي الكمّية ===== */
  .qty-picker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .qty-label {
    font-size: 14px;
    font-weight: 700;
    color: #04361b;
  }

  /* لا نظير لـdir=ltr هنا: الصفّ يتبع اتّجاه
     القراءة وحده وليس ترتيباً مختاراً، فـflex
     يعكسه تلقائياً مع dir. */
  .qty-ctrl {
    display: flex;
    align-items: center;
    border: 2px solid #c7dfce;
    border-radius: 999px;
    overflow: hidden;
    background: #ffffff;
  }

  .qty-btn {
    width: 38px;
    height: 38px;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    color: #1f6b42;

  .qty-btn:hover:not(:disabled) { background: #f0f4f1; }
  .qty-btn:disabled { color: #b6c0ba; cursor: default; }

  /* حقل لا نصّ: تُزال حدود المتصفّح وخلفيّته
     ليبقى شكل المنتقي كما هو، والإطار الخارجيّ
     وحده يؤطّر المجموعة. */
  .qty-value {
    width: 46px;
    min-width: 46px;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: center;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #04361b;
  }

  /* التركيز يظهر على الإطار الحاوي لا داخله،
     فلا يُحذف دليل التركيز عمّن يتنقّل بـTab. */
  .qty-value:focus { outline: none; }
  .qty-ctrl:focus-within { border-color: #1f6b42; }

  /* ===== أزرار التواصل ===== */
  .actions { margin: 14px 14px 0; }

  /* صفّ يجمع زر السلة وزر المفضّلة جنباً إلى جنب — القلب مربّع
     ثابت العرض والزر الأساسي يملأ ما بقي. */
  /* الأزرار تبقى عموداً واحداً بعرض كامل كما كانت — جُرّب
     صفّها أفقياً مع القلب فرفضه المالك: "قبل كانت مرتبة".
     فالقلب زر كامل العرض مثلها لا مربّع بجانبها. */
  .act-row { display: block; }

  .fav-btn {
    display: flex;
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: 2px solid #c7dfce;
    background: #ffffff;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    color: #1f6b42;
    margin-bottom: 10px;
  }
  .fav-btn svg { width: 19px; height: 19px; flex-shrink: 0; }
  .fav-btn svg path {
    fill: none; stroke: #8a9a8e; stroke-width: 1.8;
    transition: fill 0.15s, stroke 0.15s;
  }
  .fav-btn.on { border-color: #f0c4c4; background: #fdf4f4; color: #d13b3b; }
  .fav-btn.on svg path { fill: #d13b3b; stroke: #d13b3b; }
  .fav-btn:disabled { opacity: 0.5; cursor: default; }

  .act-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    border: 2px solid transparent;
    margin-bottom: 10px;
  }

  .act-btn.primary {
    background: #1f6b42;
    color: #ffffff;
  }

  .act-btn.primary:active { opacity: 0.88; }

  .act-btn.outline {
    background: #ffffff;
    color: #1f6b42;
    border-color: #1f6b42;
  }

  .act-btn.outline:active { background: #f0f4f1; }


/* شريط المشتريات السفليّ — يظهر بعد الإضافة للسلة.
   مركّز بـ translateX(-50%) لا بـ right/left: لا يحتاج نظيرًا لـ dir=ltr.
   والحشو السفليّ يحترم شريط الهاتف السفليّ (52px) والـ safe-area. */
.cart-toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(140%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: calc(100% - 28px);
  padding: 12px 18px;
  border-radius: 14px;
  background: #0f3d21;
  color: #ffffff;
  box-shadow: 0 6px 22px rgba(4, 54, 27, .28);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: transform .28s ease, opacity .28s ease;
}
.cart-toast.is-open {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.cart-toast-count { font-weight: 700; white-space: nowrap; }
.cart-toast-link {
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  white-space: nowrap;
  padding: 7px 15px;
  border-radius: 9px;
  background: rgba(255, 255, 255, .17);
}
.cart-toast-link:hover { background: rgba(255, 255, 255, .27); }
@media (prefers-reduced-motion: reduce) {
  .cart-toast { transition: none; }
}

<body class="store-page product-page">

  <header class="page-header">
    <h1 data-i18n="product_page_heading">تفاصيل المنتج</h1>
    <a href="index.html" class="back-btn" id="back-btn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </header>

  <div class="content-wrap" id="content-wrap"></div>

  <script>
    (function () {
      var wrap = document.getElementById("content-wrap");

      var params    = new URLSearchParams(window.location.search);
      var factoryId = params.get("factory") || "0";
      var productId = params.get("product") || params.get("product_id") || "";
      var prodIndex = parseInt(params.get("p") || "0", 10);
      if (isNaN(prodIndex) || prodIndex < 0) prodIndex = 0;

      /* الرجوع إلى الرئيسية — مصدر بطاقات الأكثر مبيعاً */
      document.getElementById("back-btn").href = "index.html";

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      var imageIcon =
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="3" width="18" height="18" rx="2"/>' +

        '<path d="M21 15l-5-5L5 21"/></svg>';

      var checkIcon =
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 6L9 17l-5-5"/></svg>';

      var factoryIcon =
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 21h18"/><path d="M4 21V10l5 3V10l5 3V10l5 3v8"/>' +

      /* ===== الرسمة الأولى =====
         من sf_factories في localStorage، ريثما يردّ الخادم.
         والتعليق هنا كان يقول إنّ المنتجات محلّية لم تُربط
         بالقاعدة — وقد بطل: هي تُقرأ من products، فالنسخة
         المحلّية غالباً فارغة، ولذلك جاء هيكل التحميل. */
      var factories = {};
      try {
        factories = JSON.parse(localStorage.getItem("sf_factories") || "{}") || {};
      } catch (e) {}

      var factory = factories[factoryId] || {};
      var products = factory.products || [];
      var product = products[prodIndex] || {};
      if (productId && product.id && String(product.id) !== String(productId)) product = {};

      /* لا استعارة لغلاف المصنع حين تغيب صورة
         المنتج: الغلاف مشهد عامّ للمنشأة فيظهر
         للمشتري كأنّه المنتج ويُضلّله، والأيقونة
         النائبة أصدق. وكان التعليل أنّ الرئيسية تعرض
         أوّل منتج للمصنع — وقد بطل حين صارت تقرأ
         منتجات حقيقية من القاعدة. */
      var image = product.image || "";
      var name  = product.name  || factory.name  || "";
      var price = product.price || "";

      /* هل تحمل النسخة المحلّية هذا المنتج فعلاً؟
         المنتجات صارت تُقرأ من القاعدة، فـlocalStorage
         غالباً فارغ منه. وحينئذٍ ترسم الصفحة اسم
         المصنع مكان اسم المنتج و«السعر عند الطلب»
         مكان السعر، ثمّ تنقلب حين يردّ الخادم — ومضة
         تُقرأ معلومةً خاطئة (رصدها المالك).

         فإن غاب المنتج محلّيّاً يُعرض هيكل تحميل،
         وإن حضر بقيت الرسمة المحلّية فهي نافعة حقّاً. */
      var hasLocalProduct = !!(product && (product.name || product.price));

      /* القيم التجميلية مشتقّة من رقم المصنع لتطابق البطاقة
         في الرئيسية بالضبط — نفس المعادلتين هناك. */
      var idNum   = parseInt(factoryId, 10);
      if (isNaN(idNum)) idNum = 0;

      var factoryName = factory.name || (I18N.t("msg_role_factory") + " " + factoryId);

      /* لا رسالة "غير موجود" هنا عمداً: بطاقات الرئيسية
         تُولَّد لألف مصنع سواء أدخل أصحابها بيانات أم لا،
         فرفض العرض كان يناقض البطاقة التي قادت إلى هنا.
         والصفحة تعرض ما توفّر، وتُخفي ما غاب. */

      /* ===== نصوص الرسائل الجاهزة =====
         الاستفسار يبقى مسودة للمراجعة، أمّا طلب عرض السعر فيُرسل
         تلقائيًا بعد إنشاء المحادثة. */
      var subject      = name || factoryName;
      var inquiryDraft = I18N.t("product_draft_inquiry") + " " + subject;
      var quoteDraft   = I18N.t("product_draft_quote") + " " + subject +
                         "\n" + I18N.t("product_draft_qty") + " ";

      function chatURL(draft, autoSend) {
        var url = "web-messages.html?factory=" + encodeURIComponent(factoryId);
        if (draft) url += "&draft=" + encodeURIComponent(draft);
        if (autoSend) url += "&send=1";
        return url;
      }

      /* نصّ السعر الأساسي يُحفظ ليُرجع إليه حين
         تخرج الكمّية من كلّ الشرائح. */
      var basePriceText = price;

      /* عبر I18N.money لا برمز مكتوب باليد، وإلّا بقي

      var priceBlock = price

      /* بطاقة الوصف: تُحذف كلياً إن كان فارغاً بدل أن تظهر

      function descCardHTML(pr) {
        var txt = (pr && pr.description) || "";
        if (!String(txt).trim()) return "";
        return '<div class="card" id="card-desc">' +

                 '<div class="prod-desc" data-sf-translate>' + escapeHTML(txt) + '</div>' +
               '</div>';
      }

      /* جدول المواصفات: كل صفّ يظهر إن كانت قيمته موجودة وحدها،
         فمصنع عبّأ الخامة وحدها يرى صفّاً واحداً لا جدولاً بفراغات. */
      function specsCardHTML(pr) {
        if (!pr) return "";
        var rows = [
          ["product_material", pr.material],
          ["product_sizes",    pr.sizes],
          ["product_colors",   pr.colors],
          ["product_moq",      pr.moq
            ? pr.moq + " " + I18N.t("product_unit") : ""]
        ].filter(function (r) { return String(r[1] || "").trim(); });

        if (!rows.length) return "";

        return '<div class="card" id="card-specs">' +
                 '<h2>' + escapeHTML(I18N.t("product_specs")) + '</h2>' +
                 '<table class="spec-table"><tbody>' +
                   rows.map(function (r) {
                     return '<tr><th>' + escapeHTML(I18N.t(r[0])) + '</th>' +

                   }).join("") +
                 '</tbody></table>' +
               '</div>';
      }

      /* اسم المعروض: اسم المنتج، وإلا اسم المصنع، وإلا

      var displayName = name || factoryName;

      /* اسم المصنع ليس اسم المنتج: عرضه مكانه
         حتّى يردّ الخادم يُوهِم الزائر. */
      var nameHTML = hasLocalProduct
        ? '<div class="prod-name" data-sf-translate>' +
          escapeHTML(displayName) + '</div>'
        : '<div class="prod-name sk-line sk-name"></div>';

      var SUPPLIER_HTML =
        '<div class="card supplier-card">' +

          '<div class="supplier-row">' +
            '<div class="supplier-logo">' +

          '<div class="sup-facts" id="sup-facts" hidden></div>' +

      wrap.innerHTML =
        /* عمودان مستقلّان: الصورة والمورّد في غلاف،

        '<div class="pd-media">' +
          '<div class="product-hero">' +
            (sfSafeHttpUrl(image) ? '<img alt="" src="' + escapeHTML(sfSafeHttpUrl(image)) + '">' : imageIcon) +
          '</div>' +
          /* بين الصورة وبطاقة المورّد، فيبقى العمود

          '<div class="prod-thumbs" id="prod-thumbs" hidden></div>' +
          SUPPLIER_HTML +
        '</div>' +

        '<div class="pd-info">' +

        '<div class="card">' +
          nameHTML +
          /* يُملأ من الخادم بعد الرسم، ويبقى مخفيّاً

          '<div class="prod-rate" id="prod-rate" hidden></div>' +

          (factory.status === "approved"
            ? '<div class="prod-badges">' +

            : '') +
        '</div>' +

        descCardHTML(product) +
        specsCardHTML(product) +
        /* التقييمات: تُملأ من الخادم بعد الرسم،

        '<div class="card" id="card-reviews" hidden>' +

        '</div>' +


        '<div class="actions">' +
          (product.id
            ? '<div class="qty-picker">' +
                '<span class="qty-label" data-i18n="prod_quantity">' +
                  escapeHTML(I18N.t("prod_quantity")) + '</span>' +
                '<div class="qty-ctrl">' +
                  '<button type="button" class="qty-btn" id="qty-minus" aria-label="-">&#8722;</button>' +
                  '<input type="text" class="qty-value" id="qty-value" ' +

                  '<button type="button" class="qty-btn" id="qty-plus" aria-label="+">+</button>' +
                '</div>' +
              '</div>' +
              /* الإجمالي بين الكمّية والأزرار: موضعه في مسار

              '<div class="buy-total" id="buy-total" hidden>' +
                '<span class="buy-total-label">' +
                  escapeHTML(I18N.t("prod_total")) + '</span>' +
                '<span class="buy-total-value"></span>' +
              '</div>' +
              '<div class="act-row">' +
                '<button type="button" class="act-btn primary add-cart-btn" data-product-id="' +
                  escapeHTML(product.id) + '">' + escapeHTML(I18N.t("product_add_to_cart")) + '</button>' +
                '<button type="button" class="fav-btn" id="fav-btn" data-product-id="' +
                  escapeHTML(product.id) + '" aria-label="' + escapeHTML(I18N.t("fav_add")) + '">' +
                  '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>' +
                  '<span class="fav-label">' + escapeHTML(I18N.t("fav_add")) + '</span>' +
                '</button>' +
              '</div>'
            : '') +
          '<a class="act-btn primary" href="' + escapeHTML(chatURL(inquiryDraft)) + '">' +
            escapeHTML(I18N.t("product_send_inquiry")) + '</a>' +
          '<a class="act-btn outline" href="' + escapeHTML(chatURL(quoteDraft, true)) + '">' +
            escapeHTML(I18N.t("product_request_quote")) + '</a>' +
          '<a class="act-btn outline" href="' + escapeHTML(chatURL("")) + '">' +
            escapeHTML(I18N.t("product_start_chat")) + '</a>' +
          /* طمأنة الشراء: المشتري الجديد يتردّد عند
             الزرّ، والحماية مذكورة في السلة فعلاً فلا دعوى
             جديدة هنا. */
          '<div class="buy-assure">' +
            '<div class="buy-assure-row">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M12 3l7 3v6c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V6z"></path>' +
              '</svg>' +
              '<span>' + escapeHTML(I18N.t("buy_protection")) + '</span>' +
            '</div>' +
            '<div class="buy-assure-row">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<circle cx="12" cy="12" r="9"></circle>' +
                '<path d="M12 7v5l3 2"></path>' +
              '</svg>' +
              '<span>' + escapeHTML(I18N.t("buy_reply_time")) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';

      /* ===== المفضّلة =====
         الحالة تُقرأ من الخادم بعد الرسم، والنقر يبدّلها تفاؤلياً.
         الصفحة عامة، فالزائر بلا حساب يُرسَل إلى التسجيل. */
      function buildFavButton(productId) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "fav-btn";
        b.id = "fav-btn";
        b.setAttribute("data-product-id", productId);
        b.setAttribute("aria-label", I18N.t("fav_add"));
        b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>' +
                      '<span class="fav-label">' + I18N.t("fav_add") + '</span>';
        wireFavorite(b);
        return b;
      }

      function setFavLabel(btn, isOn) {
        var lbl = btn.querySelector(".fav-label");
        if (lbl) lbl.textContent = I18N.t(isOn ? "fav_remove" : "fav_add");
      }

      function wireFavorite(favBtn) {
        if (!favBtn || !window.SFFavorites || favBtn.dataset.wired) return;
        favBtn.dataset.wired = "1";
        var pid = favBtn.getAttribute("data-product-id");

        if (window.SF_USER) {
          SFFavorites.loadIds().then(function (ids) {
            var isOn = ids.indexOf(Number(pid)) !== -1;
            favBtn.classList.toggle("on", isOn);
            setFavLabel(favBtn, isOn);
          }).catch(function () { /* تبقى فارغة */ });
        }

        favBtn.addEventListener("click", function () {
          if (typeof sfRequireLogin === "function" && !sfRequireLogin("web-favorites.html")) return;
          var on = favBtn.classList.contains("on");
          favBtn.classList.toggle("on", !on);
          favBtn.disabled = true;
          SFFavorites.toggle(pid, on).then(function (nowFav) {
            favBtn.classList.toggle("on", nowFav);
            setFavLabel(favBtn, nowFav);
          }).catch(function (err) {
            favBtn.classList.toggle("on", on);
            alert(err && err.message ? err.message : String(err));
          }).then(function () {
            favBtn.disabled = false;
          });
        });
      }

      wireFavorite(document.getElementById("fav-btn"));

      /* شريط سفليّ يظهر بعد الإضافة: يعدّ ما في السلة ويفتحها.
         مركّز أفقيًا لا ملصقًا بحافة، فيستقيم في اتجاهي القراءة معًا. */
      var cartBar = null;
      function showCartBar() {
        if (!cartBar) {
          cartBar = document.createElement("div");
          cartBar.className = "cart-toast";
          cartBar.innerHTML =
            '<span class="cart-toast-count"></span>' +
            '<a class="cart-toast-link" href="web-cart.html"></a>';
          document.body.appendChild(cartBar);
        }
        cartBar.querySelector(".cart-toast-link").textContent = I18N.t("cart_view_cart");
        var countEl = cartBar.querySelector(".cart-toast-count");
        countEl.textContent = I18N.t("product_added_to_cart");
        cartBar.classList.add("is-open");
        if (window.SFCommerce && window.SFCommerce.loadCart) {
          SFCommerce.loadCart().then(function (items) {
            var n = 0;
            (items || []).forEach(function (it) { n += Number(it.quantity || 0); });
            if (n > 0) countEl.textContent = n + " " + I18N.t("cart_items_count");
          }).catch(function () {});
        }
      }

      /* الكمّية تُقرأ عند النقر لا عند البناء:
         المشتري يغيّرها بعد رسم الصفحة، وقراءتها مرّة
         واحدة ترسل 1 دائماً. والحدّ الأعلى 100000
         هو نفسه حدّ الخادم في add_to_cart. */
      /* بناء المنتقي عنصراً عنصراً — يستعمله المسار
         البديل حين يصل صفّ الخادم بعد أوّل رسم. */
      /* الشرائح الصالحة مرتّبة تصاعدياً.
         والتصفية هنا للعرض فقط — الخادم يصفّي مرّة
         أخرى عند الحفظ وعند حساب الطلب، فلا يُعتمد
         على هذه في المال. */
      function validTiers(list) {
        if (!Array.isArray(list)) return [];
        return list.filter(function (t) {
          if (!t) return false;
          var lo = parseInt(t.min, 10);
          var pr = parseFloat(t.price);
          if (isNaN(lo) || lo < 1) return false;
          if (isNaN(pr) || pr <= 0) return false;
          if (t.max != null && String(t.max) !== "") {
            var hi = parseInt(t.max, 10);
            if (isNaN(hi) || hi < lo) return false;
          }
          return true;
        }).sort(function (a, b) {
          return parseInt(a.min, 10) - parseInt(b.min, 10);
        });
      }

      /* أعلى شريحة يشملها العدد — نفس منطق
         tier_unit_price في القاعدة، واختلافهما يُري
         المشتري سعراً غير الذي يُحاسَب عليه. */
      function activeTierIndex(list, qty) {
        var found = -1;
        list.forEach(function (t, i) {
          var lo = parseInt(t.min, 10);
          var hasHi = t.max != null && String(t.max) !== "";
          var hi = hasHi ? parseInt(t.max, 10) : Infinity;
          if (qty >= lo && qty <= hi) found = i;
        });
        return found;
      }

      function tierRangeText(t) {
        var lo = parseInt(t.min, 10);
        var hasHi = t.max != null && String(t.max) !== "";
        var piece = I18N.t("tier_piece");
        if (!hasHi) return lo + "+ " + piece;
        return lo + "-" + parseInt(t.max, 10) + " " + piece;
      }

      /* السعر المعروض في الرأس. null يعيد الأساسي —
         وهو ما يقع حين لا تشمل أيّ شريحة الكمّية. */
      function showTierPrice(value) {
        var el = wrap.querySelector(".prod-price");
        if (!el || el.classList.contains("on-request")) return;

        /* مع شريحة مطابقة يُخفى الرقم الكبير (بطلب
           المالك): الشريحة المُبرزة تقول السعر نفسه،
           فتكراره حشو. ويعود متى غابت الشرائح أو
           خرجت الكمّية عنها — وإلّا ظهرت البطاقة بلا
           أيّ سعر، وأكثر المنتجات اليوم بلا شرائح. */
        el.hidden = (value != null);
        if (value != null) return;

        /* بلا سعر أساسي يُخفى أيضاً: عنصر فارغ
           يترك فجوة وحداً بلا محتوى. */
        var shown = basePriceText;
        if (shown === "") { el.hidden = true; return; }

        /* innerHTML لا textContent: الرمز ترميز، وmoney
           تتولّى التحويل والتنقية معاً. */
        el.innerHTML = I18N.money(shown);
      }

      /* يُعاد رسمه عند كلّ تغيير كمّية ليتتبّع
         الإبراز الشريحة المطبّقة فعلاً. */
      function renderTiers() {
        var host = document.getElementById("tier-table");
        if (!host) return;
        var list = validTiers(product.tiers);
        host.innerHTML = "";
        /* منتج بلا شرائح يبقى له إجماليّ من السعر
           الأساسيّ، فالخروج قبل رسمه يحرمه منه. */
        if (!list.length) {
          host.hidden = true;
          paintBuyTotal(null);
          return;
        }
        host.hidden = false;

        /* أرخص سعر وأغلاه لحساب نسبة التوفير: تُقاس
           من أعلى سعر لا من المجاور، فهي ما يوفّره
           المشتري فعلاً مقارنةً بأقلّ كمّية. */
        var prices = list.map(function (t) { return parseFloat(t.price); })
          .filter(function (v) { return isFinite(v) && v > 0; });
        var hiPrice = prices.length ? Math.max.apply(null, prices) : 0;
        var loPrice = prices.length ? Math.min.apply(null, prices) : 0;

        var active = activeTierIndex(list, readQty());
        /* السعر الكبير يتبع الشريحة: إبقاؤه على الأساسي
           يضع رقمين متناقضين في بطاقة واحدة. */
        showTierPrice(active >= 0 ? list[active].price : null);
        list.forEach(function (t, i) {
          /* button لا div: ينال التركيز بـTab ويستجيب
             لـEnter والمسافة بلا عمل إضافيّ، ويقرأه قارئ
             الشاشة زرّاً لا نصّاً. */
          var cell = document.createElement("button");
          cell.type = "button";
          cell.className = "tier-cell" + (i === active ? " is-active" : "");
          cell.setAttribute("aria-pressed", i === active ? "true" : "false");

          /* النقر ينقل الكمّية إلى أدنى حدّ الشريحة،
             إلّا إن كانت الكمّية داخلها أصلاً فتُترك —
             وإلّا أنقصت طلب من كتب 150 ثمّ نقر شريحته. */
          cell.addEventListener("click", function () {
            var lo = parseInt(t.min, 10);
            if (isNaN(lo) || lo < 1) return;
            var hasHi = t.max != null && String(t.max) !== "";
            var hi = hasHi ? parseInt(t.max, 10) : Infinity;
            var now = readQty();
            if (now >= lo && now <= hi) return;

            var box = document.getElementById("qty-value");
            if (!box) return;
            box.value = String(lo);
            var minusBtn = document.getElementById("qty-minus");
            if (minusBtn) minusBtn.disabled = (lo <= 1);
            renderTiers();
          });

          var pr = document.createElement("div");
          pr.className = "tier-cell-price";
          /* سعر الشريحة يُحوّل كبقيّة الأسعار. */
          pr.innerHTML = I18N.money(parseFloat(t.price).toFixed(2));
          cell.appendChild(pr);

          var rg = document.createElement("div");
          rg.className = "tier-cell-range";
          rg.textContent = tierRangeText(t);
          cell.appendChild(rg);

          /* الشارة للأرخص وحدها، ومن عتبة ٥٪ فما فوق:
             وضعها على فرق تافه يفقدها معناها، ووضعها
             على كلّ شريحة يزحم البطاقة. */
          var pv = parseFloat(t.price);
          if (hiPrice > 0 && isFinite(pv) && pv === loPrice && pv < hiPrice) {
            var pct = Math.round((1 - (pv / hiPrice)) * 100);
            if (pct >= 5) {
              var save = document.createElement("span");
              save.className = "tier-save";
              save.textContent = I18N.t("tier_save_pct") + " " + pct + "%";
              cell.appendChild(save);
            }
          }

          host.appendChild(cell);
        });

        paintBuyTotal(active >= 0 ? list[active].price : null);
      }

      /* الإجمالي = سعر الوحدة × الكمّية. وسعر الوحدة
         من الشريحة المطبّقة، وإلّا فمن الأساسيّ.
         وبلا سعر يُخفى الصندوق: صفر لا يقول شيئاً. */
      function paintBuyTotal(unitPrice) {
        var box = document.getElementById("buy-total");
        if (!box) return;

        var unit = parseFloat(unitPrice);
        if (!isFinite(unit) || unit <= 0) unit = parseFloat(basePriceText);
        if (!isFinite(unit) || unit <= 0) { box.hidden = true; return; }

        var val = box.querySelector(".buy-total-value");
        if (!val) { box.hidden = true; return; }
        box.hidden = false;

        /* التقريب قبل الضرب لا بعده (رصده المالك):
           كان الإجمالي يُضرب بالريال ثمّ يُحوّل، وخليّة
           الشريحة تُحوّل ثمّ تُقرّب — فاختلفا.
           منها رأى المشتري 1.87 × 100 = 186.69 لا 187.00.

           والأوّل أدقّ حساباً، لكنّ المشتري يضرب
           الرقم المعروض لا الخفي، فيقرأ الفرق خطأً.
           والمتاجر تقرّب الوحدة أوّلاً، فالمعروض هو
           المحاسب عليه.

           وهذا في العرض وحده: الطلب يحسبه الخادم
           بالريال في create_order_from_cart ولا يقبل مبلغاً
           من المتصفّح. */
        var qty = readQty();
        var cur = window.SFCurrency;

        if (cur && cur.isForeign()) {
          var dec = cur.info(cur.getCode()).dec;
          /* سعر الوحدة محوّلاً ومقرّباً — عين ما تعرضه
             خليّة الشريحة، فالضرب فيه يطابق حساب المشتري. */
          var shownUnit = Number(cur.convert(unit).toFixed(dec));
          val.innerHTML = cur.formatNumber(shownUnit * qty) +
            ' <span class="cur-sym">' + escapeHTML(cur.info(cur.getCode()).sym) +
            '</span>';
          return;
        }

        val.innerHTML = I18N.money((unit * qty).toFixed(2));
      }

      /* يُبنى بـDOM لا بسلسلة نصّية، ليُنادى من
         المسارين: رسمة الخادم الأولى، وإعادة البناء
         حين يصل معرّف المنتج متأخّراً. */
      function buildBuyTotal() {
        var box = document.createElement("div");
        box.className = "buy-total";
        box.id = "buy-total";
        box.hidden = true;

        var lbl = document.createElement("span");
        lbl.className = "buy-total-label";
        lbl.textContent = I18N.t("prod_total");
        box.appendChild(lbl);

        var val = document.createElement("span");
        val.className = "buy-total-value";
        box.appendChild(val);

        return box;
      }

      function buildQtyPicker() {
        var box = document.createElement("div");
        box.className = "qty-picker";

        var lbl = document.createElement("span");
        lbl.className = "qty-label";
        lbl.setAttribute("data-i18n", "prod_quantity");
        lbl.textContent = I18N.t("prod_quantity");
        box.appendChild(lbl);

        var ctrl = document.createElement("div");
        ctrl.className = "qty-ctrl";

        var minus = document.createElement("button");
        minus.type = "button";
        minus.className = "qty-btn";
        minus.id = "qty-minus";
        minus.setAttribute("aria-label", "-");
        minus.textContent = "−";
        ctrl.appendChild(minus);

        var val = document.createElement("input");
        val.type = "text";
        val.className = "qty-value";
        val.id = "qty-value";
        val.inputMode = "numeric";
        val.maxLength = 6;
        val.value = "1";
        val.setAttribute("aria-label", I18N.t("prod_quantity"));
        ctrl.appendChild(val);

        var plus = document.createElement("button");
        plus.type = "button";
        plus.className = "qty-btn";
        plus.id = "qty-plus";
        plus.setAttribute("aria-label", "+");
        plus.textContent = "+";
        ctrl.appendChild(plus);

        box.appendChild(ctrl);
        return box;
      }

      function readQty() {
        var el = document.getElementById("qty-value");
        /* value لا textContent: صار حقل إدخال. */
        var n = el ? parseInt(el.value, 10) : 1;
        if (isNaN(n) || n < 1) n = 1;
        if (n > 100000) n = 100000;
        return n;
      }

      function bindQtyPicker() {
        var minus = document.getElementById("qty-minus");
        var plus  = document.getElementById("qty-plus");
        var val   = document.getElementById("qty-value");
        if (!minus || !plus || !val) return;

        function apply(n) {
          if (n < 1) n = 1;
          if (n > 100000) n = 100000;
          val.value = String(n);
          minus.disabled = (n <= 1);
          renderTiers();
        }
        function step(by) { apply(readQty() + by); }

        minus.addEventListener("click", function () { step(-1); });
        plus.addEventListener("click", function () { step(1); });

        /* أثناء الكتابة: تُنقّى الأحرف غير الرقمية وتُحدّث
           الشرائح، لكنّ القيمة لا تُصحّح إلى 1 هنا: من يمسح
           الحقل ليكتب 500 يمرّ بالفراغ، فإقحام 1 عليه لحظتها
           يجعل النتيجة 1500. والتصحيح عند ترك الحقل. */
        val.addEventListener("input", function () {
          var clean = val.value.replace(/[^0-9]/g, "");
          if (clean !== val.value) val.value = clean;
          minus.disabled = (readQty() <= 1);
          renderTiers();
        });

        /* عند ترك الحقل: تُثبّت قيمة صالحة دائماً،
           فلا يُرسل حقل فارغ إلى السلة. */
        val.addEventListener("blur", function () { apply(readQty()); });

        /* Enter يُضيف مباشرة — وهو مقصد من يكتب عدده. */
        val.addEventListener("keydown", function (e) {
          if (e.key !== "Enter") return;
          e.preventDefault();
          apply(readQty());
          var cartBtn = wrap.querySelector(".add-cart-btn");
          if (cartBtn && !cartBtn.disabled) cartBtn.click();
        });

        minus.disabled = true;
      }
      bindQtyPicker();
      renderTiers();
      /* اسم المنتج ووصفه يكتبهما المصنع بلغة واحدة،
         فيُترجمان إلى لغة الزائر إن دعم متصفّحه ذلك. */
      if (window.SFTranslate) SFTranslate.translateAll(wrap);

      /* مصغّرات الصور: تُبنى من روابط Storage وحدها،
         وتُخفى لصورة واحدة. النقر يبدّل الصورة
         الكبيرة ولا يفتح نافذة: الأبسط يكفي هنا. */
      function paintThumbs(list) {
        var host = document.getElementById("prod-thumbs");
        if (!host) return;

        var urls = (list || [])
          .map(function (u) { return sfSafeHttpUrl(u); })
          .filter(function (u) { return !!u; });

        if (urls.length < 2) { host.hidden = true; host.innerHTML = ""; return; }
        host.hidden = false;

        var hero = wrap.querySelector(".product-hero");
        host.innerHTML = "";

        urls.forEach(function (u, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "prod-thumb" + (i === 0 ? " is-active" : "");
          b.setAttribute("aria-label", String(i + 1));
          b.innerHTML = '<img alt="" src="' + escapeHTML(u) + '">';

          b.addEventListener("click", function () {
            if (hero) hero.innerHTML = '<img alt="" src="' + escapeHTML(u) + '">';
            var all = host.querySelectorAll(".prod-thumb");
            for (var k = 0; k < all.length; k++) {
              all[k].classList.toggle("is-active", all[k] === b);
            }
          });

          host.appendChild(b);
        });
      }

      /* حقائق المورّد. الاعتماد وحده للمعتمد،
         والمدينة تُحذف إن لم تُسجّل — ولا يُخترع
         شيء. */
      function paintSupplierFacts(info) {
        var host = document.getElementById("sup-facts");
        if (!host || !info) return;

        var rows = "";

        if (info.approved) {
          rows += '<div class="sup-fact is-approved">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M4 12.5l5.2 5.2L20 7"></path>' +
            '</svg>' +
            '<span>' + escapeHTML(I18N.t("sup_approved")) + '</span>' +
          '</div>';
        }

        if (info.products > 0) {
          rows += '<div class="sup-fact">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<rect x="3" y="7" width="18" height="13" rx="2"></rect>' +
              '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
            '</svg>' +
            '<span>' + info.products + ' ' +
              escapeHTML(I18N.t("sup_products_count")) + '</span>' +
          '</div>';
        }

        if (info.city) {
          rows += '<div class="sup-fact">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>' +
              '<circle cx="12" cy="10" r="3"></circle>' +
            '</svg>' +
            '<span>' + escapeHTML(info.city) + '</span>' +
          '</div>';
        }

        if (!rows) { host.hidden = true; return; }
        host.hidden = false;
        host.innerHTML = rows;
      }

      /* ===== التقييمات والمراجعات ===== */
      var RV_PAGE = 10;
      var rvShown = 0;
      var rvPick = 0;

      var STAR_PATH = "M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z";

      /* نجمة واحدة: خلفية رمادية ومقدّمة ذهبية تُقصّ
         بنسبة الملء — فتظهر الجزئية صادقة لا مقرّبة. */
      function starHTML(fill) {
        var pct = Math.max(0, Math.min(1, Number(fill) || 0)) * 100;
        return '<span class="rv-star">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="rv-bg" d="' + STAR_PATH + '"></path></svg>' +
          '<svg viewBox="0 0 24 24" aria-hidden="true" style="clip-path:inset(0 ' +
            (100 - pct).toFixed(2) + '% 0 0)"><path class="rv-fg" d="' + STAR_PATH + '"></path></svg>' +
        '</span>';
      }

      function starsHTML(avg) {
        var v = Number(avg) || 0;
        var out = '';
        for (var i = 1; i <= 5; i++) {
          out += starHTML(Math.max(0, Math.min(1, v - (i - 1))));
        }
        return '<span class="rv-stars" role="img" aria-label="' +
          v.toFixed(1) + ' / 5">' + out + '</span>';
      }

      function rvDate(iso) {
        try {
          return new Date(iso).toLocaleDateString(I18N.getLang() === "ar" ? "ar" : undefined,
            { year: "numeric", month: "short", day: "numeric" });
        } catch (e) { return ""; }
      }

      function rvInitial(name) {
        var n = String(name || "").trim();
        return n ? n.charAt(0).toUpperCase() : "?";
      }

      /* ملخّص التقييم بجوار الاسم. النقر ينزل إلى
         بطاقة المراجعات بدل أن يبحث عنها. */
      function paintProdRate(avg, count) {
        var box = document.getElementById("prod-rate");
        if (!box) return;
        if (!count) { box.hidden = true; return; }
        box.hidden = false;

        var label = count === 1
          ? I18N.t("reviews_count_one")
          : count + " " + I18N.t("reviews_count_many");

        box.innerHTML = starsHTML(avg) +
          '<span class="prod-rate-avg">' + Number(avg).toFixed(1) + '</span>' +
          '<button type="button" class="prod-rate-link">(' +
            escapeHTML(label) + ')</button>';

        var link = box.querySelector(".prod-rate-link");
        if (link) {
          link.addEventListener("click", function () {
            var card = document.getElementById("card-reviews");
            if (card && card.scrollIntoView) {
              card.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        }
      }

      /* توزيع النجوم. العرض نسبةٌ من أكثر درجة تكراراً
         لا من المجموع: القسمة على المجموع تجعل كلّ
         الأشرطة قصيرة حين تتوزّع المراجعات. */
      function paintDist(map, avg, count) {
        var host = document.getElementById("rv-dist");
        if (!host) return;
        if (!map || !count) { host.innerHTML = ""; return; }

        var peak = 0;
        for (var k = 1; k <= 5; k++) {
          if ((map[k] || 0) > peak) peak = map[k];
        }
        if (!peak) { host.innerHTML = ""; return; }

        var rows = "";
        for (var n = 5; n >= 1; n--) {
          var c = map[n] || 0;
          var pct = Math.round((c / peak) * 100);
          rows += '<div class="rv-dist-row">' +
            '<span class="rv-dist-star">' + n + '</span>' +
            '<span class="rv-dist-track">' +
              '<span class="rv-dist-fill" style="width: ' + pct + '%"></span>' +
            '</span>' +
            '<span class="rv-dist-n">' + c + '</span>' +
          '</div>';
        }

        var label = count === 1
          ? I18N.t("reviews_count_one")
          : count + " " + I18N.t("reviews_count_many");

        host.innerHTML = '<div class="rv-dist">' +
          '<div class="rv-dist-avg">' +
            '<span class="rv-dist-num">' + Number(avg).toFixed(1) + '</span>' +
            '<span class="rv-dist-count">' + escapeHTML(label) + '</span>' +
          '</div>' +
          '<div class="rv-dist-bars">' + rows + '</div>' +
        '</div>';
      }

      function paintSummary(avg, count) {
        var host = document.getElementById("rv-summary");
        if (!host) return;
        if (!count) {
          host.innerHTML = '<div class="rv-summary">' + starsHTML(0) +
            '<span>' + escapeHTML(I18N.t("reviews_none")) + '</span></div>';
          return;
        }
        var label = count === 1
          ? I18N.t("reviews_count_one")
          : count + " " + I18N.t("reviews_count_many");
        host.innerHTML = '<div class="rv-summary">' +
          '<span class="rv-avg">' + Number(avg).toFixed(1) + '</span>' +
          starsHTML(avg) +
          '<span>' + escapeHTML(label) + '</span>' +
        '</div>';
      }

      function reviewItemHTML(r) {
        var img = String(r.author_image || "");
        var ava = (img.indexOf("http") === 0)
          ? '<img alt="" src="' + escapeHTML(img) + '">'
          : escapeHTML(rvInitial(r.author_name));
        return '<div class="rv-item">' +
          '<div class="rv-head">' +
            '<div class="rv-ava">' + ava + '</div>' +
            '<div class="rv-who">' +
              '<div class="rv-name">' + escapeHTML(r.author_name || "") + '</div>' +
              '<div class="rv-meta">' +
                starsHTML(r.rating) +
                /* الوسم لمن اشترى فعلاً وحده: التقييم مفتوح
                   لكلّ مسجّل (بطلب المالك)، فإظهاره للجميع
                   يجعله ادّعاء بلا سند. والخادم يحسبه من
                   الطلبات لا من حقل يكتبه المقيّم. */
                (r.is_verified
                  ? '<span class="rv-verified">' +
                      escapeHTML(I18N.t("review_verified_buyer")) + '</span>'
                  : '') +
                '<span>' + escapeHTML(rvDate(r.created_at)) + '</span>' +
              '</div>' +
            '</div>' +
            (r.is_mine
              ? '<button type="button" class="rv-del" data-rv="' + escapeHTML(r.id) + '">' +
                  escapeHTML(I18N.t("review_delete")) + '</button>'
              : '') +
          '</div>' +
          /* نصّ المراجعة يُترجم كاسم المنتج ووصفه. */
          (String(r.body || "").trim()
            ? '<div class="rv-body" data-sf-translate>' + escapeHTML(r.body) + '</div>'
            : '') +
        '</div>';
      }

      function bindDeletes(host) {
        var btns = host.querySelectorAll(".rv-del");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function () {
            var id = this.getAttribute("data-rv");
            if (!confirm(I18N.t("review_delete_confirm"))) return;
            SFReviews.deleteReview(id).then(function (done) {
              if (done) { rvShown = 0; loadReviewsBlock(); }
            }).catch(function (err) {
              alert(err && err.message ? err.message : "");
            });
          });
        }
      }

      /* نموذج الكتابة لمن اشترى وحده: الخادم يرفض
         سواه ، وإظهار النموذج لمن لا يحقّ له يجعله
         يكتب ثمّ يُرفض — وهو أسوأ من ألّا يراه. */
      function paintForm(status) {
        var host = document.getElementById("rv-form-host");
        if (!host) return;

        if (!window.SF_USER) {
          host.innerHTML = '<div class="rv-note">' +
            escapeHTML(I18N.t("review_login_first")) + '</div>';
          return;
        }
        /* التقييم مفتوح لكلّ مسجّل (بطلب المالك)،
           فمن وصل هنا بلا صلاحية ينقصه الدخول لا الشراء. */
        if (!status.canReview) {
          host.innerHTML = '<div class="rv-note">' +
            escapeHTML(I18N.t("review_login_first")) + '</div>';
          return;
        }

        var title = status.hasReview ? I18N.t("review_edit") : I18N.t("review_write");
        var picks = '';
        for (var i = 1; i <= 5; i++) {
          picks += '<button type="button" class="rv-pick-btn" data-star="' + i +
            '" aria-label="' + i + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '"></path></svg>' +
          '</button>';
        }

        host.innerHTML = '<div class="rv-form">' +
          '<div class="rv-pick">' +
            '<span class="rv-pick-label">' + escapeHTML(title) + '</span>' +
            '<span class="rv-pick-btns" id="rv-pick">' + picks + '</span>' +
          '</div>' +
          '<textarea class="rv-input" id="rv-text" maxlength="2000" placeholder="' +
            escapeHTML(I18N.t("review_placeholder")) + '"></textarea>' +
          '<button type="button" class="rv-send" id="rv-send">' +
            escapeHTML(I18N.t("review_submit")) + '</button>' +
        '</div>';

        var picker = document.getElementById("rv-pick");
        function paintPick() {
          var all = picker.querySelectorAll(".rv-pick-btn");
          for (var k = 0; k < all.length; k++) {
            var n = parseInt(all[k].getAttribute("data-star"), 10);
            all[k].classList.toggle("on", n <= rvPick);
          }
        }
        picker.addEventListener("click", function (e) {
          var btn = e.target.closest ? e.target.closest(".rv-pick-btn") : null;
          if (!btn) return;
          rvPick = parseInt(btn.getAttribute("data-star"), 10) || 0;
          paintPick();
        });
        paintPick();

        var send = document.getElementById("rv-send");
        send.addEventListener("click", function () {
          if (!rvPick) { alert(I18N.t("review_pick_stars")); return; }
          var box = document.getElementById("rv-text");
          send.disabled = true;
          send.textContent = I18N.t("review_sending");
          SFReviews.submitReview(product.id, rvPick, box ? box.value : "")
            .then(function () {
              rvShown = 0;
              rvPick = 0;
              loadReviewsBlock();
            })
            .catch(function (err) {
              alert(err && err.message ? err.message : "");
              send.disabled = false;
              send.textContent = I18N.t("review_submit");
            });
        });
      }

      /* يُنادى بعد وصول معرّف المنتج من الخادم. */
      function loadReviewsBlock() {
        if (!product || !product.id || !window.SFReviews) return;
        var card = document.getElementById("card-reviews");
        var list = document.getElementById("rv-list");
        if (!card || !list) return;
        card.hidden = false;

        var want = rvShown + RV_PAGE;
        SFReviews.loadRatings([product.id]).then(function (map) {
          var m = map[String(product.id)] || { avg: 0, count: 0 };
          /* مع وجود تقييمات يحلّ التوزيع محلّ سطر
             الملخّص، فهو يحمل المتوسّط والعدد وزيادةً
             — فلا يُكرّران في بطاقة واحدة. */
          paintProdRate(m.avg, m.count);
          if (m.count) {
            var sumHost = document.getElementById("rv-summary");
            if (sumHost) sumHost.innerHTML = "";
            SFReviews.loadBreakdown(product.id).then(function (dist) {
              if (dist) paintDist(dist, m.avg, m.count);
              else paintSummary(m.avg, m.count);
            });
          } else {
            paintSummary(m.avg, m.count);
          }
          return SFReviews.loadReviews(product.id, want, 0).then(function (rows) {
            rvShown = rows.length;
            var html = rows.map(reviewItemHTML).join("");
            if (m.count > rows.length) {
              html += '<button type="button" class="rv-more" id="rv-more">' +
                escapeHTML(I18N.t("review_show_more")) + '</button>';
            }
            list.innerHTML = html;
            bindDeletes(list);
            var more = document.getElementById("rv-more");
            if (more) more.addEventListener("click", loadReviewsBlock);
            if (window.SFTranslate) SFTranslate.translateAll(list);
          });
        }).then(function () {
          if (!window.SF_USER) { paintForm({ canReview: false, hasReview: false }); return null; }
          return SFReviews.myStatus(product.id).then(paintForm);
        }).catch(function (err) {
          if (window.console) console.warn("reviews:", err && err.message);
        });
      }

      function bindCartButton() {
        var cartButton = wrap.querySelector(".add-cart-btn");
        if (!cartButton) return;
        cartButton.addEventListener("click", function () {
          if (typeof sfRequireLogin === "function" && !sfRequireLogin("web-cart.html")) return;
          if (!window.SFCommerce || !product.id) return;
          cartButton.disabled = true;
          SFCommerce.addToCart(product.id, readQty()).then(function () {
            cartButton.textContent = I18N.t("product_added_to_cart");
            /* لا نقل قسري للسلة (طلب المالك): يبقى المشتري ليواصل
               التسوّق، وشريط سفليّ يبيّن عدد المشتريات ويفتح السلة. */
            setTimeout(function () {
              cartButton.disabled = false;
              cartButton.textContent = I18N.t("product_add_to_cart");
            }, 1600);
            showCartBar();
          }).catch(function (err) {
            cartButton.disabled = false;
            cartButton.textContent = err && err.message ? err.message : I18N.t("fx_failed");
          });
        });
      }
      bindCartButton();

      /* الشارة تُرسم مرّتين: الصفحة تُبنى أوّلاً من
         النسخة المحلّية ولا status فيها، فلولا هذا لما
         ظهرت أبداً حتّى لمصنع معتمد. */
      function syncVerified() {
        var host = wrap.querySelector(".prod-badges");
        var ok = factory && factory.status === "approved";

        if (!ok) {
          if (host) host.parentNode.removeChild(host);
          return;
        }
        if (host) return;

        var moqEl = wrap.querySelector(".prod-name");
        if (!moqEl) return;
        var card = moqEl.parentNode;

        var box = document.createElement("div");
        box.className = "prod-badges";
        var span = document.createElement("span");
        span.className = "prod-verified";
        span.innerHTML = checkIcon;
        span.appendChild(document.createTextNode(I18N.t("product_verified")));
        box.appendChild(span);
        card.appendChild(box);
      }

      /* الخدمة قد تغيب (متصفّح قديم أو ملفّ لم يُحمّل)،
         وغيابها لا يجوز أن يُسقِط الصفحة. */
      function global_SFTranslate() {
        return typeof window.SFTranslate !== "undefined";
      }

      function applyLiveProduct(row) {
        if (!row) return;
        product = row;
        factory = row.factories || factory;
        syncVerified();
        /* رابط Storage أولاً — دالة الحفظ تقصّ عند 2048 حرفًا،
           فتصل قيمة base64 مقصوصة لا يعرضها المتصفّح. */
        var liveImage = "";
        (row.images || []).forEach(function (u) {
          if (!liveImage && typeof u === "string" && u.indexOf("http") === 0) liveImage = u;
        });
        if (!liveImage && typeof row.image === "string" && row.image.indexOf("http") === 0) liveImage = row.image;
        var hero = wrap.querySelector(".product-hero");
        if (hero) hero.innerHTML = liveImage ? '<img alt="" src="' + escapeHTML(liveImage) + '">' : imageIcon;
        /* الاسم من الخادم يحلّ محلّ المحليّ: تُمسح
           data-sf-src وإلّا أعادت الترجمةُ الاسمَ القديم. */
        var title = wrap.querySelector(".prod-name");
        if (title) {
          title.textContent = row.name || factory.name || factoryName;
          title.removeAttribute("data-sf-src");
          /* نزع الهيكل: الكتابة أعلاه تملأ النصّ
             ولا تمسّ الأصناف، فيبقى الرمادي فوق الاسم. */
          title.classList.remove("sk-line", "sk-name");
        }
        /* الشرائح من الخادم تحلّ محلّ المحلّية */
        if (row.price != null && row.price !== "") {
          /* الأساسي من الخادم يحلّ محلّ المحلّي،
             وإلّا عاد showTierPrice إلى رقم قديم. */
          basePriceText = String(row.price).replace(/[.]00$/, "");
        }
        if (Array.isArray(row.tiers)) {
          product.tiers = row.tiers;
        }
        /* والوصف كذلك إن جاء من الخادم. */
        var descEl = wrap.querySelector(".prod-desc");
        if (descEl && row.description != null && row.description !== "") {
          descEl.textContent = row.description;
          descEl.removeAttribute("data-sf-src");
        }

        /* بعد كلّ كتابة: تُعاد الترجمة لما تغيّر. */
        if (global_SFTranslate()) SFTranslate.translateAll(wrap);
        /* التقييمات تحتاج معرّف المنتج من الخادم. */
        loadReviewsBlock();

        /* المصغّرات من صفّ الخادم: الرسمة الأولى من
           localStorage لا تحمل images[] كاملة. */
        paintThumbs(row.images || []);

        if (window.SFReviews && factoryId) {
          SFReviews.loadFactorySummary(factoryId).then(paintSupplierFacts);
        }

        var priceEl = wrap.querySelector(".prod-price");
        if (priceEl) {
          /* إسناد className كاملاً ينزع أصناف
             الهيكل معه، فلا يحتاج سطراً زائداً. */
          priceEl.className = row.price ? "prod-price" : "prod-price on-request";
          priceEl.innerHTML = row.price
            ? I18N.money(row.price)
            : escapeHTML(I18N.t("product_price_on_request"));
        }

        /* بعد كتابة السعر الأساسي لا قبلها:
           السطر أعلاه يكتب في نفس العنصر، فرسمُ
           الشرائح قبله يُمحى فوراً ويعود السعر
           إلى الأساسي مهما كانت الكمّية. */
        renderTiers();
        /* الصفحة تُرسم أولاً من localStorage حيث قد لا يكون
           للمنتج معرّف، فلا يُبنى زر السلة ولا القلب. وحين تصل
           بيانات الخادم يُبنيان معاً داخل .act-row — وبناء زر
           السلة وحده هنا كان يُسقط القلب من الصفحة. */
        /* بطاقتا الوصف والمواصفات تُبنيان من صفّ الخادم وحده:
           الرسمة الأولى من localStorage لا تحمل هذه الحقول، فلولا
           تحديثهما هنا لما ظهرتا أبداً. وتُحذفان إن فرغتا. */
        ["card-desc", "card-specs"].forEach(function (id) {
          var el = wrap.querySelector("#" + id);
          if (el) el.parentNode.removeChild(el);
        });
        var extraHTML = descCardHTML(row) + specsCardHTML(row);
        if (extraHTML) {
          /* تُلحَق بعمود التفاصيل لا قبل بطاقة المورّد:
             المورّد صار داخل غلاف الوسائط في العمود
             الأوّل، فالإدراج قبله يضع الوصف تحت الصورة. */
          var infoCol = wrap.querySelector(".pd-info");
          if (infoCol) {
            var holder = document.createElement("div");
            holder.innerHTML = extraHTML;
            /* قبل بطاقة التقييمات لا في آخر العمود
               (بطلب المالك): الوصف يسبق المراجعات.
               وappendChild وحده كان يضعه بعدها لأنّ
               التقييمات مرسومة من أوّل بناء والوصف
               يُعاد بناؤه من صفّ الخادم. */
            var rvCard = infoCol.querySelector("#card-reviews");
            while (holder.firstChild) {
              if (rvCard) infoCol.insertBefore(holder.firstChild, rvCard);
              else infoCol.appendChild(holder.firstChild);
            }
          }
        }

        if (!wrap.querySelector(".add-cart-btn")) {
          var actionBox = wrap.querySelector(".actions");
          if (actionBox) {
            var rowBox = document.createElement("div");
            rowBox.className = "act-row";

            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "act-btn primary add-cart-btn";
            btn.setAttribute("data-product-id", row.id);
            btn.textContent = I18N.t("product_add_to_cart");
            rowBox.appendChild(btn);

            rowBox.appendChild(buildFavButton(row.id));

            actionBox.insertBefore(rowBox, actionBox.firstChild);
            /* المنتقي فوق صفّ الأزرار، ويُبنى بـDOM
               لا بسلاسل نصّية متصلة. */
            if (!wrap.querySelector(".qty-picker")) {
              actionBox.insertBefore(buildQtyPicker(), rowBox);
              /* والإجمالي بينهما، فهو جزء من المنتقي لا
                 زينة مستقلّة. */
              if (!wrap.querySelector(".buy-total")) {
                actionBox.insertBefore(buildBuyTotal(), rowBox);
              }
              bindQtyPicker();
              renderTiers();
            }
            bindCartButton();
          }
        }
      }

      if (window.sb) {
        (window.SF_AUTH_READY || Promise.resolve()).then(function () {
          var query = sb.from("products").select(
            "id, factory_id, name, price, image, images, description, material, sizes, colors, moq, tiers, " +
            "factories(id, name, cover, logo, status)"
          );
          if (productId) query = query.eq("id", productId);
          else query = query.eq("factory_id", factoryId).order("sort_order").range(prodIndex, prodIndex);
          return query.maybeSingle();
        }).then(function (res) {
          /* تعذّر الاتّصال يترك النسخة المحلّية،
             أمّا ردّ ناجح بلا صفّ فيعني أنّ المنتج لا
             وجود له — فعرض مسودة محلّية يوهم المشتري
             بمنتج ليس في المنصّة (بطلب المالك). */
          if (!res || res.error) { clearSkeleton(); return; }
          if (!res.data) { showMissingProduct(); return; }
          applyLiveProduct(res.data);
        }).catch(function () { clearSkeleton(); });
      } else {
        clearSkeleton();
      }

      /* الهيكل ينتظر الخادم، فإن لم يردّ وجب أن يعود
         إلى نصّ يُقرأ بدل رماديّ ينبض بلا نهاية:
         تعذّر الاتّصال، أو غياب sb أصلاً. */
      function clearSkeleton() {
        var wrap = document.getElementById("content-wrap");
        if (!wrap) return;

        var title = wrap.querySelector(".prod-name.sk-line");
        if (title) {
          title.classList.remove("sk-line", "sk-name");
          title.textContent = displayName;
        }

        var priceEl = wrap.querySelector(".prod-price.sk-line");
        if (priceEl) {
          priceEl.className = "prod-price on-request";
          priceEl.textContent = I18N.t("product_price_on_request");
        }
      }

      /* منتج طلبه الزائر ولا وجود له في القاعدة. */
      function showMissingProduct() {
        var wrap = document.getElementById("content-wrap");
        if (!wrap) return;

        var box = document.createElement("div");
        box.className = "card missing-card";
        box.style.cssText = "text-align:center; padding:44px 20px;";

        var head = document.createElement("h2");
        head.setAttribute("data-i18n", "prod_missing");
        head.textContent = "المنتج غير متاح";
        head.style.cssText = "margin:0 0 14px; font-size:19px; color:#04361b;";
        box.appendChild(head);

        var link = document.createElement("a");
        link.href = "index.html";
        link.setAttribute("data-i18n", "prod_browse_all");
        link.textContent = "تصفّح المنتجات";
        link.style.cssText = "display:inline-block; padding:9px 20px; " +
          "border-radius:999px; background:#04361b; color:#fff; " +
          "text-decoration:none; font-weight:700; font-size:14px;";
        box.appendChild(link);

        wrap.innerHTML = "";
        wrap.appendChild(box);
        if (window.I18N) I18N.applyTranslations();
      }

      /* ===== بوابة الحساب على أزرار المراسلة =====
         الصفحة عامة (SF_PUBLIC_PAGE): يتصفّحها الزائر دون حساب
         كما في علي بابا — لكنّ المراسلة تحتاج حساباً.

         مستمع واحد مفوّض على .actions لا ثلاثة على كلّ زرّ:
         يغطّي الأزرار الثلاثة وأيّ زرّ يُضاف لاحقاً.

         SF_AUTH_READY لا يُنتظر هنا: المستمع يُسجّل فوراً
         ولا يُقرأ SF_USER إلا لحظة الضغط — وقد انتهت الجلسة
         من زمن. ولو انتظرنا لبقيت الأزرار بلا حماية لحظات. */
      var actions = wrap.querySelector(".actions");
      if (actions) {
        actions.addEventListener("click", function (ev) {
          var link = ev.target.closest ? ev.target.closest("a.act-btn") : null;
          if (!link) return;
          if (typeof sfRequireLogin !== "function") return;

          /* نمرّر وجهة الزرّ نفسه لا الصفحة الحالية،
             ليعود بعد التسجيل إلى المحادثة ومعها نصّها
             الجاهز بدل أن يعود إلى صفحة المنتج فيضغط من جديد. */
          var dest = link.getAttribute("href") || "";
          if (!sfRequireLogin(dest)) ev.preventDefault();
        });
      }
    })();
  </script>

</body>
</html>
