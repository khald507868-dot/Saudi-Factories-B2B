<!DOCTYPE html>
<!-- نوع الصفحة: متصفّح | الرئيسية: بحث وخريطة المناطق والأكثر مبيعاً
     البادئة web- تعني نسخة الموقع؛ والبادئة app- نسخة التطبيق.
     desktop.css محمّل — التصميم العريض يعمل فوق ١٠٢٤ بكسل.
     مقابلها في التطبيق: app-home.html
     الدليل الكامل: الصفحات.md -->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04361b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title data-i18n="app_title">المصانع السعودية</title>
<script src="i18n.js"></script>
<!-- زر اللغة بجانب السلة — في هذه الصفحة وحدها بطلب المالك -->
<script src="lang-switch.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="favorites-service.js"></script>
<script>var SF_PUBLIC_PAGE = true;</script>
<script src="auth-guard.js"></script>
<script src="messages-badge.js"></script>
<script src="regions-geo.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f3f5f3;
    color: #04361b;
    min-height: 100vh;
    padding-top: calc(58px + env(safe-area-inset-top));
    padding-bottom: 52px;
  }

  /* ===== شريط البحث العلوي ===== */
  .top-bar {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    height: calc(58px + env(safe-area-inset-top));
    background: #04361b;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: env(safe-area-inset-top) 16px 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  html[dir="ltr"] .top-bar {
    flex-direction: row-reverse;
  }


  .search-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border-radius: 999px;
    padding: 8px 16px;
  }

  .search-box svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    stroke: #04361b;
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    color: #04361b;
    background: transparent;
  }

  .search-box input::placeholder {
    color: #04361b;
  }

  /* ===== الشعار الكتابي في الشريط العلوي ===== */
  .top-bar-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    /* min-width لا width: العرض الثابت يقصّ آخر حرف من B2B */
    min-width: 108px;
  }

  .top-bar-logo .wm-title {
    font-size: 11px;
    font-weight: 800;
    /* 1.55 لا 1.1: B2B مرفوعة بـ vertical-align فوق السطر،
       وارتفاع السطر الضيّق كان يقصّ أعلاها */
    line-height: 1.55;
    white-space: nowrap;
    /* الاسم لاتيني دائماً، فيثبّت اتجاهه حتى لا ينعكس ترتيب الكلمتين في RTL */
    direction: ltr;
  }

  /* "مصانع" أخضر فاتح و"السعودية" أبيض فوق خلفية الشريط الخضراء */
  .top-bar-logo .w-green { color: #45a06a; }
  .top-bar-logo .w-dark { color: #ffffff; }

  /* "B2B" ذهبي وبحجم أصغر لتمييزها عن الاسم */
  .top-bar-logo .w-b2b {
    color: #c9a227;
    font-size: 0.62em;
    vertical-align: 0.58em;
  }

  /* الخط المتدرج تحت الاسم */
  .top-bar-logo .wm-rule {
    width: 100%;
    height: 1.5px;
    border-radius: 2px;
    background: linear-gradient(to left, #1f6b42, #45a06a, #c9a227);
  }

  html[dir="ltr"] .top-bar-logo .wm-rule {
    background: linear-gradient(to right, #1f6b42, #45a06a, #c9a227);
  }

  /* ===== محتوى الصفحة ===== */
  .content {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 16px;
    text-align: center;
  }

  /* ===== خريطة المملكة ===== */
  .map-section {
    margin-top: 4px;
    background: transparent;
    padding: 4px 0 0;
  }

  .map-section h2 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .map-section .hint {
    color: #8a968f;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .ksa-map {
    width: 100%;
    max-width: 240px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .ksa-map .region {
    fill: #d9e8dd;
    stroke: #ffffff;
    stroke-width: 1.5;
    cursor: pointer;
    transition: fill 0.15s ease;
  }

  .ksa-map .region:hover,
  .ksa-map .region:focus {
    fill: #58967a;
    outline: none;
  }

  .ksa-map .region.active {
    fill: #04361b;
  }

  /* الحدود الخارجية: الحدّ الأخضر يظهر فقط عند محيط المملكة،
     لأن تعبئة كل منطقة تخفي حدود جاراتها الملاصقة لها */
  .ksa-outline use {
    fill: #04361b;
    stroke: #04361b;
    stroke-width: 4;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .ksa-map .region-label {
    pointer-events: none;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    fill: #0b3a20;
    stroke: #ffffff;
    stroke-width: 3px;
    paint-order: stroke;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  /* ===== نافذة خريطة المنطقة ===== */
  .map-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }

  .map-modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .map-modal {
    background: #ffffff;
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    transform: scale(0.96);
    transition: transform 0.2s ease;
  }

  .map-modal-overlay.open .map-modal {
    transform: scale(1);
  }

  .map-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #04361b;
    color: #ffffff;
    flex-shrink: 0;
  }

  .map-modal-header h2 {
    font-size: 16px;
  }

  .map-modal-close {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* غلاف خريطة المنطقة المختارة */
  .map-frame-wrap {
    position: relative;
    width: 100%;
    height: 320px;
    flex-shrink: 0;
    background: #ffffff;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }

  .map-frame-wrap.dragging {
    cursor: grabbing;
  }

  /* طبقة البلاطات: تتحرك ككتلة واحدة عند السحب */
  .tile-layer {
    position: absolute;
    top: 0;
    right: auto;
    left: 0;
    width: 100%;
    height: 100%;
    /* القناع يقصّ البلاطات على حدود المنطقة فلا تظهر المناطق المجاورة */
    -webkit-mask-image: var(--region-mask);
    mask-image: var(--region-mask);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  .tile-layer img {
    position: absolute;
    width: 256px;
    height: 256px;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    /* ميل خفيف نحو أخضر التطبيق */
    filter: saturate(0.5) hue-rotate(74deg) brightness(1.03);
  }

  /* حدود المنطقة مرسومة فوق البلاطات */
  .region-outline {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .region-outline path {
    fill: none;
    stroke: #04361b;
    stroke-width: 2.5;
    stroke-linejoin: round;
  }

  /* أزرار التكبير والتصغير */
  .map-zoom {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 2;
  }

  .map-zoom button {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.95);
    color: #04361b;
    font-size: 19px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(4, 54, 27, 0.25);
  }

  .map-zoom button:disabled {
    color: #b3bdb7;
    cursor: default;
  }

  /* إسناد حقوق OpenStreetMap كما تشترط رخصة الاستخدام */
  .map-attrib {
    position: absolute;
    bottom: 0;
    left: 0;
    background: rgba(255, 255, 255, 0.82);
    font-size: 9.5px;
    color: #04361b;
    padding: 1px 5px;
    border-radius: 4px 0 0 0;
    z-index: 2;
  }

  .map-attrib a {
    color: #04361b;
  }

  .map-modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    flex-wrap: wrap;
  }

  .map-modal-footer a {
    color: #04361b;
    font-size: 13px;
    text-decoration: none;
  }

  .map-modal-footer button {
    border: none;
    background: #04361b;
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  /* ===== القائمة السفلية ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    height: 52px;
    background: #ffffff;
    display: flex;
    border-top: 2px solid #04361b;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 10;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
    color: #5c8a70;
    font-size: 11px;
    padding: 0 2px;
    text-align: center;
    white-space: nowrap;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    flex-shrink: 0;
  }

  .nav-item.active {
    color: #04361b;
    font-weight: 700;
  }

  /* ===== أكثر المنتجات مبيعاً ===== */
  .bestsellers-section {
    padding: 0 12px 8px;
  }

  .bestsellers-title {
    font-size: 15px;
    font-weight: 800;
    color: #04361b;
    margin-bottom: 7px;
    padding: 0 4px;
  }

  /* قالبان في كل صف */
  /* رسالة الحالة تمتدّ على عرض الشبكة كلها */
  .grid-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 16px;
    color: #7d8c83;
    font-size: 14px;
  }

  .bestsellers-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .product-card {
    display: block;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 6px rgba(4, 54, 27, 0.08);
  }

  .product-card:active {
    opacity: 0.85;
  }

  /* غلاف البطاقة — البطاقة نفسها <a> فلا يصحّ وضع زر داخلها،
     فالزر شقيق لها داخل غلاف نسبي يعلوها. */
  .product-cell { position: relative; }

  /* زر القلب: يجلس في الطرف الابتدائي حسب اتجاه القراءة، فيتبع
     dir وحده بلا نظير html[dir="ltr"]. */
  .fav-heart {
    position: absolute;
    top: 7px;
    inset-inline-start: 7px;
    z-index: 2;
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.93);
    box-shadow: 0 1px 4px rgba(4, 54, 27, 0.16);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .fav-heart svg { width: 16px; height: 16px; }
  .fav-heart svg path {
    fill: none;
    stroke: #8a9a8e;
    stroke-width: 1.7;
    transition: fill 0.15s, stroke 0.15s;
  }
  .fav-heart.on svg path { fill: #d13b3b; stroke: #d13b3b; }
  .fav-heart:disabled { opacity: 0.5; cursor: default; }

  /* الصورة: أعرض من طولها لتقليل ارتفاع القالب */
  .product-image {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #e6e9e7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .product-image svg {
    width: 34px;
    height: 34px;
    stroke: #04361b;
    fill: none;
    stroke-width: 1.5;
  }

  .product-body {
    padding: 6px 8px 7px;
  }

  /* سطران ثم قصّ بثلاث نقاط */
  .product-name {
    font-size: 11.5px;
    line-height: 1.45;
    color: #04361b;
    max-height: 33px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 5px;
  }

  .product-price {
    font-size: 13.5px;
    font-weight: 800;
    color: #04361b;
    direction: ltr;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  html[dir="ltr"] .product-price {
    text-align: left;
  }

  .product-currency {
    font-size: 10.5px;
    font-weight: 700;
  }

  /* سطر: موثّق + عدد السنوات */
  .product-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    font-size: 9.5px;
    color: #5c8a70;
    white-space: nowrap;
  }

  .product-verified {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-weight: 700;
    color: #04361b;
  }

  .product-verified svg {
    width: 10px;
    height: 10px;
    stroke: #c9a227;
    fill: none;
    stroke-width: 2.6;
    flex-shrink: 0;
  }

  .product-reorder {
    margin-top: 3px;
    font-size: 9.5px;
    color: #5c8a70;
    white-space: nowrap;
  }

  /* ===== قائمة الفئات الجانبية ===== */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,54,27,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }

  .drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .categories-drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    width: 58%;
    max-width: 225px;
    background: #ffffff;
    box-shadow: -4px 0 16px rgba(0,0,0,0.15);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 21;
    display: flex;
    flex-direction: column;
  }

  .categories-drawer.open {
    transform: translateX(0);
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #04361b;
    color: #ffffff;
    flex-shrink: 0;
  }

  .drawer-header h2 {
    font-size: 15px;
  }

  .drawer-close {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 8px;
  }

  .drawer-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }

  .drawer-list li a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    text-decoration: none;
    color: #04361b;
    font-size: 12.5px;
    border-bottom: 1px solid #eef1ef;
    gap: 6px;
    /* أسماء الفئات الطويلة تبقى في سطر واحد داخل القائمة الضيقة */
    white-space: nowrap;
    overflow: hidden;
  }

  .drawer-list li a:active,
  .drawer-list li a:hover {
    background: #f3f8f4;
  }

  .drawer-list li a::after {
    content: "‹";
    color: #a9b6ae;
    font-size: 18px;
  }

  /* ===== خريطة المملكة كخلفية شفافة وراء الصفحة كلها =====
     منقولة عن app-user-type.html بطلب المالك (2026-08-25).
     شكل فقط: بلا أسماء مناطق وبلا تفاعل — الخريطة التفاعلية
     تبقى داخل بطاقتها في .map-section.

     الفرق عن نسخة الجوال: لا حصر داخل عمود 430px، فمسار web
     بلا عمود جوال — تمتد على كامل عرض الشاشة، وهو المطلوب. */
  .map-watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .map-watermark svg {
    /* الحصر بالارتفاع لا بالعرض: الخريطة أطول منها عرضاً،
       فتحديد العرض وحده يطلّع أعلاها وأسفلها خارج إطار الصفحة */
    width: auto;
    height: 74vh;
    max-width: 88%;
    opacity: 0.16;
  }

  .map-watermark .deco-region {
    /* أخضر خفيف بطلب المالك بدل الغامق #04361b.
       الشفافية 6% على العنصر الحاوي، فاللون الفاتح يحتاج
       درجة مشبعة قليلاً وإلا اختفت الخريطة تماماً. */
    fill: #6aae83;
    stroke: #6aae83;
    stroke-width: 1.5;
  }

  /* المحتوى والشريط العلوي فوق الخلفية */
  .content { position: relative; z-index: 1; }
  .top-bar { z-index: 10; }

</style>

<body>
  <!-- خريطة المملكة كعلامة مائية في الخلف: شكل فقط، بلا أسماء مناطق وبلا تفاعل -->

  <script>
    (function () {
      const regions = document.querySelectorAll('.ksa-map .region');
      const searchInput = document.querySelector('.search-box input');
      /* اسم المنطقة المختارة — تستخدمه نافذة الخريطة عند البحث عن مصانع */
      let selectedRegionName = '';

      document.querySelectorAll('.region-label').forEach(label => {
        label.textContent = I18N.regionName(label.getAttribute('data-region-label'));
      });

      const drawerList = document.getElementById('drawer-list');
      I18N.categories.forEach(cat => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'web-factories.html?cat=' + encodeURIComponent(cat.en || '');
        a.textContent = I18N.categoryName(cat);
        li.appendChild(a);
        drawerList.appendChild(li);
      });

      // إحداثيات مركز كل منطقة (تقريبية) لعرض خريطة حقيقية عند الاختيار
      const regionCoords = {
        'ryiadh':            { lat: 24.7136, lon: 46.6753, dLon: 3.0, dLat: 2.2 },
        'mecca':             { lat: 21.5000, lon: 40.5000, dLon: 2.0, dLat: 1.6 },
        'medina':            { lat: 24.5247, lon: 39.5692, dLon: 2.3, dLat: 2.3 },
        'eastern-province':  { lat: 23.0000, lon: 49.5000, dLon: 3.5, dLat: 6.0 },
        'al-qassim':         { lat: 26.3260, lon: 43.9750, dLon: 1.5, dLat: 1.2 },
        'hail':               { lat: 27.5114, lon: 41.6900, dLon: 2.0, dLat: 1.6 },
        'tabuk':             { lat: 28.3998, lon: 36.5715, dLon: 2.2, dLat: 1.8 },
        'northern-borders':  { lat: 30.3000, lon: 41.3000, dLon: 2.5, dLat: 1.5 },
        'jizan':             { lat: 17.1000, lon: 42.9000, dLon: 0.9, dLat: 0.8 },
        'najran':            { lat: 17.9000, lon: 45.3000, dLon: 1.6, dLat: 1.5 },
        'al-bahah':          { lat: 20.0129, lon: 41.4677, dLon: 0.7, dLat: 0.6 },
        'al-jawf':           { lat: 29.9000, lon: 40.0000, dLon: 1.6, dLat: 1.3 },
        'asir':              { lat: 18.7000, lon: 42.6000, dLon: 1.5, dLat: 1.5 }
      };

      const mapModalOverlay = document.getElementById('map-modal-overlay');
      const mapModalTitle = document.getElementById('map-modal-title');
      const mapModalClose = document.getElementById('map-modal-close');
      const mapModalGmaps = document.getElementById('map-modal-gmaps');
      const mapModalSearch = document.getElementById('map-modal-search');

      /* ===== خريطة المنطقة: بلاطات OpenStreetMap مقصوصة على حدود المنطقة =====
         مبنية يدوياً بلا أي مكتبة خارجية، حتى تبقى الصفحة قائمة بذاتها.
         الإسقاط هو Web Mercator نفسه الذي تستخدمه بلاطات الخرائط. */
      const TILE = 256;
      const MAX_Z = 12;   /* أقصى تقريب: يكفي لرؤية الشوارع الرئيسية */
      const MIN_Z = 5;

      const mapCanvas = document.getElementById('map-canvas');
      const tileLayer = document.getElementById('tile-layer');
      const outlineSvg = document.getElementById('region-outline');
      const zoomInBtn = document.getElementById('zoom-in');
      const zoomOutBtn = document.getElementById('zoom-out');

      /* تحويل الإحداثيات الجغرافية إلى بكسلات عالمية عند مستوى تقريب معيّن */
      function lonToX(lon, z) {
        return (lon + 180) / 360 * TILE * Math.pow(2, z);
      }

      function latToY(lat, z) {
        const s = Math.sin(lat * Math.PI / 180);
        return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE * Math.pow(2, z);
      }

      /* حالة الخريطة الحالية */
      const mapState = { z: 7, cx: 0, cy: 0, rings: null, w: 0, h: 0 };

      /* حساب مستوى التقريب الذي تملأ فيه المنطقة النافذة */
      function fitZoom(rings, w, h) {
        for (let z = MAX_Z; z >= MIN_Z; z--) {
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          rings.forEach(ring => ring.forEach(pt => {
            const x = lonToX(pt[1], z), y = latToY(pt[0], z);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }));
          if ((maxX - minX) <= w && (maxY - minY) <= h) return z;
        }
        return MIN_Z;
      }

      /* مركز المنطقة بالبكسل عند مستوى التقريب الحالي */
      function regionCenter(rings, z) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        rings.forEach(ring => ring.forEach(pt => {
          const x = lonToX(pt[1], z), y = latToY(pt[0], z);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }));
        return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
      }

      /* مسار الحدود بإحداثيات الشاشة الحالية */
      function ringsToPath() {
        const originX = mapState.cx - mapState.w / 2;
        const originY = mapState.cy - mapState.h / 2;
        return mapState.rings.map(ring => {
          const pts = ring.map(pt =>
            (lonToX(pt[1], mapState.z) - originX).toFixed(1) + ',' +
            (latToY(pt[0], mapState.z) - originY).toFixed(1));
          return 'M' + pts.join('L') + 'Z';
        }).join(' ');
      }

      /* رسم البلاطات المرئية فقط، والقناع، والحدود */
      function renderMap() {
        const w = mapState.w, h = mapState.h;
        const originX = mapState.cx - w / 2;
        const originY = mapState.cy - h / 2;
        const d = ringsToPath();

        /* القناع: يُظهر ما داخل الحدود فقط ويخفي كل ما عداه */
        const maskSvg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
          '<path d="' + d + '" fill="#fff"/></svg>';
        tileLayer.style.setProperty('--region-mask',
          'url(\'data:image/svg+xml;utf8,' + encodeURIComponent(maskSvg) + '\')');

        /* الحدود فوق البلاطات */
        outlineSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        outlineSvg.innerHTML = '<path d="' + d + '"/>';

        /* البلاطات المرئية */
        const scale = Math.pow(2, mapState.z);
        const maxTile = scale - 1;
        const x0 = Math.floor(originX / TILE), x1 = Math.floor((originX + w) / TILE);
        const y0 = Math.floor(originY / TILE), y1 = Math.floor((originY + h) / TILE);

        let html = '';
        for (let ty = y0; ty <= y1; ty++) {
          if (ty < 0 || ty > maxTile) continue;
          for (let tx = x0; tx <= x1; tx++) {
            const wrapped = ((tx % scale) + scale) % scale;
            html += '<img alt="" loading="lazy" src="https://tile.openstreetmap.org/' +
              mapState.z + '/' + wrapped + '/' + ty + '.png" style="left:' +
              (tx * TILE - originX) + 'px;top:' + (ty * TILE - originY) + 'px">';
          }
        }
        tileLayer.innerHTML = html;

        zoomInBtn.disabled = mapState.z >= MAX_Z;
        zoomOutBtn.disabled = mapState.z <= MIN_Z;
      }

      function openRegionMap(regionId) {
        const rings = (typeof SA_REGION_BOUNDS !== 'undefined') ? SA_REGION_BOUNDS[regionId] : null;
        if (!rings) return;

        const rect = mapCanvas.getBoundingClientRect();
        mapState.rings = rings;
        /* عند الفتح قد تكون النافذة لم تُرسم بعد، فنعتمد أبعاداً احتياطية */
        mapState.w = Math.round(rect.width) || mapCanvas.offsetWidth || 430;
        mapState.h = Math.round(rect.height) || mapCanvas.offsetHeight || 320;
        mapState.z = fitZoom(rings, mapState.w, mapState.h);

        const c = regionCenter(rings, mapState.z);
        mapState.cx = c.x;
        mapState.cy = c.y;

        renderMap();
      }

      /* ===== السحب بالفأرة واللمس ===== */
      let dragging = false, lastX = 0, lastY = 0;

      function dragStart(x, y) {
        dragging = true;
        lastX = x;
        lastY = y;
        mapCanvas.classList.add('dragging');
      }

      function dragMove(x, y) {
        if (!dragging || !mapState.rings) return;
        mapState.cx -= (x - lastX);
        mapState.cy -= (y - lastY);
        lastX = x;
        lastY = y;
        renderMap();
      }

      function dragEnd() {
        dragging = false;
        mapCanvas.classList.remove('dragging');
      }

      mapCanvas.addEventListener('mousedown', e => { e.preventDefault(); dragStart(e.clientX, e.clientY); });
      window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', dragEnd);

      mapCanvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) dragStart(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      mapCanvas.addEventListener('touchmove', e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          dragMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });
      mapCanvas.addEventListener('touchend', dragEnd);

      /* التكبير حول مركز النافذة */
      function zoomBy(delta) {
        if (!mapState.rings) return;
        const nz = Math.min(MAX_Z, Math.max(MIN_Z, mapState.z + delta));
        if (nz === mapState.z) return;
        const factor = Math.pow(2, nz - mapState.z);
        mapState.cx *= factor;
        mapState.cy *= factor;
        mapState.z = nz;
        renderMap();
      }

      zoomInBtn.addEventListener('click', () => zoomBy(1));
      zoomOutBtn.addEventListener('click', () => zoomBy(-1));

      mapCanvas.addEventListener('wheel', e => {
        e.preventDefault();
        zoomBy(e.deltaY < 0 ? 1 : -1);
      }, { passive: false });

      function openMapModal(regionId, name) {
        const c = regionCoords[regionId];

        mapModalTitle.textContent = I18N.t('map_modal_title_prefix') + ' ' + name;
        if (c) {
          mapModalGmaps.href = 'https://www.google.com/maps/@' + c.lat + ',' + c.lon + ',9z';
        }

        mapModalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';

        /* بعد فتح النافذة حتى تُقاس أبعاد الحاوية بشكل صحيح */
        openRegionMap(regionId);
      }

      function closeMapModal() {
        mapModalOverlay.classList.remove('open');
        tileLayer.innerHTML = '';
        outlineSvg.innerHTML = '';
        mapState.rings = null;
        document.body.style.overflow = '';

        /* إزالة تحديد المنطقة حتى لا تبقى ملوّنة بعد الإغلاق.
           selectedRegionName يبقى كما هو لأن زر البحث في النافذة يقرأه */
        regions.forEach(r => r.classList.remove('active'));
        if (document.activeElement && document.activeElement.classList.contains('region')) {
          document.activeElement.blur();
        }
      }

      mapModalClose.addEventListener('click', closeMapModal);
      mapModalOverlay.addEventListener('click', (e) => {
        if (e.target === mapModalOverlay) closeMapModal();
      });
      mapModalSearch.addEventListener('click', () => {
        window.location.href = 'web-factories.html?city=' + encodeURIComponent(selectedRegionName);
      });

      function selectRegion(region) {
        regions.forEach(r => r.classList.remove('active'));
        region.classList.add('active');

        const name = I18N.regionName(region.id);
        selectedRegionName = name;

        searchInput.value = I18N.t('search_factories_prefix') + name;

        openMapModal(region.id, name);
      }

      regions.forEach(region => {
        region.addEventListener('click', () => selectRegion(region));
        region.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectRegion(region);
          }
        });
      });

      const categoriesBtn = document.getElementById('categories-btn');
      const drawer = document.getElementById('categories-drawer');
      const drawerOverlay = document.getElementById('drawer-overlay');
      const drawerClose = document.getElementById('drawer-close');

      function openDrawer() {
        drawer.classList.add('open');
        drawerOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        drawer.classList.remove('open');
        drawerOverlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      categoriesBtn.addEventListener('click', (e) => {
        e.preventDefault();
        openDrawer();
      });
      drawerClose.addEventListener('click', closeDrawer);
      drawerOverlay.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeDrawer();
          closeMapModal();
        }
      });
    })();

    /* ===== أكثر المنتجات مبيعاً: بناء 1000 قالب بسلسلة واحدة ===== */
    (function () {
      var grid = document.getElementById('bestsellers-grid');
      if (!grid) return;

      /* المنتجات الحقيقية من قاعدة البيانات.

         كان هنا مولّد يرسم 1000 قالب مرقّم لا حساب وراءه،
         فكان الزائر يضغط بطاقة فيصل إلى منتج لا وجود له.
         حذفها المالك وطلب الحقيقي وحده.

         سياسة products_select_public ترشح بنفسها: لا تظهر إلا
         منتجات المصانع المعتمدة (أو مصنع المالك نفسه). */
      var LIMIT = 24;

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // أيقونة بديلة عند غياب الصورة
      var imageIcon =
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="3" width="18" height="18" rx="2"/>' +
        '<circle cx="8.5" cy="8.5" r="1.5"/>' +
        '<path d="M21 15l-5-5L5 21"/></svg>';

      var checkIcon =
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 6L9 17l-5-5"/></svg>';

      var riyal = I18N.t('currency_sar');
      var verified = I18N.t('product_verified');
      var yearsLabel = I18N.t('product_years');
      var reorderLabel = I18N.t('product_reorder_rate');

      function showState(msg) {
        grid.innerHTML = '<p class="grid-state">' + escapeHTML(msg) + '</p>';
      }

      showState(I18N.t('fx_loading'));

      function render(rows) {
        if (!rows.length) {
          showState(I18N.t('fx_empty'));
          return;
        }

        var html = '';
        rows.forEach(function (row) {
          var factory = row.factories || {};
          /* رابط Storage أولاً: دالة الحفظ تقصّ كل قيمة عند 2048 حرفًا،
             وهو حدّ مصمّم لرابط (~170 حرفًا) لا لـ base64 (عشرات الآلاف)،
             فـ row.image يصل جذاذة تالفة لا يعرضها المتصفّح. */
          var image = '';
          (row.images || []).forEach(function (u) {
            if (!image && typeof u === 'string' && u.indexOf('http') === 0) image = u;
          });
          if (!image && typeof row.image === 'string' && row.image.indexOf('http') === 0) image = row.image;
          if (!image) image = factory.cover || '';
          var name = row.name || factory.name || '';
          var price = row.price || '';

          /* قيم العرض مشتقّة من رقم المصنع — نفس معادلة
             web-product.html حتى تتطابق البطاقة والصفحة التي تفتحها */
          var fid = row.factory_id;
          var years = (fid % 17) + 1;
          var reorder = (fid % 61) + 12;

          html +=
            '<div class="product-cell">' +
            '<button class="fav-heart" type="button" data-fav="' + escapeHTML(row.id) + '" aria-label="' + escapeHTML(I18N.t('fav_add')) + '">' +
              '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>' +
            '</button>' +
            '<a class="product-card" href="web-product.html?factory=' + encodeURIComponent(fid) + '&p=0&product=' + encodeURIComponent(row.id) + '">' +
              '<div class="product-image">' +
                (sfSafeHttpUrl(image) ? '<img alt="" src="' + escapeHTML(sfSafeHttpUrl(image)) + '">' : imageIcon) +
              '</div>' +
              '<div class="product-body">' +
                (name ? '<div class="product-name">' + escapeHTML(name) + '</div>' : '') +
                (price
                  ? '<div class="product-price">' + escapeHTML(price) +
                    ' <span class="product-currency">' + escapeHTML(riyal) + '</span></div>'
                  : '') +
                '<div class="product-meta">' +
                  '<span class="product-verified">' + checkIcon + escapeHTML(verified) + '</span>' +
                  '<span>' + years + ' ' + escapeHTML(yearsLabel) + '</span>' +
                '</div>' +
                '<div class="product-reorder">' +
                  escapeHTML(reorderLabel) + ' ' + reorder + '%' +
                '</div>' +
              '</div>' +
            '</a>' +
            '</div>';
        });
        grid.innerHTML = html;
        wireFavorites(grid);
      }

      /* ===== المفضّلة =====
         تُلوَّن القلوب بعد رسم الشبكة، ثم يبدّلها النقر.
         الزائر بلا حساب يُرسَل إلى التسجيل — الصفحة عامة
         (SF_PUBLIC_PAGE) فقد يصلها من محرّك بحث. */
      function wireFavorites(grid) {
        if (!window.SFFavorites || !window.SF_USER) return;

        SFFavorites.loadIds().then(function (ids) {
          var set = {};
          ids.forEach(function (id) { set[String(id)] = true; });
          grid.querySelectorAll('[data-fav]').forEach(function (btn) {
            if (set[btn.getAttribute('data-fav')]) btn.classList.add('on');
          });
        }).catch(function () { /* تعذّر الجلب: تبقى القلوب فارغة */ });
      }

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.fav-heart');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();

        if (!window.SF_USER) {
          if (typeof sfRequireLogin === 'function') sfRequireLogin();
          return;
        }

        var id = btn.getAttribute('data-fav');
        var on = btn.classList.contains('on');
        /* تفاؤلي: القلب يتبدّل فوراً ويرتدّ إن رفض الخادم. */
        btn.classList.toggle('on', !on);
        btn.disabled = true;

        SFFavorites.toggle(id, on).then(function (nowFav) {
          btn.classList.toggle('on', nowFav);
        }).catch(function (err) {
          btn.classList.toggle('on', on);
          alert(err && err.message ? err.message : String(err));
        }).then(function () {
          btn.disabled = false;
        });
      });

      if (!window.sb) { showState(I18N.t('fx_failed')); return; }

      var ready = window.SF_AUTH_READY || Promise.resolve(null);

      ready.then(function () {
        return sb.from('products')
          .select('id, factory_id, name, price, image, images, factories(name, cover)')
          .order('sort_order')
          .limit(LIMIT);
      }).then(function (res) {
        if (!res || res.error) { showState(I18N.t('fx_failed')); return; }
        render(res.data || []);
      }).catch(function () {
        showState(I18N.t('fx_failed'));
      });
    })();

  /* ============================================================
     شريط سطح المكتب: الفئات + حالة الحساب
     يعمل على كل الأحجام لكنه لا يظهر إلا فوق 1024px،
     فالعناصر مخفية على الجوال عبر desktop.css.
     ============================================================ */
  (function () {
    /* --- لوحة الفئات (☰) + روابط الشريط --- */
    var cats = (window.I18N && I18N.categories) ? I18N.categories : [];

    if (cats.length) {
      /* عمود الأسماء داخل اللوحة */
      var listEl = document.getElementById("dt-catlist");
      if (listEl) {
        listEl.innerHTML = cats.map(function (cat, i) {
          return '<li data-i="' + i + '"' + (i === 0 ? ' class="active"' : "") + '>' +
                 '<a href="web-factories.html?cat=' + encodeURIComponent(cat.en || "") + '">' +
                 I18N.categoryName(cat) + "</a></li>";
        }).join("");
      }

      /* المعاينة: تعرض الفئة التي يمرّ عليها المؤشر */
      var prev = document.getElementById("dt-catpreview");
      var thumbSvg = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
                     '<rect x="3" y="3" width="18" height="18" rx="2"></rect>' +
                     '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
                     '<path d="M21 15l-5-5L5 21"></path></svg>';

      function showPreview(i) {
        if (!prev || !cats[i]) return;
        var name = I18N.categoryName(cats[i]);
        var link = "web-factories.html?cat=" + encodeURIComponent(cats[i].en || "");
        var items = "";
        /* ثماني بطاقات نائبة حتى تُربط الصفحة بقاعدة البيانات */
        for (var k = 0; k < 8; k++) {
          items += '<a class="dt-preview-item" href="' + link + '">' +
                   '<div class="dt-preview-thumb">' + thumbSvg + "</div>" +
                   "<span>" + name + "</span></a>";
        }
        prev.innerHTML = "<h4>" + name + "</h4>" +
                         '<div class="dt-preview-grid">' + items + "</div>";
      }

      showPreview(0);

      if (listEl) {
        listEl.addEventListener("mouseover", function (e) {
          var li = e.target.closest("li[data-i]");
          if (!li) return;
          listEl.querySelectorAll("li").forEach(function (x) { x.classList.remove("active"); });
          li.classList.add("active");
          showPreview(parseInt(li.getAttribute("data-i"), 10));
        });
      }

      /* روابط الفئات المسطّحة بعد زر ☰ في نفس الشريط */
      /* الشريط يتنقل بهدوء بين الفئات تلقائياً، ويتوقف عند المرور
         عليه كي تبقى القراءة والضغط على أي فئة مريحة. */
      function setupCatScroll(box) {
        var L = document.getElementById("dt-catnav-left");
        var R = document.getElementById("dt-catnav-right");
        if (!L || !R) return;

        /* في RTL تكون scrollLeft سالبة في المتصفّحات الحديثة،
           فنقيس بالقيمة المطلقة ليعمل المنطق في الاتجاهين. */
        function maxScroll() { return box.scrollWidth - box.clientWidth; }

        function sync() {
          var pos = Math.abs(box.scrollLeft);
          var max = maxScroll();
          var atStart = pos <= 1;
          var atEnd = pos >= max - 1;
          var rtl = document.documentElement.getAttribute("dir") === "rtl";

          /* السهم الذي يمضي إلى المزيد يقع يساراً في العربية
             ويميناً في الإنجليزية — مرآة تتبع اتجاه القراءة. */
          var moreEl = rtl ? L : R;
          var backEl = rtl ? R : L;
          moreEl.classList.toggle("is-active", !atEnd && max > 0);
          backEl.classList.toggle("is-active", !atStart && max > 0);
        }

        /* اتجاه الخطوة: موجبة تمضي للأمام في الاتجاهين معاً.
           المسافة وسيط: قفزة الضغط واسعة، وخطوة التمرير
           التلقائي صغيرة ومتكرّرة لتكون الحركة ناعمة بطيئة. */
        function step(el, forward, dist) {
          var rtl = document.documentElement.getAttribute("dir") === "rtl";
          var sign = rtl ? -1 : 1;
          var d = dist || 240;
          box.scrollLeft += sign * (forward ? d : -d);
        }

        function hold(el, forward) {
          var timer = null;
          el.addEventListener("mouseenter", function () {
            if (timer) return;
            /* smooth يُلغى أثناء الوقوف: كل خطوة صغيرة تبدأ
               حركة انتقالية فتتداخل مع التي قبلها وتتقطّع */
            box.style.scrollBehavior = "auto";
            /* ٤ بكسل كل ٢٠ms: أبطأ بكثير ممّا كان (٢٤٠ كل ٩٠ms) */
            timer = setInterval(function () { step(el, forward, 4); }, 20);
          });
          function stop() {
            if (timer) { clearInterval(timer); timer = null; }
          }
          el.addEventListener("mouseleave", function () {
            stop();
            box.style.scrollBehavior = "";
          });
          el.addEventListener("click", function () { step(el, forward); });
          box.addEventListener("scroll", sync);
          return stop;
        }

        var rtlNow = document.documentElement.getAttribute("dir") === "rtl";
        hold(rtlNow ? L : R, true);
        hold(rtlNow ? R : L, false);

        /* حركة تلقائية هادئة: بكسل واحد كل 50ms، أي نحو 20 بكسل
           في الثانية. نستخدم بكسلاً كاملاً لأن بعض المتصفحات تتجاهل
           كسور البكسل عند فتح الصفحة مباشرة من الملفات. */
        var autoPaused = false;
        var autoDirection = 1;
        function autoMove() {
          var max = maxScroll();

          if (!autoPaused && !document.hidden && max > 1) {
            var pos = Math.abs(box.scrollLeft);
            if (pos >= max - 1) autoDirection = -1;
            else if (pos <= 1) autoDirection = 1;
            step(null, autoDirection > 0, 1);
          }
        }

        /* يشمل المساحة كاملةً والأسهم، ولا يتوقف الشريط عند المرور
           على عنصر داخلي فقط ثم يعود للتحرك أثناء اختيار الفئة. */
        var pauseArea = box.closest(".dt-catbar-inner") || box;
        pauseArea.addEventListener("mouseenter", function () { autoPaused = true; });
        pauseArea.addEventListener("mouseleave", function () { autoPaused = false; });
        setInterval(autoMove, 50);

        /* عجلة الفأرة الرأسية تُحوّل إلى تمرير أفقي */
        box.addEventListener("wheel", function (e) {
          if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
          e.preventDefault();
          box.scrollLeft += (document.documentElement.getAttribute("dir") === "rtl" ? -1 : 1) * e.deltaY;
        }, { passive: false });

        window.addEventListener("resize", sync);
        sync();
      }

      /* الفئات كلها لا أول ثمانٍ: الشريط يُمرّر أفقياً
         فيظهر الباقي عند التمرير إلى آخر اليسار. */
      var bar = document.getElementById("dt-catscroll");
      if (bar) {
        var html = "";
        cats.forEach(function (cat) {
          html += '<a href="web-factories.html?cat=' + encodeURIComponent(cat.en || "") + '">' +
                  I18N.categoryName(cat) + "</a>";
        });
        bar.innerHTML = html;
        setupCatScroll(bar);
      }
    }

    /* حالة الحساب: زائر ← دخول + إنشاء حساب، مسجّل ← حسابي */
    var slot = document.getElementById("dt-auth");
    if (!slot) return;

    /* الزر يتبع حالة الجلسة: زائر ← "تسجيل دخول"، ومسجّل ←
       لا زر. كان ثابتاً على "تسجيل دخول" في الحالتين، فيظهر
       لمن سجّل دخوله وهو ما لا معنى له.

       الجلسة تصل بعد رسم الصفحة، فنرسم زر الدخول أولاً ثم
       نصحّحه حين تجهز SF_AUTH_READY — بدل صفحة فارغة أو وميض.
       النص من I18N ليتبع اللغة المختارة كبقية الصفحة. */
    function paintAuth(signedIn) {
      /* المسجّل لا يرى زراً هنا: تسجيل الخروج موجود في
         الإعدادات، ووضعه في الشريط تكرار. والوصول للحساب
         عبر أيقونة الحساب المجاورة. */
      slot.innerHTML = signedIn ? "" :
        '<a class="dt-btn primary" href="web-login.html" data-i18n="splash_login_btn">' +
        I18N.t("splash_login_btn") + "</a>";
    }

    paintAuth(false);

    if (window.SF_AUTH_READY) {
      SF_AUTH_READY.then(function () {
        paintAuth(!!window.SF_USER);
      });
    }

    /* زر "كن مورّداً": دعوة للمصانع كي تسجّل — فلا معنى
       لعرضه لمن سجّل دخوله أصلاً كمورّد. يعود بعد تسجيل
       الخروج من الإعدادات لأن sfSignOut تمحو الجلسة.

       المصدر هو account_type القادم من جدول profiles عبر
       الحارس، لا localStorage القابل للتزوير. ولأن الجلسة
       تصل بعد رسم الصفحة، نخفي الزر مبكّراً إن كان
       localStorage يقول "factory" لمنع الوميض، ثم نصحّح
       القرار من الخادم حين تجهز SF_AUTH_READY. */
    var supplierCta = document.querySelector(".dt-supplier");
    if (supplierCta) {
      function showSupplierCta(show) {
        supplierCta.style.display = show ? "" : "none";
      }

      var cachedType = "";
      try { cachedType = localStorage.getItem("sf_account_type") || ""; } catch (e) {}
      showSupplierCta(cachedType !== "factory");

      if (window.SF_AUTH_READY) {
        SF_AUTH_READY.then(function () {
          var type = window.SF_PROFILE ? window.SF_PROFILE.account_type : "";
          showSupplierCta(type !== "factory");
        });
      }
    }
  })();
  </script>

</body>
