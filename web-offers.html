  <script src="currency.js"></script>
  <script src="i18n.js?v=20260923-quantity-offers"></script>
  <script src="currency-ui.js?v=20260922-locale-dropdown"></script>

  <script src="product-card-data.js?v=20260924-tier-details"></script>
  <script src="reviews-service.js"></script>

<script src="category-scroll.js?v=20260923-category-loop"></script>
<script src="top-bar.js?v=20260924-offers-header"></script>
  <script src="lang-switch.js?v=20260922-locale"></script>
  <script src="site-search.js?v=20260922-live-search" defer></script>

<body class="catalog-page offers-page has-map-watermark">
  <div class="page-map-watermark" aria-hidden="true"><img src="assets/brand/saudi-map-watermark.svg" alt="" draggable="false"></div>
  <!-- top-bar.js mounts the same search, actions and categories used by the catalog. -->
  <div class="geo-overlay" id="geo-overlay" role="dialog" aria-modal="true" aria-labelledby="geo-title" hidden>
    <div class="geo-panel">
      <button type="button" class="geo-close" id="geo-close" aria-label="إغلاق">&times;</button>
      <h2 id="geo-title" data-i18n="geo_title">موقعي على الخريطة</h2>
      <p class="geo-hint" data-i18n="geo_hint">الصق رابط موقعك من خرائط قوقل</p>
      <button type="button" class="geo-gps" id="geo-gps" data-i18n="geo_use_current">استخدم موقعي الحالي</button>
      <div class="geo-sep"><span data-i18n="geo_or">أو</span></div>
      <input type="url" id="geo-input" aria-labelledby="geo-title" data-i18n-placeholder="geo_placeholder" placeholder="الصق الرابط هنا...">
      <p class="geo-msg" id="geo-msg" role="status" hidden></p>
      <button type="button" class="geo-save" id="geo-save" data-i18n="geo_save">حفظ الموقع</button>
    </div>
  </div>
  <main class="catalog-main">
    <p id="offers-status" class="catalog-status" role="status"></p>
    <div id="offers-grid" class="catalog-grid" aria-busy="false"></div>
    <button id="offers-more" type="button" class="catalog-more" hidden data-i18n="home_more_products">عرض المزيد</button>
  </main>
</body>
</html>
